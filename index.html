<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7E7E3">
<title>Her Kingdom Wealth™</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* One committed light look in every theme: blush silk ground with a soft glow, shimmering gold foil,
   art-deco double-line arches, rounded blush-white cards. Layout: one phone-width app column with a frosted tab bar. */
:root{
  --bg:#F7E7E3; --bg-deep:#EFD2CB; --petal:#F3DCD6; --card:#FFFAF8; --card-2:#FFF4F1;
  --gold:#E2C07A; --gold-deep:#A8793A; --gold-text:#7A5426; --bronze:#4B2E20; --ink:#2B211E; --muted:#66504A;
  --rose:#B4566C; --ok:#3F7454; --line:rgba(168,121,58,.30); --line-soft:rgba(168,121,58,.16);
  --foil-text:linear-gradient(110deg,#5E3D14 0%,#8A5E24 22%,#B08243 38%,#7A5426 54%,#A57638 70%,#5E3D14 86%,#8A5E24 100%);
  --foil:linear-gradient(110deg,#94692B 0%,#D5AC5A 18%,#FBEDC2 34%,#C9984A 50%,#F2D896 66%,#A8793A 82%,#E9CB86 100%);
  --shadow:0 22px 48px -22px rgba(110,60,40,.35); --shadow-s:0 10px 26px -16px rgba(110,60,40,.32);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-serif:"Cormorant Garamond",Georgia,serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:radial-gradient(130% 55% at 50% 0%,#FDF4F1 0%,var(--bg) 48%,var(--bg-deep) 100%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:100px;position:relative}
h1,h2,h3{font-family:var(--f-display);color:var(--bronze);font-weight:600;letter-spacing:.07em;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.2}
h2{font-size:1.22rem;line-height:1.3}
h3{font-size:1rem;line-height:1.35}
p{margin:0}
sup.tm{font-family:var(--f-body);font-size:.42em;vertical-align:super;letter-spacing:0;margin-left:2px}
.foil{color:var(--gold-text)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .foil{background:var(--foil-text);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 8s linear infinite}
  .foil sup.tm{-webkit-text-fill-color:var(--gold-deep);color:var(--gold-deep)}
  h1{background:var(--foil-text);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 8s linear infinite}
  .neutral h1{background:none;color:#333;-webkit-text-fill-color:#333;animation:none}
}
h1{font-weight:700}
.hero-title{background-image:linear-gradient(100deg,#7E5626 0%,#93682D 32%,#A97C38 42%,#CDA55C 48%,#E2C27E 50%,#CDA55C 52%,#A97C38 58%,#93682D 68%,#7E5626 100%)!important;background-size:300% auto!important;animation:heroSheen 3.6s ease-in-out infinite!important;filter:drop-shadow(0 1px 0 rgba(255,250,240,.7))}
@keyframes heroSheen{0%{background-position:100% center}100%{background-position:0% center}}
.medal g *{vector-effect:non-scaling-stroke}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.fact{position:relative;background:linear-gradient(135deg,#FFFDFB,#F8E6E1);border:1px solid var(--line);border-left:4px solid var(--gold-deep);border-radius:18px;padding:18px;box-shadow:var(--shadow-s)}
.fact-stat{font-family:var(--f-serif);font-size:1.22rem;line-height:1.4;color:var(--bronze);font-weight:500}
.fact-move{background:rgba(63,116,84,.07);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.tool-pick{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--ink);background:#FFFCFB;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}
.tool-pick b{font-size:.86rem;color:var(--bronze)}
.tool-pick[aria-pressed="true"]{border-color:var(--gold-deep);background:linear-gradient(135deg,var(--petal),#FFF6F2);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.info{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--gold-deep);background:#FFFAF8;color:var(--gold-text);font:italic 600 13px/1 var(--f-serif);cursor:pointer;padding:0;vertical-align:middle}
.info:hover{background:var(--foil);background-size:220% auto;color:#3B2414;border-color:transparent}
.sheet{max-width:440px;width:100%}
.kb-item[hidden]{display:none!important}
.fine{font-size:.7rem;line-height:1.45;color:var(--muted)}
.mantle{font-family:var(--f-serif);font-style:italic;font-size:1.02rem;letter-spacing:.06em;color:var(--gold-text);margin-top:2px}
.mantle{display:flex;align-items:center;justify-content:center;gap:12px;white-space:nowrap}
.gem{display:inline-block;width:10px;height:14px;flex:none;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(110deg,#A8793A 0%,#C99541 30%,#F0D28C 44%,#FFF6DE 50%,#F0D28C 56%,#C99541 70%,#A8793A 100%);background-size:300% auto;animation:heroSheen 3.6s ease-in-out infinite}
.gem:last-child{animation-delay:1.8s}
@media (prefers-reduced-motion:reduce){.gem{animation:none;background-position:50% center}}
.copyright{text-align:center;letter-spacing:.02em;margin-top:6px}
.lead{font-size:1.02rem;line-height:1.7}
.tap{position:relative;padding-right:58px!important}
.tap::after{content:"⟶";position:absolute;right:16px;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:var(--foil);background-size:220% auto;color:#5E3D1C;font:500 15px/30px var(--f-body);text-align:center;-webkit-text-stroke:.25px #5E3D1C;box-shadow:0 6px 14px -8px rgba(168,121,58,.9)}
.tier-card{padding:18px 14px!important;align-items:center}
.tier-card::after{display:none}
.link-like{color:var(--gold-text);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.state.go{color:var(--gold-text)}
.chev{color:var(--gold-text);font-size:1.3rem;line-height:1}
.chips.why{gap:8px}.opt.chip{width:auto;display:inline-block;border-radius:999px;padding:10px 14px;font-size:.84rem}
@media (max-width:520px){.pc{grid-template-columns:1fr}}
.just{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.medal{display:block;flex:0 0 auto;filter:drop-shadow(0 4px 8px rgba(168,121,58,.25))}
.center .medal,.arch .medal{margin:0 auto}
.rule b,.progress span,.pill.solid,.tabs button[aria-selected="true"],.switch[aria-checked="true"],.bar .track span{animation:sheen 6s linear infinite}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
.enter .card,.enter .band,.enter .arch,.enter .plan,.enter .verse,.enter .hero{animation:rise .65s cubic-bezier(.2,.7,.2,1) both}
.enter .stack>:nth-child(2){animation-delay:.05s}.enter .stack>:nth-child(3){animation-delay:.1s}.enter .stack>:nth-child(4){animation-delay:.15s}.enter .stack>:nth-child(5){animation-delay:.2s}.enter .stack>:nth-child(n+6){animation-delay:.25s}
@keyframes sheen{to{background-position:220% center}}
.display{font-size:2.15rem;font-weight:700;line-height:1.12;letter-spacing:.06em}
.eyebrow{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
.tagline{font-family:var(--f-serif);font-style:italic;font-size:1.22rem;color:var(--bronze)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center;align-items:center}
.rule{display:flex;justify-content:center;align-items:center;margin:2px auto}
.rule i{display:block;height:2px;width:84px;background:linear-gradient(90deg,transparent,var(--gold-deep))}
.rule i:last-child{background:linear-gradient(90deg,var(--gold-deep),transparent)}
.rule b{display:block;height:5px;width:34px;background:var(--foil);border-radius:2px}
.demo-strip{font-size:.7rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;padding:10px 0 6px;border-bottom:1px solid var(--line-soft)}
.demo-strip button{font:inherit;color:var(--gold-text);background:none;border:0;padding:2px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.topbar{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:14px 0 12px;gap:8px}
.brand{font-family:var(--f-display);letter-spacing:.22em;font-size:.84rem;font-weight:700;background:none;border:0;padding:0;cursor:pointer;text-align:center;justify-self:center}
.chipbtn{font:600 .68rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,250,248,.8);color:var(--gold-text);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.chipbtn.r{justify-self:end}
.chipbtn.l{justify-self:start}
.btn{font:600 .76rem var(--f-body);letter-spacing:.2em;text-transform:uppercase;border:0;border-radius:999px;padding:16px 24px;cursor:pointer;width:100%;
  background:var(--foil);background-size:220% auto;background-position:0% center;color:#3B2414;transition:background-position .9s ease,transform .15s ease;
  box-shadow:0 12px 26px -12px rgba(168,121,58,.75),inset 0 1px 0 rgba(255,255,255,.65)}
.btn:hover{background-position:100% center}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.ghost{/* gold foil everywhere, per CB */}
.btn.inline{width:auto;padding:12px 20px}
.link{background:none;border:0;color:var(--gold-text);font:600 .82rem var(--f-body);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--card),var(--card-2));border:1px solid var(--line-soft);border-radius:18px;padding:18px;box-shadow:var(--shadow-s)}
.band{background:linear-gradient(135deg,var(--petal),#FAEDE9);border:1px solid var(--line-soft);border-radius:18px;padding:18px}
.tap{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:transform .2s ease,box-shadow .2s ease}
.tap:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.arch{position:relative;background:linear-gradient(180deg,#FFF9F6 0%,var(--petal) 100%);border:1px solid var(--gold);border-radius:260px 260px 18px 18px;padding:54px 22px 30px;text-align:center;
  box-shadow:inset 0 0 0 7px #FFF9F6,inset 0 0 0 8px rgba(201,152,74,.55),var(--shadow)}
.hero{display:grid;grid-template-columns:16px 1fr 16px;gap:10px;align-items:end;margin-top:6px}
.pillar{height:82%;border-radius:3px 3px 0 0;background:repeating-linear-gradient(90deg,#C9984A 0 2px,#FBEDC2 2px 4px,transparent 4px 7px);border-top:5px solid #B8893E;opacity:.85}
.crown{display:block;margin:0 auto 14px;filter:drop-shadow(0 8px 12px rgba(168,121,58,.35))}
label{font-size:.76rem;font-weight:600;color:var(--bronze);letter-spacing:.04em}
.req{color:var(--rose)}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;font:15px var(--f-body);color:var(--ink);background:#FFFCFB;border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
textarea{resize:vertical;min-height:120px}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:.8rem;font-weight:400;color:var(--ink);letter-spacing:0}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--gold-deep)}
.err{color:var(--rose);font-size:.8rem;font-weight:600}
.okmsg{color:var(--ok);font-size:.82rem;font-weight:600}
.opt{display:block;width:100%;text-align:left;font:15px var(--f-body);color:var(--ink);background:#FFFCFB;border:1px solid var(--line);padding:14px 16px;cursor:pointer;border-radius:14px;transition:border-color .2s,background .2s}
.opt[aria-pressed="true"]{border-color:var(--gold-deep);background:linear-gradient(135deg,var(--petal),#FFF6F2);box-shadow:inset 0 0 0 1px var(--gold-deep)}
.progress{height:5px;background:var(--petal);border-radius:5px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--foil);background-size:220% auto}
.pill{display:inline-block;font-size:.64rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--gold-deep);color:var(--gold-text);border-radius:999px;white-space:nowrap}
.pill.solid{background:var(--foil);background-size:220% auto;border-color:transparent;color:#3B2414}
.pill.rose{border-color:var(--rose);color:var(--rose)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.86rem}
.kv:last-child{border-bottom:0}
.kv b{color:var(--bronze);font-weight:600;text-align:right}
.num{font-variant-numeric:tabular-nums}
.verse{position:relative;padding:30px 22px 24px;text-align:center;background:linear-gradient(180deg,#FFFDFB,#FBECE7);border:1px solid var(--gold);border-radius:20px;box-shadow:inset 0 0 0 5px #FFFDFB,inset 0 0 0 6px rgba(201,152,74,.5),var(--shadow-s);margin-top:8px}
.verse::before{content:"";position:absolute;top:-8px;left:50%;width:14px;height:14px;background:var(--foil);background-size:220% auto;transform:translateX(-50%) rotate(45deg);border:2px solid #FFFDFB;box-shadow:0 2px 6px rgba(168,121,58,.4)}
.verse q{display:block;font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:1.42rem;line-height:1.42;color:#6A4632;quotes:"\201C" "\201D"}
.verse cite{display:inline-block;margin-top:14px;font-style:normal;font-weight:600;font-size:.66rem;letter-spacing:.22em;color:#3B2414;background:var(--foil);background-size:220% auto;padding:6px 14px;border-radius:999px;box-shadow:0 6px 14px -8px rgba(168,121,58,.8)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:0 0 auto;font:600 .68rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--line);background:#FFFAF8;color:var(--muted);cursor:pointer;border-radius:999px}
.tabs button[aria-selected="true"]{background:var(--foil);background-size:220% auto;border-color:transparent;color:#3B2414}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,250,248,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{position:relative;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;font:600 .6rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button[aria-current="page"]{color:var(--gold-text)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--foil)}
.module{display:grid;grid-template-columns:34px 1fr auto 14px;gap:12px;align-items:center;padding:13px 0;border:0;border-bottom:1px solid var(--line-soft);background:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.module:last-child{border-bottom:0}
.module .n{font-family:var(--f-display);color:var(--gold-text);font-size:1rem;text-align:center}
.module .t{font-size:.88rem;min-width:0}
.module.locked{opacity:.6}
.state{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.state.done{color:var(--ok)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle;background:var(--c)}
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scen>div{background:linear-gradient(135deg,var(--petal),#FAEDE9);border:1px solid var(--line-soft);border-radius:14px;padding:10px;min-width:0}
.scen .lab{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);font-weight:600}
.scen .val{font-family:var(--f-display);color:var(--bronze);font-size:1rem;margin-top:4px;overflow-wrap:anywhere}
.disclaim{font-size:.72rem;line-height:1.55;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;padding:4px 2px}
.msg{max-width:88%;padding:10px 14px;font-size:.86rem;line-height:1.5;border-radius:16px}
.msg.bot{background:var(--petal);border:1px solid var(--line-soft);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--foil);background-size:220% auto;color:#3B2414;align-self:flex-end;border-bottom-right-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button[aria-pressed="true"]{background:var(--foil);background-size:220% auto;color:#3B2414;border-color:transparent}
.chips button{font:500 .74rem var(--f-body);border:1px solid var(--line);background:#FFFAF8;color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.toggle:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px;flex:0 0 48px;border-radius:999px;border:1px solid var(--line);background:var(--petal);cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#FFFCFB;box-shadow:0 2px 4px rgba(75,46,32,.25);transition:left .2s}
.switch[aria-checked="true"]{background:var(--foil);background-size:220% auto;border-color:transparent}
.switch[aria-checked="true"]::after{left:23px}
.plan{border:1px solid var(--line-soft);background:linear-gradient(180deg,var(--card),var(--card-2));border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-s)}
.plan.feature{border:1px solid var(--gold-deep);box-shadow:var(--shadow),inset 0 0 0 4px #FFFAF8,inset 0 0 0 5px rgba(201,152,74,.45)}
.price{font-family:var(--f-display);color:var(--bronze);font-size:1.5rem}
.price small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);letter-spacing:0}
.plan ul{margin:0;padding-left:18px;font-size:.84rem}
.bar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;font-size:.8rem;padding:5px 0}
.bar .track{height:10px;background:var(--petal);border-radius:10px;overflow:hidden}
.bar .track span{display:block;height:100%;background:var(--foil);background-size:220% auto;border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--bronze);color:#FFF4F1;font-size:.82rem;padding:12px 18px;border-radius:14px;max-width:min(420px,calc(100% - 32px));box-shadow:var(--shadow)}
.word{position:relative;background:linear-gradient(180deg,#FFFDFB,#FDF3EF);border:1px solid rgba(201,152,74,.55);border-radius:18px;padding:22px 20px 18px;box-shadow:var(--shadow-s)}
.word::before{content:"";position:absolute;left:22px;right:22px;top:0;height:3px;background:var(--foil);background-size:220% auto;border-radius:0 0 3px 3px}
.word .row .crown{margin:0;flex:none}
.word-text{font-family:var(--f-serif);font-size:1.16rem;line-height:1.55;color:#4A2E22;text-align:left}
.word-sig{font-family:var(--f-serif);font-style:italic;font-size:1rem;color:var(--gold-text);margin-top:6px}
.word-sig b{font-style:normal;font-family:var(--f-display,Cinzel),serif;font-weight:600;letter-spacing:.06em;color:#4A2E22}

LESSONS['seed-0']={deep:true,mins:12,
 prosT:'What stewardship gives you',consT:'What stewardship asks of you',watchT:'Before you begin',
 intro:'Every wealth journey begins in the heart and the mind before it ever reaches a bank account. How you see money, what you believe about it, and whose it truly is will shape every decision you make from this day forward. Stewardship is the foundation, sister, and everything else you learn here is built upon it.',
 connect:'When your why and your money mindset agree, every choice you make moves you toward the life God called you to live.',
 sections:[
  ['Owner or steward?',['"The earth is the LORD\'s, and the fulness thereof" (Psalm 24:1). An owner asks, "What do I want to do with my money?" A steward asks, "What does God want me to do with what He has placed in my hands?"','That one shift changes everything. A steward is not careless, because the resources are not hers to waste. And a steward is not fearful, because the provision does not depend on her alone. She manages faithfully, gives willingly, and grows wisely, knowing she will one day give an account.']],
  ['Your money story',['Before you learned a single number, you learned a feeling about money. Perhaps money was scarce, or silent, or the source of every argument in your home. Perhaps it was used to control, or there was never enough to go around. What you lived through shaped what you believe, and what you believe shapes what you do.','Many women find their story in one of three patterns. The saver holds on tightly, because she remembers what it felt like to have nothing. The spender finds comfort in giving to others or to herself, because she was denied for so long. The avoider looks away, because looking hurts. None of these makes you less. Each one is a starting point, and every one of them can be healed and redeemed.','Your Money Story, on the You tab, walks you through discovering your own pattern.']],
  ['From scarcity to sufficiency',['A scarcity mindset says, "There will never be enough, so hold on or give up." A greed mindset says, "There is never enough, so get more." Scripture offers a third way: sufficiency. "God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work" (2 Corinthians 9:8).','Sufficiency is not settling for less, and it is not chasing more. It is trusting that God provides what you need, with enough left over to bless others. Building wealth from this place is not about greed. It is about capacity: the capacity to provide for your family, to give generously, and to fund the causes God has placed on your heart.']],
  ['The order of stewardship',['Faithful stewards follow an order. First, honor God: "Honour the LORD with thy substance, and with the firstfruits of all thine increase" (Proverbs 3:9). Second, pay your future self by saving before you spend. Third, live on what remains, with wisdom and with contentment.','Many women use a simple starting rhythm: give 10%, save 10%, and live on 80%. If that is not possible today, begin where you are. Give something, save something, and grow it a little each month. The rhythm matters more than the number.']],
  ['Faithful over few',['"He that is faithful in that which is least is faithful also in much" (Luke 16:10). Stewardship begins with whatever you have right now: $20 or $20,000. Wise women know where their money goes. They track it, they tell it where to go, and they review it regularly, not out of fear, but out of faithfulness.','Contentment is part of stewardship too. Paul learned "in whatsoever state I am, therewith to be content" (Philippians 4:11). Contentment is not a lack of ambition. It is freedom from the pressure to keep up with anyone else.']],
  ['Breaking generational patterns',['What you heal, you do not hand down. Each choice to save instead of panic, to plan instead of avoid, and to give instead of hoard plants a new seed in your family line. You may be the first woman in your family to build wealth, and that is not a burden. It is a calling.','"A good man leaveth an inheritance to his children\'s children" (Proverbs 13:22). Your legacy may pass to children, to nieces and nephews, to spiritual daughters, or to a ministry and a community. Every woman leaves an inheritance, and stewardship decides what it will be.']]
 ],
 pros:['Peace in place of panic','Clarity about where your money goes','Freedom to give without guilt or fear','A foundation every future lesson builds upon'],
 cons:['Honesty about where you are today','Patience, because lasting change takes time','Saying no to some wants so you can say yes to your vision','Facing old money wounds, sometimes with the help of a counselor or trusted friend'],
 watch:['Do not try to change everything in one week. Choose one new habit and keep it for 30 days.','Stewardship is not shame. Debt, mistakes, or a late start do not disqualify you.','Give from a willing heart, not from pressure: "not grudgingly, or of necessity: for God loveth a cheerful giver" (2 Corinthians 9:7). No one should pressure you to give money your household needs for food, shelter, or safety.','Be wary of anyone who promises quick riches in God\'s name. "He that maketh haste to be rich shall not be innocent" (Proverbs 28:20).','If someone else controls your money or your access to it, your safety comes first. The Safety resources in this app can help.'],
 fit:{rebuilder:'This is your fresh start. Begin by learning exactly what is yours, in your own name, and give yourself grace as you rebuild.',starter:'You have time on your side. The habits you form now will multiply for decades.',mom:'Your children are watching how you handle money. Let them see you plan, save, and give with peace.',exec:'A high income can hide a scarcity mindset. Ask whether your spending reflects your values or your stress.',ent:'Separate what belongs to the business from what belongs to your household, and steward both.',late:'It is not too late. A clear mindset and a steady plan can accomplish more than you think in the years ahead.',retiree:'Stewardship now means protecting what you have built and deciding how it will bless others.',legacy:'Consider how your values, not only your assets, will pass to the next generation.'},
 example:'Keisha earns $3,200 a month after taxes. She has always avoided looking at her bank account. This month she tracks every dollar, then sets a starting rhythm: $160 to give (5%), $160 to save (5%), and $2,880 to live on. Each quarter, she plans to raise her giving and her saving by 1%, until she reaches 10% each. In a year, she has given faithfully, saved nearly $2,500, and, most of all, she is no longer afraid to look. (Hypothetical example.)',
 terms:[['Stewardship','Managing what God has entrusted to you with faithfulness and purpose.'],['Money story','The beliefs and feelings about money you formed through your life experiences.'],['Scarcity mindset','The belief that there will never be enough.'],['Sufficiency','Trusting God to provide what you need, with enough left over to bless others.'],['Firstfruits','The first portion of your income, given to honor God.'],['Pay yourself first','Saving for your future before spending on anything else.']],
 verse:['Well done, thou good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things.','Matthew 25:21'],
 check:['Write down three things you learned about money growing up','Track every dollar you spend for seven days','Choose your starting rhythm for giving, saving, and living','Pray over your finances and write your stewardship commitment'],
 quiz:[{q:'What is the key difference between an owner and a steward?',o:['A steward has less money','A steward manages what belongs to God','An owner gives more generously'],a:1,why:'A steward manages faithfully what God has placed in her hands.'},
  {q:'According to 2 Corinthians 9:8, God provides "all sufficiency" so that you may:',o:['Abound to every good work','Never need to work again','Keep everything for yourself'],a:0,why:'Sufficiency means enough for your needs, with enough left over to bless others.'},
  {q:'What is the order of stewardship taught in this lesson?',o:['Spend, then save what is left','Honor God, save for your future, then live on what remains','Save everything and give nothing'],a:1,why:'Give first, pay your future self second, and live on the rest.'},
  {q:'What does Luke 16:10 teach about faithfulness?',o:['Only large amounts matter','Faithfulness in little leads to faithfulness in much','Wait until you have more to start'],a:1,why:'Stewardship begins with whatever you have right now.'},
  {q:'Which statement about giving reflects this lesson?',o:['Give even if your family goes without','Give from a willing heart, never under pressure','Giving is only for the wealthy'],a:1,why:'God loves a cheerful giver, and no one should pressure you to give what your household needs.'}]
};
LESSONS['seed-5']={deep:true,mins:12,
 intro:'An IPO, or initial public offering, is the moment a private company first sells shares to the public and lists on a stock exchange such as Nasdaq or the New York Stock Exchange. It is one of the most exciting events in investing, and one of the most misunderstood.',
 connect:'Understanding how IPOs really work protects the savings you have worked hard to build.',
 sections:[
  ['Why companies go public',['Companies go public to raise money for growth, research, or paying down debt, and to let early investors and employees sell some of their shares. Being listed can also build credibility with customers and partners.','The tradeoff: a public company must publish its financial results every quarter, disclose its risks, and answer to shareholders.']],
  ['How an IPO works, step by step',['1. The company hires investment banks, called underwriters, to manage the offering.','2. It files a registration statement, the S-1, with the Securities and Exchange Commission. The S-1 describes the business, its risks, its financial statements, and how the money raised will be used.','3. Executives present to large investors on a "roadshow."','4. A price range is announced, then a final price is set, usually the night before trading begins.','5. Shares are allocated, mostly to large institutions.','6. Trading begins. From that moment, anyone with a brokerage account can buy at the market price.']],
  ['Who gets shares at the IPO price',['Most shares at the offering price go to institutions such as mutual funds and pension funds. Some brokers offer limited IPO access to eligible customers, often with small allocations and rules about how long you must hold.','Most everyday investors buy on the first day of trading, at whatever price the market sets. That price can be far above the IPO price.']],
  ['Day one and the months after',['Excitement can push the first trade sharply higher (a "pop") or lower. Prices often swing widely in the first year.','The lock-up period, often about 180 days, keeps insiders from selling right away. When it ends, a wave of new shares can pressure the price. The first quarterly earnings report is another key moment.','Studies have found that many IPOs trail the broader market in the years after listing. The headline on day one is not the whole story.']],
  ['How to evaluate an IPO',['Read the S-1 and ask: Is revenue growing, and how fast? Is the company profitable, or is there a believable path to profit? How will it use the money raised? What do the risk factors warn about? Who controls the voting shares? Is the valuation reasonable compared with its revenue and its competitors?']]
 ],
 pros:['A chance to own an innovative company early in its public life','Public filings give you real information to study','You can buy or sell on any trading day','Reading an S-1 builds skills you will use for every investment'],
 cons:['First-day prices are often driven by excitement rather than value','A short track record as a public company','Large price swings, especially in the first year','Lock-up expirations can push prices down','Founders and insiders often keep voting control'],
 watch:['Never put your emergency fund, or money you need within five years, into a single IPO.','Keep any one stock to a small share of your portfolio; many investors use 5% or less.','Decide your maximum price before trading begins, and use a limit order.','Consider waiting for the first earnings report or the end of the lock-up.','A great company can still be a poor investment at the wrong price.'],
 fit:{rebuilder:'Focus on safety and your cash cushion first. For now, study IPOs rather than buy them.',starter:'If your emergency fund and employer match are in place, a small position can be a learning experience. Keep your foundation in diversified index funds.',mom:'Protect your family plan first: insurance, emergency fund, and education savings. Any IPO purchase should be small money you can leave alone for years.',exec:'You may have the means, but avoid concentration, especially if you already hold technology stock through your employer.',ent:'Your business is already a concentrated bet. Balance it with diversified investments before adding a single IPO.',late:'With fewer years to recover from a drop, keep speculative positions very small.',retiree:'Protecting principal and income usually matters more than a new listing. Many retirees keep IPO exposure minimal or indirect through funds.',legacy:'Weigh position size, tax planning on any gain, and whether indirect exposure through funds fits your legacy plan.'},
 example:'Suppose an IPO is priced at $40 a share. On the first morning, excitement pushes the opening trade to $62. With a market order, Maria pays whatever the price is when her order fills, perhaps $65. With a limit order at $50, her order fills only if the price comes down to $50 or lower. Over the next six months, the stock could rise, or fall well below $40. The day-one price guarantees nothing. (Hypothetical example.)',
 terms:[['IPO','Initial public offering: a company\'s first sale of shares to the public.'],['S-1','The registration statement filed with the SEC before an IPO.'],['Underwriter','The investment bank that manages the offering and sets the price.'],['Lock-up period','A window, often about 180 days, when insiders cannot sell their shares.'],['Limit order','An order to buy only at your chosen price or better.'],['Dual-class shares','A structure that gives some shareholders, often founders, more votes per share.']],
 verse:['For which of you, intending to build a tower, sitteth not down first, and counteth the cost?','Luke 14:28'],
 check:['Find a recent S-1 on SEC EDGAR and read its risk factors','Write your personal rule for the most you would put in any one stock','Practice placing a limit order in your broker\'s demo mode'],
 quiz:[{q:'What is an IPO?',o:['A company buying back its own shares','A private company\'s first sale of shares to the public','A government bond'],a:1,why:'An initial public offering opens ownership to the public for the first time.'},
  {q:'What does the S-1 contain?',o:['The business, its risks, financial statements, and use of proceeds','Only the stock price','A guarantee of returns'],a:0,why:'The S-1 is the company\'s detailed disclosure to investors.'},
  {q:'Who receives most shares at the IPO price?',o:['Every retail investor equally','Large institutions','Only employees'],a:1,why:'Institutions receive most allocations; everyday investors usually buy once trading begins.'},
  {q:'What is a lock-up period?',o:['A time when insiders cannot sell their shares','A time when the exchange is closed','A savings account term'],a:0,why:'When the lock-up ends, insider selling can pressure the price.'},
  {q:'Which best protects you from overpaying on day one?',o:['A market order','A limit order','Buying as early as possible'],a:1,why:'A limit order caps the price you will pay.'}]
};
LESSONS['sower-1']={deep:true,mins:14,
 intro:'An IRA, or individual retirement account, is an account you open yourself that gives your investments special tax advantages for retirement. Think of it as a protective container: you choose what goes inside (index funds, stocks, bonds, CDs, or cash), and the container shields the growth from taxes in a specific way.',
 connect:'Retirement accounts turn today\'s faithfulness into tomorrow\'s security and freedom.',
 sections:[
  ['An IRA is a container, not an investment',['Opening an IRA does not invest your money. After you deposit money, you must choose what to buy inside it. One of the most common mistakes is leaving IRA money sitting in cash for years.']],
  ['Traditional IRA vs. Roth IRA',['Traditional IRA: your contributions may be tax-deductible now, your money grows tax-deferred, and withdrawals in retirement are taxed as income. Required minimum distributions (RMDs) begin at age 73, or 75 for those born in 1960 or later.','Roth IRA: you contribute money you have already paid tax on. Growth and qualified withdrawals in retirement are tax-free. You can withdraw your contributions (not your earnings) at any time without tax or penalty, and the original owner never has RMDs.','A simple rule of thumb: a Roth often fits if you expect your tax rate to be higher later; a traditional IRA often fits if your tax rate is higher now.']],
  ['2026 limits and rules',['You can contribute up to $7,500 a year across all your IRAs, or $8,600 if you are 50 or older (a $1,100 catch-up).','You need earned income to contribute, or a working spouse for a spousal IRA.','Roth eligibility phases out between $153,000 and $168,000 of income for single filers, and between $242,000 and $252,000 for married couples filing jointly.','If you or your spouse has a workplace plan, the traditional IRA deduction may phase out (for single filers covered at work, between $81,000 and $91,000). Limits change every year.']],
  ['How an IRA works with your 401(k)',['A common order of operations: first, contribute enough to your workplace 401(k) to capture the full employer match, which is free money. Next, many people fund a Roth IRA. Then they return to the 401(k), whose 2026 limit is $24,500, plus an $8,000 catch-up at 50 or older ($11,250 for ages 60 to 63).']],
  ['Withdrawing early',['Before age 59½, withdrawals of earnings or traditional IRA money generally owe income tax plus a 10% penalty. Exceptions include a first-time home purchase (up to $10,000 over your lifetime), qualified education expenses, certain medical costs, and disability. Roth earnings also need the account to be at least five years old. An IRA is not an emergency fund.']],
  ['The spousal IRA',['A spouse who stays home or earns little can still contribute to her own IRA, based on the working spouse\'s income. It protects her independence and her own retirement security.']]
 ],
 pros:['Tax-free growth (Roth) or tax-deferred growth (traditional)','A possible tax deduction now (traditional)','You choose the investments inside','Roth contributions stay accessible','A spousal IRA builds retirement security for a spouse at home','Roth accounts have no RMDs for the original owner and can be powerful to pass on'],
 cons:['Annual contribution limits','Taxes and penalties for most early withdrawals','Roth income limits','Traditional withdrawals are taxed, and RMDs are required','Investments inside can lose value and are not FDIC-insured unless held as bank CDs or cash','The rules can be complex'],
 watch:['Build your emergency fund before funding an IRA; do not lock away money you may need soon.','Capture any employer 401(k) match first.','Do not let IRA money sit uninvested in cash.','If your income is near the Roth limits, check before contributing to avoid excess-contribution penalties.','For conversions or a "backdoor Roth," consult a certified tax professional.'],
 fit:{rebuilder:'Once your safety cushion is in place, a Roth IRA is often a flexible first retirement account, because contributions can be withdrawn if life demands it.',starter:'A Roth IRA is often a strong fit. Your tax rate may be lower now than later, and decades of tax-free growth add up.',mom:'If you are home with your children, a spousal IRA lets you keep building your own retirement on your spouse\'s income.',exec:'If your income is above the Roth limits, ask a certified tax professional about the "backdoor Roth" and whether a traditional deduction is available.',ent:'An IRA is a start, but a SEP IRA or Solo 401(k) may let you save far more as a business owner.',late:'Use the age-50 catch-up, and think about which mix of taxable-now and taxable-later money gives you the most flexibility in retirement.',retiree:'Plan withdrawals, RMDs, and any Roth conversions with a professional to manage taxes.',legacy:'Roth accounts can be powerful to pass on. Review beneficiary designations and conversion strategies with your estate planning attorney and certified tax professional.'},
 example:'Grace is 30 and invests $300 a month in a Roth IRA. At a hypothetical 7% average yearly return, she would have about $366,000 at age 60, from $108,000 of her own contributions. In a Roth, qualified withdrawals of all of it would be tax-free. (Hypothetical example; returns are not guaranteed.)',
 terms:[['Earned income','Wages, salary, or self-employment income; required to contribute to an IRA.'],['Tax-deferred','Taxes are paid later, when you withdraw.'],['Qualified withdrawal','A Roth withdrawal after age 59½ from an account open at least five years; tax-free.'],['RMD','Required minimum distribution: the yearly withdrawal traditional accounts must begin in later life.'],['Catch-up contribution','An extra amount allowed at age 50 and older.'],['Backdoor Roth','A strategy high earners use to reach a Roth through a traditional IRA contribution and conversion.']],
 verse:['Provideth her meat in the summer, and gathereth her food in the harvest.','Proverbs 6:8'],
 check:['Confirm you have earned income and decide which IRA fits your tax situation','Make sure you are capturing your full employer match','Choose a broad index fund to hold inside your IRA'],
 quiz:[{q:'An IRA is best described as:',o:['An investment that guarantees returns','A tax-advantaged container you fill with investments','A checking account'],a:1,why:'You choose the investments inside the IRA.'},
  {q:'From a Roth IRA, you can withdraw your contributions:',o:['Only after age 73','At any time without tax or penalty','Never'],a:1,why:'Contributions, not earnings, can be withdrawn anytime.'},
  {q:'The 2026 IRA contribution limit for someone under 50 is:',o:['$7,500','$24,500','No limit'],a:0,why:'$7,500 across all IRAs, or $8,600 at 50 or older.'},
  {q:'What do many people do before funding an IRA?',o:['Capture the full employer 401(k) match','Buy a single hot stock','Close their savings account'],a:0,why:'The employer match is free money.'},
  {q:'A spousal IRA allows:',o:['A non-working spouse to save for her own retirement','Two people to share one account','Unlimited contributions'],a:0,why:'It is based on the working spouse\'s income.'}]
};

 treasury:{t:'U.S. Treasury Securities and Savings Bonds',s:'Loans to the U.S. government, among the safest investments available. Options include Treasury bills, notes, and bonds, plus I bonds and EE savings bonds.',
  sec:[['Bills, notes, and bonds','Treasury bills mature in one year or less; notes in 2 to 10 years; bonds in 20 or 30 years. Buy them at TreasuryDirect.gov or through a brokerage account. Interest is exempt from state and local income taxes.'],['I bonds and EE bonds','I bonds earn a rate tied to inflation. You must hold them at least one year, and cashing in before five years costs the last three months of interest. You can buy up to $10,000 a year per person electronically at TreasuryDirect.gov. EE bonds are guaranteed to double in value if held for 20 years.'],['A family benefit','Savings bond interest can be tax-free when used for qualified higher education, subject to income limits.']],
  pros:['Backed by the U.S. government','No state or local income tax on interest','I bonds protect against inflation'],cons:['Lower long-term returns than stocks','I bonds and EE bonds lock up money for at least a year','Purchase limits on savings bonds'],fit:'Safe money beyond your emergency fund, short-term goals, and conservative investors.',lesson:null},
 '529':{t:'529 Education Savings Plan',s:'A tax-advantaged account for education. Money grows tax-free, and withdrawals are tax-free when used for qualified education costs.',
  sec:[['How it works','529 plans are sponsored by states, and you can usually use any state\'s plan. Many states offer a state tax deduction for contributions to their own plan. Parents, grandparents, and friends can all contribute.'],['A 529 for yourself','You do not have to be a parent to open one. You can name yourself as the beneficiary to save for your own degree, graduate school, certificate, or career training, and use it for tuition, books, fees, and even a computer. If you will use the money within a few years, choose a conservative investment option rather than the age-based option designed for children. Any money left over can go to a child or other family member.'],['What it covers (2026)','College and graduate school costs; K-12 tuition up to $20,000 a year per student starting in 2026; and, since July 2025, career credentials and training such as cosmetology, welding, and professional licensing.'],['If your child does not go to college','You can change the beneficiary to another family member. After the account has been open more than 15 years, up to $35,000 over a lifetime can be rolled into the beneficiary\'s Roth IRA, within annual IRA limits.']],
  pros:['Tax-free growth and qualified withdrawals','Possible state tax deduction','Flexible beneficiary changes'],cons:['Earnings used for non-qualified expenses are taxed and penalized 10%','Investment choices are limited to the plan\'s menu','State rules vary'],fit:'Parents and grandparents saving for a child\'s education, and women saving for their own degree, certificate, or career training.',lesson:null},
 coverdell:{t:'Coverdell Education Savings Account',s:'A smaller education account (up to $2,000 a year per child) with tax-free growth for K-12 and college costs, subject to income limits.',
  sec:[['How it works','Contributions are limited to $2,000 a year per beneficiary, and higher earners may not be eligible. Funds must generally be used by age 30.']],
  pros:['Wide investment choice','Covers K-12 and college costs'],cons:['Low annual limit','Income limits'],fit:'Families who want more investment choice alongside a 529.',lesson:null},
 custodial:{t:'Custodial Accounts (UTMA/UGMA) and Custodial Roth IRA',s:'Accounts an adult manages for a child. The money belongs to the child and transfers to them at the age of majority in your state.',
  sec:[['UTMA/UGMA','You invest on your child\'s behalf in stocks, funds, or bonds. Gifts are irrevocable, and the child gains control at 18 to 21, depending on the state. Some earnings may be taxed at the parent\'s rate (the "kiddie tax").'],['Custodial Roth IRA','If your child has earned income, such as from a job or modeling, you can open a Roth IRA for them, up to the amount they earned. Decades of tax-free growth make this one of the most powerful gifts you can give.']],
  pros:['Teaches investing early','Flexible use (UTMA/UGMA)','Custodial Roth: tax-free growth for decades'],cons:['The child controls the money at adulthood','Can affect financial aid more than a 529','A Roth requires the child\'s earned income'],fit:'Parents and grandparents building generational wealth.',lesson:null},
 trumpacct:{t:'Trump Accounts for Children',s:'A new tax-advantaged investment account for children created in 2025, with a one-time $1,000 government deposit for eligible children born 2025 through 2028.',
  sec:[['How it works','Any child under 18 with a Social Security number can have one. U.S. citizen children born 2025 through 2028 receive a one-time $1,000 deposit. Families can contribute up to $5,000 a year (2026), and employers up to $2,500 of that. Money must be invested in low-cost funds that track a U.S. stock index.'],['Access and taxes','Withdrawals generally are not allowed before age 18; after that, traditional IRA rules apply. Accounts are expected to open after July 4, 2026, and some details are still being finalized.']],
  pros:['$1,000 seed for eligible newborns','Employer contributions possible','Low-cost index investing'],cons:['Money is locked until 18','Earnings are taxable when withdrawn','Rules are new and still being finalized'],fit:'Families with children, especially babies born 2025 through 2028.',lesson:null},

  pros:['Triple tax advantage','The money is yours even if you change jobs','Can be invested'],cons:['Requires a high-deductible health plan','Non-medical withdrawals before 65 are taxed and penalized'],fit:'Healthy earners with a high-deductible plan.',lesson:null},
 sep:{t:'SEP IRA and Solo 401(k)',s:'Retirement plans for business owners and the self-employed, with much higher contribution limits than a regular IRA.',
  sec:[['SEP IRA','Your business contributes a percentage of your compensation, up to an annual cap. It is simple to open and maintain.'],['Solo 401(k)','For business owners with no employees other than a spouse. You contribute as both the employee and the employer, which can allow even more savings, and many plans offer a Roth option.']],
  pros:['High contribution limits','Tax advantages for your business','Flexible year to year'],cons:['More paperwork than an IRA','A SEP requires covering eligible employees too'],fit:'Entrepreneurs and self-employed women.',lesson:null},
 cashvalue:{t:'Cash-Value Life Insurance (Whole, Universal, and IUL)',s:'Permanent life insurance that builds a cash value you can borrow against. Powerful in the right situations, but expensive and complex.',
  sec:[['How the cash value works','Part of each premium builds a cash value that grows over time. Whole life grows at a guaranteed rate; universal and indexed universal life (IUL) can vary with interest rates or a market index, usually with caps and floors.'],['Borrowing against your policy','You can take a policy loan against the cash value without a credit check, and repay it on your own schedule, with interest. This is the idea behind "be your own bank" or "infinite banking" strategies. Unpaid loans reduce the death benefit, and if loans grow larger than the cash value, the policy can lapse and trigger taxes.'],['Know the costs','Premiums are often many times higher than term insurance for the same coverage, cash value builds slowly in the early years, and agents often earn large commissions. Ask for the full illustration and fee details, and consider a fee-only advisor\'s second opinion.']],
  pros:['Lifetime coverage','Cash value you can borrow against','Can support estate and legacy planning'],cons:['High premiums and fees','Slow early growth','Loans reduce the death benefit; lapses can trigger taxes','Complex and often oversold'],fit:'High earners who have already maxed out retirement accounts, business owners, and estate planning needs. For most families, affordable term life comes first.',lesson:null},
 homebuy:{t:'Buying Your First Home',s:'Homeownership is one of the most common ways families build wealth. Here is the path and the programs that can help.',
  sec:[['The steps','1. Check and strengthen your credit. 2. Save for a down payment and closing costs (closing costs often run 2% to 5% of the price). 3. Get preapproved by a lender. 4. Choose a real estate agent. 5. Make an offer. 6. Get an inspection and appraisal. 7. Close and receive your keys.'],['Loan options','Conventional loans (some first-time buyer programs allow as little as 3% down); FHA loans (as little as 3.5% down with qualifying credit); VA loans for eligible veterans and service members (often no down payment); USDA loans in eligible rural areas (no down payment, income limits).'],['Help with the down payment','Many state housing finance agencies, cities, and nonprofits offer down payment and closing cost assistance for first-time buyers. A HUD-approved housing counselor can guide you for free or at low cost.'],['The true cost of owning','Beyond the mortgage: property taxes, homeowners insurance, mortgage insurance on smaller down payments, and maintenance (many plan for 1% to 2% of the home\'s value each year).']],
  pros:['Builds equity over time','Stable housing costs with a fixed-rate loan','Possible tax benefits'],cons:['Large upfront costs','Repairs and maintenance','Less flexibility to move'],fit:'Women with steady income, solid credit, an emergency fund, and plans to stay several years.',lesson:null},
 va:{t:'VA Home Loans for Veterans',s:'Home loans guaranteed by the Department of Veterans Affairs for eligible veterans, service members, and some surviving spouses, often with no down payment.',
  sec:[['Key benefits','Often no down payment and no private mortgage insurance, competitive rates, and limits on closing costs. A one-time VA funding fee applies, which may be waived for veterans receiving disability compensation.'],['Getting started','Request your Certificate of Eligibility through VA.gov or your lender, then work with a VA-approved lender. VA.gov also lists housing counseling and other veteran benefits.']],
  pros:['Often no down payment','No private mortgage insurance','Benefit can be reused'],cons:['Funding fee (unless exempt)','Home must meet VA standards','For a primary residence'],fit:'Eligible veterans, active-duty service members, and some surviving spouses.',lesson:null},
 rental:{t:'Rental Property and House Hacking',s:'Owning property that others rent can provide monthly income and long-term growth, if you plan carefully.',

  pros:['Monthly income','Long-term appreciation','Tenants help pay down the loan'],cons:['Landlord responsibilities','Vacancies and repairs','Debt magnifies losses as well as gains'],fit:'Women with a solid financial foundation who are ready for hands-on investing.',lesson:null},
 reit:{t:'REITs (Real Estate Investment Trusts)',s:'Companies that own income-producing real estate. Buying REIT shares or a REIT fund lets you invest in real estate without being a landlord.',
  sec:[['How they work','REITs must pay out most of their taxable income as dividends. You can buy them like stocks or through low-cost REIT index funds.']],
  pros:['Real estate exposure with small amounts','Regular dividends','Easy to buy and sell'],cons:['Prices swing with the stock market','Dividends are usually taxed as ordinary income'],fit:'Investors who want real estate in their portfolio without owning property.',lesson:null},
 business:{t:'Building a Business as an Asset',s:'A business you own can become one of your largest assets, providing income, jobs, and something to pass on.',
  sec:[['Make it an asset','Form a legal entity, keep business and personal money separate, track your numbers monthly, and build systems so the business can run without you.'],['Free help','The SBA\'s Women\'s Business Centers offer free or low-cost counseling and training, and SCORE provides free mentoring. Community development financial institutions (CDFIs) lend in communities that traditional banks often underserve.']],
  pros:['Unlimited income potential','Tax advantages','An asset you can sell or pass down'],cons:['Risk of loss','Irregular income','Demands time and energy'],fit:'Entrepreneurs and women with a skill or idea to scale.',lesson:null},

  pros:['Free matching money','Financial coaching included','Builds the savings habit'],cons:['Income and use limits','Not available everywhere','Waiting lists in some areas'],fit:'Women starting from little savings who want a first home, education, or business.',lesson:null}

KB.unclaimed={t:'Find Unclaimed Money and Property',s:'Billions of dollars are waiting for their rightful owners: forgotten deposits, refunds, final paychecks, insurance benefits, and property left by loved ones. Searching is free, and what is yours belongs to you.',
 sec:[['What unclaimed property is','When a business cannot reach you, it must eventually turn your money over to the state, which holds it for you, often with no deadline to claim it. Common examples: a utility or rental deposit you never got back after you moved, a final paycheck, an old bank or credit union account, uncashed checks and refunds, stock dividends, insurance payouts, and money left by a family member who passed away.'],
  ['Search every state where you have lived','<b>MissingMoney.com</b> lets you search almost every state at once, for free. It is endorsed by the National Association of Unclaimed Property Administrators (NAUPA). Hawaii is the only state not included, so search Hawaii on its own site if you have lived there. You can also search each state\'s unclaimed property program directly through <b>unclaimed.org</b>. Search your current name, your maiden or former names, and the names of parents and grandparents who have passed away.<br><br><a class="btn inline" href="https://www.missingmoney.com" target="_blank" rel="noopener noreferrer">Search MissingMoney.com</a><br><br><a class="link" href="https://unclaimed.org" target="_blank" rel="noopener noreferrer">Find your state at unclaimed.org</a>'],
  ['Other places money may be waiting','<b>Old 401(k)s and pensions:</b> the Department of Labor\'s Retirement Savings Lost and Found, and the Pension Benefit Guaranty Corporation\'s unclaimed pension search at pbgc.gov.<br><b>Life insurance:</b> the NAIC Life Insurance Policy Locator, free, to find policies on a loved one who has passed away; and VA unclaimed insurance funds for veterans\' families.<br><b>Savings bonds:</b> Treasury Hunt at TreasuryDirect.gov.<br><b>Credit union deposits:</b> the NCUA unclaimed deposits search.<br><b>Unpaid wages:</b> the Department of Labor Wage and Hour Division\'s Workers Owed Wages search.<br><b>Tax refunds:</b> unclaimed federal refunds must generally be claimed within three years, so file even a late return if you are owed money.'],
  ['When a loved one has passed away','As an heir, you may be able to claim money or property held in a loved one\'s name, even if there was no will. You will usually need a death certificate and proof that you are an heir. For land or a home, search the deed records at the county recorder of deeds (or register of deeds) where the property is located. Property sometimes sits unclaimed for generations, and descendants have reclaimed it many years later. An estate or probate attorney can help you establish your right to it.'],
  ['Protect yourself','Searching and claiming through official state programs is always free. Be careful with "finders" who contact you and ask for a percentage of your money; you can almost always claim it yourself. Never pay a fee to search, and only use official .gov sites, MissingMoney.com, or unclaimed.org.']],
 pros:['Searching is free','Many claims can be filed online','There is often no deadline to claim'],cons:['Claims for a deceased relative require documents','Some claims take weeks or months to process','Watch out for scams and paid "finders"'],fit:'Every woman. Search once a year, and search for your parents and grandparents too.',lesson:null};
KB.reportfolio={t:'Growing a Real Estate Portfolio',s:'Your first home can be the beginning, not the end. Over a lifetime, many women build wealth by keeping homes as rentals, buying more properties, and even owning commercial real estate.',
 sec:[['Keep a home when you move','Most of us move several times in a lifetime. Instead of selling, you may be able to keep a home and rent it out, letting tenants help pay down the mortgage while the property grows in value. Run the numbers first: rent should cover the mortgage, taxes, insurance, repairs, and vacancies.'],
  ['Add properties over time','Many investors grow one property at a time: a duplex they live in, then a single-family rental, then a small apartment building. Each property builds equity you can use toward the next.'],
  ['Commercial real estate','Retail storefronts, office space, storage, and small multifamily buildings can provide strong income, often with longer leases. Commercial loans usually require larger down payments and more experience, so many women start with residential property and grow from there.'],
  ['Tax tools to know','When you sell your primary home, you may exclude up to $250,000 of profit from tax ($500,000 for married couples filing jointly) if you lived there two of the last five years. For investment property, a 1031 exchange can let you defer taxes by reinvesting the proceeds into another property. Work with a tax professional.'],
  ['Hold property wisely','Many investors hold rental and commercial property in an LLC for liability protection, carry the right insurance, and keep each property\'s money separate. An attorney and a CPA can help you set it up well.']],
 pros:['Monthly income from tenants','Equity that grows over time','Real assets you can pass down'],cons:['Landlord work, or the cost of a manager','Vacancies and repairs','Debt magnifies losses as well as gains'],fit:'Women who own a home or are preparing to, and want real estate to be a lasting part of their wealth.',lesson:null};
PATHS.forEach(p=>{if(p[0]==='Real estate')p[2].splice(1,0,'reportfolio');if(p[0]==='Programs and resources')p[2].push('unclaimed')});

function factHere(t){return (t.go&&t.go===S.view)||(t.tool&&S.view==='app'&&S.tab==='tools')||(t.kb&&S.view==='app'&&S.tab==='library'&&S.kb===t.kb)}
function factCard(i){
 let k=i%FACTS.length;for(let n=0;n<FACTS.length&&factHere(FACTS[k].to);n++)k=(k+1)%FACTS.length;
 const f=FACTS[k],t=f.to,attr=t.kb?`data-kb="${t.kb}"`:t.go?`data-go="${t.go}"`:`data-tool="${t.tool}"`;
 return `<section class="fact stack-s" aria-label="Know the numbers"><p class="eyebrow">Know the numbers</p><p class="fact-stat">${f.s}</p><p class="fine">Source: ${f.src}</p>
  <div class="fact-move"><p class="eyebrow" style="color:var(--ok)">Your move</p><p class="small">${f.m}</p></div><button class="link" ${attr}>${f.cta} →</button></section>`;
}

/* ---------- Mellody Hobson: the woman Rev. Dr. Banks looked up to ---------- */
function mellodyCard(){return `<section class="word stack-s" aria-label="The woman I looked up to"><div class="row" style="gap:10px;flex-wrap:nowrap;justify-content:flex-start">${crown(38)}<p class="eyebrow">The woman I looked up to</p></div>
 <p class="word-text">When I was a little girl from Chicago, I needed to see someone who looked like me living the life I was dreaming of. I found her in Mellody Hobson.</p>
 <p class="word-text">Mellody is a Black woman, born and raised in Chicago, the youngest of six children raised by a single mother. There were seasons when the rent money was not there. Yet she earned her way to Princeton, walked into Ariel Investments as a summer intern, and rose to become its president and then its co-CEO, helping grow the firm into one that manages billions of dollars.</p>
 <p class="word-text">Today she serves on the board of JPMorgan Chase, is a part owner of the Denver Broncos, and with her husband has pledged to give the majority of their wealth away. But what drew me to her was never only her success. It was her integrity and her presence, her wisdom and her knowledge, and the way she teaches financial literacy so that women like us can build too.</p>
 <p class="word-text">I saw myself in her, sister, and I pray you see yourself in her, and in me. She rose from Chicago. I rose from Chicago. And wherever you are rising from, you will rise too.</p>
 <p class="word-sig">With love and faith,<br><b>Rev. Dr. Cherie Banks</b></p></section>`}

/* ---------- Bankruptcy and medical debt (Knowledge Base) ---------- */
Object.assign(KB,{
 bankruptcy:{t:'Bankruptcy: A Legal Fresh Start',s:'Bankruptcy is a legal process, protected by federal law, that can erase or restructure debts you cannot repay. It was designed to give honest people a fresh start, and for some women it is the wisest next step.',
  sec:[['When it may be the right choice','Consider talking with a bankruptcy attorney if your debts are so large that you cannot see a way to repay them in the next five years, if you are facing wage garnishment, foreclosure, repossession, or lawsuits, or if a crisis beyond your control has left you drowning. The most common causes are a job loss or drop in income, a divorce, and a medical crisis, followed by the death of a spouse, a business that did not survive, caring for a sick family member, or debt a former partner ran up in your name. There is no shame in using a protection the law provides. Scripture itself describes a "year of release," when debts were forgiven so families could start again (Deuteronomy 15:1–2).'],
   ['Chapter 7 or Chapter 13','<b>Chapter 7</b> (liquidation) wipes out most unsecured debts, such as credit cards, medical bills, and personal loans, usually within a few months. You must pass a "means test" based on your income. Some property may be sold to repay creditors, but every state protects certain essentials. <b>Chapter 13</b> (repayment plan) lets you keep your property and repay part of your debts over three to five years. It is often used to stop a foreclosure and catch up on a mortgage or car loan.'],
   ['What about Chapter 11?','Chapter 11 is a reorganization used mainly by businesses. Individuals can file it too, usually only when their debts are larger than Chapter 13 allows, such as a very large mortgage. It is the most complex and expensive type, and requires an attorney. Small businesses may qualify for a simpler version called Subchapter V. (Chapter 12 is a special version for family farmers and fishermen.) Most women facing personal debt will use Chapter 7 or Chapter 13.'],
   ['What it can and cannot erase','It can usually erase credit cards, medical bills, personal loans, and past-due utility bills. It usually cannot erase child support, alimony, most student loans (unless you prove undue hardship), most recent taxes, or court-ordered fines. Filing creates an "automatic stay" that stops most collection calls, lawsuits, garnishments, and foreclosures while your case is open.'],
   ['The steps','1. Take a credit counseling course from a U.S. Trustee-approved agency within the 180 days before you file (often online, low cost or free).<br>2. File your petition with the bankruptcy court. The filing fee is $338 for Chapter 7 and $313 for Chapter 13. You can ask to pay in installments, and the Chapter 7 fee can be waived if your income is below 150% of the federal poverty guidelines.<br>3. Attend a short "meeting of creditors" with the bankruptcy trustee.<br>4. Complete a personal financial management course.<br>5. Receive your discharge, the court order that releases you from the debts.'],
   ['Your credit after bankruptcy','A Chapter 7 bankruptcy can stay on your credit report for up to 10 years and a Chapter 13 for 7 years, though its effect on your score fades over time. Many people start receiving credit card offers soon after their discharge, because they no longer owe other debts, but these offers often carry very high interest rates and fees. Rebuild wisely: a secured credit card, a credit-builder loan from a credit union, and paying every bill on time. This time, build your emergency fund first.'],
   ['Do it yourself or hire an attorney','Some people with simple Chapter 7 cases file on their own, and free tools such as Upsolve can help if you qualify. Chapter 13, owning a home, running a business, or having significant assets usually calls for an attorney. Most bankruptcy attorneys offer a free consultation. To find one: your state bar\'s lawyer referral service, the National Association of Consumer Bankruptcy Attorneys (nacba.org), or legal aid if your income is low. Beware of "debt relief" companies that charge large fees up front.'],
   ['Try these first, if you can','Ask the hospital for its financial assistance policy (nonprofit hospitals are required to offer help), call a nonprofit credit counselor about a debt management plan, and negotiate directly with creditors. If none of these can close the gap, bankruptcy may be the healthier path.']],
  pros:['Stops collection calls, lawsuits, and garnishment','Erases most credit card and medical debt','A true fresh start, protected by law','Chapter 13 can save a home from foreclosure'],cons:['Stays on your credit report for 7 to 10 years','Some debts cannot be erased','Some property may be sold in Chapter 7','Court fees, course fees, and attorney fees'],fit:'Women overwhelmed by debt they cannot realistically repay, especially after a job loss, divorce, or medical crisis. Always get a free consultation with a licensed bankruptcy attorney before deciding.',lesson:null},
 medicaldebt:{t:'Medical Bills and Medical Debt',s:'Medical bills are one of the most common reasons families fall behind. Before you pay, borrow, or give up, know your options.',
  sec:[['Ask for financial assistance','Nonprofit hospitals are required to offer financial help to people who cannot afford their care. Ask for the hospital\'s Financial Assistance Policy, apply with your recent pay stub or tax return, and ask what happens to your bill while they review it.'],['Check every bill','Request an itemized bill and compare it to your insurance explanation of benefits. Billing errors are common. You can ask for corrections and negotiate the balance or a no-interest payment plan.'],['Pause collections','If a bill has gone to collections, tell the collector you are applying for financial assistance and ask them to pause collections while the hospital decides.'],['If it is still too much','Talk with a nonprofit credit counselor, and if the debt is overwhelming, learn about bankruptcy, which can erase medical debt.']],
  pros:['Many hospitals reduce or forgive bills for qualifying patients','No-interest payment plans are common'],cons:['Help may take persistence and paperwork'],fit:'Any woman facing medical bills she cannot afford.',lesson:null}
});
