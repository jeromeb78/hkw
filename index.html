Object.assign(LESSONS,{"seed-1": {"deep": true, "mins": 12, "intro": "You cannot steward what you cannot see. Your money map shows exactly where you stand today: what you own, what you owe, and where every dollar goes each month. It is not a judgment, sister. It is a starting point, and every wealthy woman you admire began with one.", "connect": "When you can see your whole financial picture, you can direct every dollar toward the life you are building.", "sections": [["Know your net worth", ["Your net worth is everything you own minus everything you owe. Add up your assets: cash, savings, retirement accounts, investments, and the value of your home or car. Then add up your debts: credit cards, student loans, car loans, a mortgage, and medical bills. Subtract the second number from the first.", "If the number is negative, take heart. Many women begin there, especially after school, a divorce, or a season of caring for others. What matters is the direction it moves from here, not where it starts."]], ["Track before you budget", ["For 30 days, write down every dollar that comes in and every dollar that goes out. Use your bank statements, an app, or a simple notebook. Most women are surprised by what they find: subscriptions they forgot, small daily purchases that add up, and fees they never noticed.", "\"Be thou diligent to know the state of thy flocks, and look well to thy herds\" (Proverbs 27:23). Knowing your numbers is an act of faithfulness."]], ["Build a budget that tells your money where to go", ["A budget is a plan for your money before the month begins. One simple starting framework is 50/30/20: about 50% for needs, 30% for wants, and 20% for saving, giving, and paying down debt. Adjust it to your season. A woman rebuilding may start with 5% for saving; a high earner may save far more.", "Your budget is yours. It should reflect your values and your why, not someone else's expectations."]], ["Give every dollar an assignment", ["A zero-based budget assigns every dollar a purpose, so income minus planned spending, giving, and saving equals zero. Money without an assignment tends to disappear. Money with an assignment builds something.", "Plan for the irregular expenses too: car registration, holidays, birthdays, and annual subscriptions. Divide each yearly cost by 12 and set that amount aside monthly."]], ["Review it monthly", ["Choose one day each month to review your money map. Update your net worth, compare your spending to your plan, and celebrate progress. Many women pair this with prayer, asking God for wisdom about the month ahead.", "Your Wealth Journey on the Home screen is built for this monthly check-in."]]], "pros": ["Clarity about exactly where you stand", "Fewer surprises and less money stress", "A clear starting line to measure your growth", "Confidence in every money conversation"], "cons": ["It takes honesty to look at the real numbers", "Tracking takes a few minutes every day at first", "The first month may feel uncomfortable", "A budget needs adjusting as life changes"], "watch": ["Do not judge yourself by your starting number; judge yourself by your direction.", "Include every debt, even the ones you would rather forget.", "Never share your account numbers or passwords with a budgeting app you have not verified.", "If someone else controls your money, keep your notes private and safe; your safety comes first."], "tip": "Before you sign up for a budgeting app, read how it uses your data. Many free apps earn money by selling insights about your spending. A simple spreadsheet or notebook keeps your numbers private.", "fit": {"starter": "Build the habit now, and it will serve you for life.", "mom": "Include your children's costs by season: school, activities, and clothes.", "rebuilder": "Start with what is in your own name, and map it one account at a time.", "ent": "Keep separate maps for your household and your business.", "exec": "A high income makes tracking more important, not less.", "late": "Your map shows where to focus your energy for the years ahead.", "retiree": "Track your income sources and your withdrawal rate each month.", "legacy": "Include every account your family will need to know about."}, "example": "Tanya lists her assets: $1,200 in checking, $800 in savings, $4,500 in her 401(k), and a car worth $9,000, for $15,500 in total. Her debts are a $6,000 car loan and $3,200 on credit cards, for $9,200. Her net worth is $6,300. After tracking for 30 days, she finds $140 a month in unused subscriptions, cancels them, and sends that money to her emergency fund. (Hypothetical example.)", "terms": [["Net worth", "Everything you own minus everything you owe."], ["Asset", "Something you own that has value."], ["Liability", "Money you owe."], ["Budget", "A plan for your money before the month begins."], ["Zero-based budget", "A budget where every dollar of income is assigned a purpose."], ["Sinking fund", "Money set aside monthly for a known future expense."]], "verse": ["Be thou diligent to know the state of thy flocks, and look well to thy herds.", "Proverbs 27:23"], "check": ["Calculate your net worth today", "Track every dollar for the next 30 days", "Cancel one subscription you no longer use", "Choose your monthly money review day"], "quiz": [{"q": "Net worth is:", "o": ["Your monthly income", "Everything you own minus everything you owe", "Your credit score"], "a": 1, "why": "It is the clearest single measure of where you stand."}, {"q": "What should you do before building a budget?", "o": ["Track your spending for 30 days", "Open a new credit card", "Buy a budgeting course"], "a": 0, "why": "Tracking shows you where your money actually goes."}, {"q": "In the 50/30/20 framework, the 20% goes to:", "o": ["Entertainment", "Saving, giving, and paying down debt", "Rent only"], "a": 1, "why": "It is the portion that builds your future."}, {"q": "A zero-based budget means:", "o": ["You spend nothing", "Every dollar of income is given a purpose", "You have zero debt"], "a": 1, "why": "Income minus everything planned equals zero."}, {"q": "A negative net worth means:", "o": ["You have failed", "You owe more than you own today, which is a starting point", "You cannot invest ever"], "a": 1, "why": "Many women start there; direction matters more than the start."}, {"q": "How can you plan for a $600 yearly car registration?", "o": ["Ignore it until it is due", "Set aside $50 a month", "Put it on a credit card"], "a": 1, "why": "Dividing yearly costs by 12 removes the surprise."}, {"q": "Proverbs 27:23 teaches us to:", "o": ["Know the state of our flocks", "Hide our wealth", "Spend freely"], "a": 0, "why": "Knowing your numbers is faithful stewardship."}, {"q": "Which is an asset?", "o": ["A credit card balance", "A retirement account", "A car loan"], "a": 1, "why": "Assets are things you own that have value."}, {"q": "How often should you review your money map?", "o": ["Once a year", "Monthly", "Only in an emergency"], "a": 1, "why": "A monthly review keeps you on course."}, {"q": "Before using a free budgeting app, you should:", "o": ["Read how it uses your data", "Share your passwords", "Link every account immediately"], "a": 0, "why": "Some free apps earn money from your spending data."}], "cta": {"label": "Open Your Wealth Journey", "go": "home"}}, "seed-2": {"deep": true, "mins": 11, "intro": "Your emergency fund is your first financial goal and the foundation beneath everything else you will build. It turns a crisis into an inconvenience, keeps you out of debt when life happens, and gives you the freedom to make choices from peace instead of panic.", "connect": "An emergency fund protects your why when life brings the unexpected.", "sections": [["Why it comes before investing", ["Investments go up and down. If you have to sell during a downturn to pay for a car repair, you lock in a loss. An emergency fund lets your investments stay invested while you handle life's surprises with cash.", "\"There is treasure to be desired and oil in the dwelling of the wise; but a foolish man spendeth it up\" (Proverbs 21:20)."]], ["How much is enough", ["Most women build in stages. First, save $1,000. Next, save one month of essential expenses. Then grow it to three to six months. If your income is irregular, you are self-employed, or you are the only earner, aim for six months or more.", "Essential expenses mean what you truly need: housing, utilities, food, transportation, insurance, and minimum debt payments."]], ["Where to keep it", ["Keep your emergency fund in a high-yield savings account or a money market account at an FDIC-insured bank or NCUA-insured credit union. These protect your deposits up to $250,000 per depositor, per insured institution, for each account ownership category.", "Keep it separate from your everyday checking so it is not spent by accident, but easy to reach within a day or two."]], ["What counts as an emergency", ["A job loss, a medical bill, an urgent home or car repair, or the need to leave an unsafe home quickly. A sale, a vacation, or a holiday is not an emergency; those belong in their own savings goals.", "If you use your emergency fund, celebrate that it worked, then rebuild it before returning to other goals."]], ["Building it faster", ["Automate a transfer on every payday, even $25. Add tax refunds, bonuses, and gifts. Sell what you no longer need. Every dollar you save here is a dollar you will not have to borrow at 25% interest later."]]], "pros": ["Peace when life brings surprises", "Keeps you out of high-interest debt", "Lets your investments stay invested", "Gives you freedom to leave an unhealthy job or home"], "cons": ["Cash earns less than long-term investments", "It takes patience to build", "It can feel slow at first", "Inflation slowly reduces what cash can buy"], "watch": ["Keep it at an FDIC- or NCUA-insured institution.", "Do not invest your emergency fund in stocks or cryptocurrency.", "If someone else controls the household money, consider a small fund in your own name at a bank they do not use.", "Rebuild it after every use."], "tip": "Name your savings account \"Emergency Only.\" Most banks let you rename accounts, and seeing that name makes you pause before you spend it.", "fit": {"starter": "Start with $1,000, then build one month at a time.", "mom": "Aim for six months; children bring surprises.", "rebuilder": "Even a small fund in your own name is a powerful step toward independence.", "ent": "Keep a household fund and a separate business reserve.", "exec": "Six months protects your choices if your role changes.", "late": "Build it before investing heavily, so a surprise never forces you to sell.", "retiree": "Keep one to two years of withdrawals in cash or near-cash.", "legacy": "Teach the next generation to build their own fund first."}, "example": "Monique's essential expenses are $2,800 a month. She saves $1,000 first, then sets up a $200 transfer every payday, twice a month. She adds her $1,500 tax refund. In 15 months, she has $8,500, about three months of essentials. When her car needs a $1,100 repair, she pays cash and feels peace instead of panic. (Hypothetical example.)", "terms": [["Emergency fund", "Cash set aside only for true emergencies."], ["Essential expenses", "What you truly need each month to live."], ["High-yield savings account", "A savings account that pays more interest than a typical account."], ["Money market account", "A bank account that often pays higher interest and may allow limited check writing."], ["FDIC", "The federal agency that insures bank deposits up to legal limits."], ["NCUA", "The federal agency that insures credit union deposits."]], "verse": ["There is treasure to be desired and oil in the dwelling of the wise; but a foolish man spendeth it up.", "Proverbs 21:20"], "check": ["Total your essential monthly expenses", "Open or rename a separate emergency savings account", "Set up an automatic transfer on payday", "Choose your first milestone: $1,000"], "quiz": [{"q": "Your emergency fund is:", "o": ["Your first financial goal", "Optional once you invest", "Money for vacations"], "a": 0, "why": "It is the foundation for everything you build next."}, {"q": "A common full target is:", "o": ["One week of expenses", "Three to six months of essential expenses", "Ten years of income"], "a": 1, "why": "Three to six months covers most surprises."}, {"q": "Who should aim for six months or more?", "o": ["Someone with irregular income or a single income", "No one", "Only retirees"], "a": 0, "why": "Less predictable income needs a bigger cushion."}, {"q": "Where should an emergency fund be kept?", "o": ["In individual stocks", "In an insured high-yield savings or money market account", "In cryptocurrency"], "a": 1, "why": "It needs to be safe and easy to reach."}, {"q": "FDIC insurance covers deposits up to:", "o": ["$25,000", "$250,000 per depositor, per bank, per ownership category", "Unlimited amounts"], "a": 1, "why": "That is the standard federal limit."}, {"q": "Which is a true emergency?", "o": ["A holiday sale", "An urgent car repair", "A concert ticket"], "a": 1, "why": "Emergencies are urgent and necessary."}, {"q": "Why does an emergency fund come before investing?", "o": ["So you never have to sell investments in a downturn", "Because investing is wrong", "Because cash always grows faster"], "a": 0, "why": "Cash protects your investments from forced selling."}, {"q": "After using your emergency fund, you should:", "o": ["Rebuild it", "Close the account", "Borrow to replace it"], "a": 0, "why": "Rebuilding keeps your protection in place."}, {"q": "A helpful first milestone is:", "o": ["$100,000", "$1,000", "$10"], "a": 1, "why": "A first win builds momentum."}, {"q": "Proverbs 21:20 teaches that the wise:", "o": ["Spend everything", "Keep treasure in their dwelling", "Borrow often"], "a": 1, "why": "Wise women set aside for the future."}], "cta": {"label": "Compare savings & money market accounts", "lib": "cash"}}, "seed-3": {"deep": true, "mins": 12, "intro": "Not all debt is the same. Some debt can help you build wealth over time; other debt quietly drains it every month. Learning the difference, and knowing your rights, gives you power over your money instead of letting your money be controlled by others.", "connect": "Every dollar freed from high-interest debt becomes a dollar working for your why.", "sections": [["Good debt and bad debt", ["Debt can be helpful when it is affordable, has a reasonable interest rate, and pays for something likely to grow in value or increase your income, such as a home you can afford or education that raises your earning power.", "Debt is harmful when it has a high interest rate and pays for things that lose value quickly: most credit card balances, payday loans, and buy-now-pay-later plans used for everyday wants."]], ["The true cost of interest", ["A $5,000 credit card balance at 24% interest, paid at $150 a month, takes more than four and a half years to repay and costs about $3,300 in interest. The same $150 invested each month could be growing for you instead.", "\"The rich ruleth over the poor, and the borrower is servant to the lender\" (Proverbs 22:7)."]], ["Two proven payoff methods", ["The debt snowball pays your smallest balance first while paying the minimum on the rest. Each win builds momentum. The debt avalanche pays your highest interest rate first, which saves the most money over time.", "Both work. Choose the one you will stick with."]], ["Avoid the traps", ["Payday loans and title loans can carry yearly costs above 300%. Buy-now-pay-later plans can lead to many small payments you lose track of. Store cards often charge the highest rates.", "If you are struggling, a nonprofit credit counseling agency approved by the U.S. Department of Justice or accredited by the National Foundation for Credit Counseling can help you build a plan."]], ["Know your rights", ["Federal law limits how debt collectors may treat you. Your Credit Comeback in the Restore tab quotes the laws and shows where to report abuse.", "Before paying an old debt in collections, check your state's statute of limitations; in many states, a payment can restart the clock."]]], "pros": ["Paying off high-interest debt is a guaranteed return", "Lower monthly stress", "More money freed for saving and giving", "A stronger credit profile over time"], "cons": ["It takes discipline and time", "Some wants must wait", "Old habits can pull you back", "Some debts, like student loans, have special rules"], "watch": ["Never take a payday or title loan to pay another debt.", "Be wary of debt settlement companies that charge fees before settling anything.", "Do not close your oldest credit card without considering your credit history.", "Check the statute of limitations before paying an old collection debt."], "tip": "Call your credit card company and ask for a lower interest rate. Many women who have paid on time are surprised to get a yes, and it costs nothing to ask.", "fit": {"starter": "Avoid high-interest debt now, and you protect your future.", "mom": "Keep children's expenses off high-interest cards whenever possible.", "rebuilder": "List every debt in your name; some may not be yours to pay.", "ent": "Separate business debt from personal debt.", "exec": "A high income can hide high balances; pay them off quickly.", "late": "Pay off high-interest debt before retirement.", "retiree": "Avoid new debt on a fixed income.", "legacy": "Teach your family the difference between helpful and harmful debt."}, "example": "Erica has three debts: a $600 store card at 29%, a $3,000 credit card at 24%, and a $9,000 car loan at 7%. Using the snowball, she pays off the store card in three months, then rolls that payment into the credit card. Within two years, both cards are gone, and she redirects $350 a month to her emergency fund and investing. (Hypothetical example.)", "terms": [["Interest rate", "The yearly cost of borrowing money."], ["APR", "Annual percentage rate, the yearly cost of credit including some fees."], ["Debt snowball", "Paying the smallest balance first."], ["Debt avalanche", "Paying the highest interest rate first."], ["Payday loan", "A short-term, very high-cost loan due on your next payday."], ["Statute of limitations", "The time limit for a creditor to sue over a debt."]], "verse": ["The rich ruleth over the poor, and the borrower is servant to the lender.", "Proverbs 22:7"], "check": ["List every debt with its balance and interest rate", "Choose the snowball or the avalanche", "Call one card company to request a lower rate", "Put an extra $25 toward your first target debt"], "quiz": [{"q": "Debt is generally more helpful when it:", "o": ["Has a high rate and buys things that lose value", "Is affordable, reasonably priced, and builds value or income", "Is a payday loan"], "a": 1, "why": "Helpful debt supports long-term growth."}, {"q": "The debt snowball pays first:", "o": ["The highest rate", "The smallest balance", "The newest debt"], "a": 1, "why": "Quick wins build momentum."}, {"q": "The debt avalanche pays first:", "o": ["The highest interest rate", "The smallest balance", "The oldest debt"], "a": 0, "why": "It saves the most interest."}, {"q": "Payday loans can cost:", "o": ["Less than 5% a year", "More than 300% a year", "Nothing"], "a": 1, "why": "They are among the most expensive forms of credit."}, {"q": "Proverbs 22:7 teaches that the borrower is:", "o": ["Servant to the lender", "Always wealthy", "Free"], "a": 0, "why": "Debt can limit your freedom."}, {"q": "Before paying an old debt in collections, you should:", "o": ["Check your state's statute of limitations", "Pay immediately", "Ignore all letters"], "a": 0, "why": "A payment can restart the clock in many states."}, {"q": "A good source of debt help is:", "o": ["A nonprofit, approved credit counseling agency", "A company charging fees before settling anything", "A payday lender"], "a": 0, "why": "Approved nonprofits can help you build a plan."}, {"q": "Asking your card company for a lower rate:", "o": ["Costs a fee", "Costs nothing and often works", "Hurts your credit"], "a": 1, "why": "It is a free, simple request."}, {"q": "Which usually loses value quickly?", "o": ["A home you can afford", "Everyday purchases on a credit card", "Education that raises income"], "a": 1, "why": "Consumer purchases rarely grow in value."}, {"q": "Which method is best?", "o": ["Only the snowball", "Only the avalanche", "The one you will stick with"], "a": 2, "why": "Consistency matters most."}], "cta": {"label": "Open Your Credit Comeback", "go": "restore"}}, "seed-4": {"deep": true, "mins": 11, "intro": "Compound growth is the quiet miracle of patient wealth. When your money earns returns, and those returns earn returns, your wealth grows faster over time. Time is the most powerful ingredient, so the sooner you begin, the more God can multiply what you plant.", "connect": "Compound growth turns small, faithful steps today into abundance for the future you are praying for.", "sections": [["How compounding works", ["Suppose you invest $1,000 and it earns 7% in a year. You now have $1,070. The next year, you earn 7% on $1,070, not just on your original $1,000. Each year, the growth grows. Over decades, the curve rises steeply.", "\"Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase\" (Proverbs 13:11)."]], ["Time matters more than timing", ["A woman who invests $200 a month from age 25 to 35 and then stops can end up with more at 65 than a woman who invests $200 a month from 35 to 65, because the first woman's money had more years to grow. Starting early is a gift to your future self.", "If you are starting later, do not lose heart. Compounding still works; you may simply invest more each month."]], ["The rule of 72", ["To estimate how long it takes your money to double, divide 72 by your yearly rate of return. At 6%, money doubles in about 12 years. At 9%, it doubles in about 8 years.", "The same rule works against you with debt: at 24% interest, a balance can double in about 3 years if left unpaid."]], ["What helps compounding", ["Start early, invest consistently, reinvest your dividends, keep your fees low, and stay invested through downturns. Every one of these lets your growth keep growing."]], ["What breaks compounding", ["Selling in a panic, paying high fees, withdrawing early, and stopping contributions all interrupt the curve. Patience is a spiritual discipline and a financial one."]]], "pros": ["Small amounts can grow into large sums over time", "Rewards patience and consistency", "Works automatically once you start", "Helps you build wealth for generations"], "cons": ["It needs time, often decades", "Investment returns are never guaranteed", "Early years can feel slow", "Fees and withdrawals reduce its power"], "watch": ["Past returns do not guarantee future results.", "Be wary of anyone promising guaranteed high returns; that is a red flag.", "Do not withdraw early unless you truly must.", "Keep your emergency fund in place so you are never forced to sell."], "tip": "Set your investment account to reinvest dividends automatically. It is usually one setting, and it keeps your growth compounding without any extra effort.", "fit": {"starter": "Your greatest advantage is time; start now, even with a small amount.", "mom": "Small monthly amounts for your children can grow for decades.", "rebuilder": "Begin with what you can, and let time work on your behalf.", "ent": "Pay yourself first, and invest consistently from your profits.", "exec": "Maximize your workplace plan to let compounding work on larger sums.", "late": "Increase your monthly amount; compounding still rewards every year.", "retiree": "Keep part of your money invested so it can continue to grow.", "legacy": "Investments for grandchildren can compound for a lifetime."}, "example": "Grace invests $200 a month starting at 25. At an average 7% yearly return, she would have about $525,000 by 65, having contributed $96,000. If she waited until 35, she would have about $244,000. Ten years of waiting would cost her about $280,000. (Hypothetical illustration; returns are not guaranteed.)", "terms": [["Compound growth", "Earning returns on both your money and its past returns."], ["Rate of return", "How much an investment grows in a year, as a percentage."], ["Rule of 72", "Divide 72 by your rate of return to estimate the years to double."], ["Dividend", "A portion of a company's profit paid to shareholders."], ["Reinvesting", "Using dividends to buy more shares."], ["Time horizon", "How long you plan to invest before you need the money."]], "verse": ["Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase.", "Proverbs 13:11"], "check": ["Try the compound growth calculator with your own numbers", "Turn on automatic dividend reinvestment", "Choose a monthly amount you can invest faithfully", "Write down your time horizon"], "quiz": [{"q": "Compound growth means:", "o": ["Earning returns on your money and its past returns", "Earning a fixed amount forever", "Paying interest on debt"], "a": 0, "why": "Growth builds on growth."}, {"q": "The most powerful ingredient in compounding is:", "o": ["Luck", "Time", "Timing the market"], "a": 1, "why": "More years mean more growth on growth."}, {"q": "Using the rule of 72, money earning 6% doubles in about:", "o": ["6 years", "12 years", "72 years"], "a": 1, "why": "72 divided by 6 is 12."}, {"q": "At 24% interest, unpaid debt can double in about:", "o": ["3 years", "24 years", "Never"], "a": 0, "why": "72 divided by 24 is 3."}, {"q": "Which helps compounding?", "o": ["Reinvesting dividends", "Panic selling", "High fees"], "a": 0, "why": "Reinvested dividends buy more shares."}, {"q": "Which interrupts compounding?", "o": ["Staying invested", "Withdrawing early", "Investing monthly"], "a": 1, "why": "Early withdrawals stop the growth."}, {"q": "If you start later, you can:", "o": ["Never benefit", "Invest more each month", "Only buy one stock"], "a": 1, "why": "Compounding still works at any age."}, {"q": "A promise of guaranteed high returns is:", "o": ["A red flag", "Normal", "Required by law"], "a": 0, "why": "Real investments carry risk."}, {"q": "Proverbs 13:11 teaches that wealth gathered by labour:", "o": ["Shall increase", "Disappears", "Is sinful"], "a": 0, "why": "Steady, faithful effort grows."}, {"q": "Are investment returns guaranteed?", "o": ["Yes, always", "No, they are never guaranteed", "Only in good years"], "a": 1, "why": "All investing carries risk."}], "cta": {"label": "Open the compound growth calculator", "tool": "compound"}}, "seed-5": {"deep": true, "mins": 13, "intro": "Stocks, bonds, ETFs, and index funds are the building blocks of most investment portfolios. Once you understand what each one is, the language of investing stops feeling like a foreign tongue, and you can choose with confidence.", "connect": "Knowing your building blocks lets you build a plan that fits your why.", "sections": [["Stocks: owning a piece of a company", ["A share of stock is a small piece of ownership in a company. When the company grows and profits, your shares can rise in value, and some companies pay dividends. When the company struggles, your shares can fall.", "Stocks have historically grown more than most other investments over long periods, but they can rise and fall sharply along the way."]], ["Bonds: lending your money", ["A bond is a loan you make to a government or company. In return, they pay you interest and repay your money at a set date. Bonds are generally steadier than stocks but usually grow more slowly.", "U.S. Treasury bonds are backed by the federal government. Corporate bonds pay more interest but carry more risk."]], ["Funds: many investments in one", ["A mutual fund or an exchange-traded fund (ETF) holds many stocks, bonds, or both in one investment. With one purchase, you can own hundreds of companies, which spreads your risk.", "ETFs trade throughout the day like a stock. Mutual funds are priced once a day after the market closes."]], ["Index funds: owning the whole market", ["An index fund follows a market index, such as the S&P 500, which tracks about 500 of the largest U.S. companies. Instead of trying to pick winners, you own a slice of all of them.", "Index funds usually have very low fees, and over long periods, many outperform funds run by managers trying to beat the market."]], ["Putting them together", ["Many investors use a mix: stocks for growth, bonds for stability, and cash for safety. Your mix depends on your age, your goals, and your comfort with ups and downs. You will learn more about this in the Sower tier's asset allocation lesson."]]], "pros": ["Stocks offer long-term growth potential", "Bonds bring steadiness and income", "Funds spread your risk across many holdings", "Index funds offer low costs and simplicity"], "cons": ["Stocks can fall sharply in the short term", "Bonds can lose value when interest rates rise", "Some funds charge high fees", "No investment is guaranteed"], "watch": ["Read a fund's expense ratio before you buy.", "Do not put all your money in one company's stock.", "Understand that funds can lose value too.", "Invest money you will not need for at least five years in stocks and stock funds."], "tip": "Before buying any fund, look up its expense ratio. A difference between 0.05% and 1% may look small, but over 30 years, it can cost you tens of thousands of dollars.", "fit": {"starter": "A low-cost index fund is a simple, diversified place to begin.", "mom": "Index funds keep investing simple when life is busy.", "rebuilder": "Start with one diversified fund rather than individual stocks.", "ent": "Diversify outside your business with funds.", "exec": "Avoid holding too much of your employer's stock.", "late": "A mix of stock and bond funds can balance growth and steadiness.", "retiree": "Bonds and dividend-paying funds can support steady income.", "legacy": "Broad funds are simple to pass on and manage."}, "example": "Renee invests $100 a month in an S&P 500 index fund with a 0.05% expense ratio. With one fund, she owns a small piece of about 500 companies. When one company struggles, the others balance it out. She adds a bond fund later as she gets closer to retirement. (Hypothetical example.)", "terms": [["Stock", "A share of ownership in a company."], ["Bond", "A loan to a government or company that pays interest."], ["Mutual fund", "A pool of investments, priced once a day."], ["ETF", "Exchange-traded fund, a pool of investments that trades like a stock."], ["Index fund", "A fund that follows a market index."], ["Expense ratio", "The yearly fee a fund charges, as a percentage."]], "verse": ["Give a portion to seven, and also to eight; for thou knowest not what evil shall be upon the earth.", "Ecclesiastes 11:2"], "check": ["Look up the S&P 500 and what it measures", "Find the expense ratio of one index fund", "Write down your investing time horizon", "List what you already own in any retirement account"], "quiz": [{"q": "A share of stock is:", "o": ["A loan to a company", "A piece of ownership in a company", "A savings account"], "a": 1, "why": "Stockholders own part of the company."}, {"q": "A bond is:", "o": ["A loan to a government or company", "Ownership in a company", "A type of cryptocurrency"], "a": 0, "why": "Bondholders lend money and receive interest."}, {"q": "An index fund:", "o": ["Tries to pick winning stocks", "Follows a market index", "Guarantees returns"], "a": 1, "why": "It owns the companies in an index."}, {"q": "The S&P 500 tracks about:", "o": ["50 companies", "500 large U.S. companies", "5,000 small companies"], "a": 1, "why": "It is a broad measure of large U.S. companies."}, {"q": "An ETF trades:", "o": ["Once a year", "Throughout the day like a stock", "Only by phone"], "a": 1, "why": "ETFs trade on an exchange during market hours."}, {"q": "The expense ratio is:", "o": ["A fund's yearly fee", "Your tax rate", "A stock's price"], "a": 0, "why": "Lower fees leave more for you."}, {"q": "Which is generally steadier but grows more slowly?", "o": ["Stocks", "Bonds", "Single tech stocks"], "a": 1, "why": "Bonds trade growth potential for steadiness."}, {"q": "Funds help you:", "o": ["Spread risk across many holdings", "Avoid all risk", "Avoid all fees"], "a": 0, "why": "Diversification reduces single-company risk."}, {"q": "Ecclesiastes 11:2 encourages us to:", "o": ["Give a portion to seven, and also to eight", "Put everything in one place", "Avoid investing"], "a": 0, "why": "Spreading out is ancient wisdom."}, {"q": "Money you need within two years usually belongs in:", "o": ["Individual stocks", "Safer places like savings or short-term bonds", "Cryptocurrency"], "a": 1, "why": "Short timelines need stability."}]}, "seed-6": {"deep": true, "mins": 12, "intro": "Before you open an investment account, learn the signs of fraud. Scammers target women, especially women who are new to investing, recently widowed or divorced, or eager to build wealth quickly. Knowing the red flags protects your money, your peace, and your family.", "connect": "Protecting what you have is part of honoring the why God placed in your heart.", "sections": [["The biggest red flags", ["Promises of guaranteed high returns. Pressure to act now. Requests to pay by gift card, cryptocurrency, wire transfer, or payment app to someone you do not know. Requests for your Social Security number, passwords, or account codes. An investment you cannot verify independently.", "\"The simple believeth every word: but the prudent man looketh well to his going\" (Proverbs 14:15)."]], ["Common scams aimed at women", ["Romance scams begin with a new online relationship that turns to money. Investment scams promise to double your money through a special app or cryptocurrency. Impostor scams pretend to be your bank, the government, or a family member in trouble. Affinity fraud uses shared faith or community to earn trust; it can even happen through church connections."]], ["Verify before you trust", ["Check any broker on FINRA BrokerCheck (brokercheck.finra.org) and any investment adviser on the SEC's Investment Adviser Public Disclosure site (adviserinfo.sec.gov). The SEC is the federal agency that protects investors. FINRA is the organization, overseen by the SEC, that licenses and disciplines brokers.", "Call your bank using the number on the back of your card, never a number from a text or email."]], ["If you have been scammed", ["Act right away. Lock your card in your bank's app and your credit card company's app. Call each one's fraud department, then follow up in writing. Place a free fraud alert or a free credit freeze with Equifax, Experian, and TransUnion.", "Report it at ReportFraud.ftc.gov, IdentityTheft.gov, the FBI's IC3.gov, and with your state attorney general. Credit cards offer the strongest protection; money sent by Zelle or a bank transfer you approved is often harder to recover."]], ["Protect yourself every day", ["Use strong, unique passwords and two-step verification on every financial account. Never click links in unexpected texts. Slow down: real opportunities do not disappear in an hour."]]], "pros": ["Protects the money you have worked hard for", "Gives you confidence to invest safely", "Helps you protect your family and friends", "Reduces stress and fear"], "cons": ["Scams change constantly", "Scammers can be very convincing", "Recovering money is often difficult", "It takes vigilance every day"], "watch": ["Never pay anyone with gift cards or cryptocurrency because they asked you to.", "Never share a code sent to your phone.", "Never move money to \"protect\" it because a caller told you to.", "If something feels wrong, stop and call someone you trust."], "tip": "Shop online with a credit card, especially during the holidays. By federal law, you owe at most $50 for unauthorized credit card charges, and most card companies waive even that. Debit cards and bank transfers offer far less protection.", "fit": {"starter": "Learn the red flags now, before you ever invest.", "mom": "Teach your children never to share codes or passwords.", "rebuilder": "Life transitions attract scammers; slow down before any money decision.", "ent": "Watch for fake invoices and business impostor scams.", "exec": "Be alert to targeted email scams aimed at leaders.", "late": "Be wary of anyone promising to help you catch up quickly.", "retiree": "Scammers often target retirees; verify every call and offer.", "legacy": "Protect older family members by talking openly about scams."}, "example": "Denise meets a kind man online who, after weeks of messages, tells her about a cryptocurrency app that doubled his money. He urges her to start with $2,000. She remembers the red flags: a new online relationship, pressure, a guaranteed return, and an app she cannot verify. She stops, searches the app's name with the word \"scam,\" and finds dozens of warnings. She blocks him and reports it at ReportFraud.ftc.gov. (Hypothetical example.)", "terms": [["SEC", "U.S. Securities and Exchange Commission, the federal agency that protects investors."], ["FINRA", "Financial Industry Regulatory Authority, the organization that licenses and oversees brokers."], ["BrokerCheck", "FINRA's free search to check a broker's license and history."], ["Credit freeze", "A free block that stops new credit from being opened in your name."], ["Fraud alert", "A free notice that tells lenders to verify your identity."], ["Affinity fraud", "A scam that targets members of a shared group, such as a church."]], "verse": ["The simple believeth every word: but the prudent man looketh well to his going.", "Proverbs 14:15"], "check": ["Turn on two-step verification for your bank account", "Look up one adviser or broker on BrokerCheck", "Save your bank's fraud number in your phone", "Talk with a loved one about these red oosing a home for your money. A broker is the company that holds your investment account and buys and sells investments for you. This lesson walks you through choosing one, opening an account, and the ways women invest on their own.", "connect": "The right home for your money makes it easier to invest faithfully toward your why.", "sections": [["What a broker does", ["In the United States, buying stocks on an exchange always goes through a broker. Online brokers such as E*TRADE, SoFi Invest, Robinhood, J.P. Morgan Self-Directed Investing, Fidelity, Charles Schwab, and Vanguard let you buy and sell investments yourself from your phone or computer.", "Your account at a registered brokerage is generally protected by SIPC up to $500,000, including $250,000 for cash, if the firm fails. SIPC does not protect against investment losses."]], ["Self-directed or guided", ["Self-directed investing means you make every choice yourself through an online broker. Guided investing means an adviser or a robo-adviser chooses or recommends investments for you, usually for a fee.", "Many women begin self-directed with a simple index fund, then seek guidance as their wealth and needs grow."]], ["Investing without a traditional brokerage account", ["Direct stock purchase plans and dividend reinvestment plans let you buy shares straight from some companies through their transfer agent. TreasuryDirect.gov lets you buy U.S. Treasury securities and I bonds directly from the government. Fund companies let you buy their mutual funds directly. And your workplace retirement plan invests for you through payroll."]], ["Choosing a broker", ["Compare fees, account minimums, the investments offered, ease of use, customer service, and educational tools. Check that the firm is registered on FINRA BrokerCheck. Many brokers now offer commission-free stock and ETF trades and no account minimums."]], ["Opening an account", ["You will need your legal name, address, date of birth, Social Security number (required by law for tax reporting by the brokerage itself), employment information, and a bank account to fund it. Choose the account type: an individual taxable account, a joint account, or a retirement account such as a Roth or traditional IRA.", "Turn on two-step verification right away."]], ["A word about day trading", ["Day trading means buying and selling the same investment within a single day. It carries high risk, and most day traders lose money over time. The SEC approved replacing the old $25,000 pattern day trader minimum; brokers such as E*TRADE implemented a $2,000 minimum equity requirement under margin rules in June 2026. Easier access makes caution more important, not less."]]], "pros": ["Low or no commissions at many brokers", "Easy access from your phone", "Wide choice of investments", "You stay in control of your money"], "cons": ["Too many choices can feel overwhelming", "Easy trading can tempt frequent trading", "Some features carry fees", "Self-directed means you are responsible for decisions"], "watch": ["Verify every broker on FINRA BrokerCheck.", "Only give your Social Security number on the broker's own secure site, never by text or email.", "Avoid margin and options until you fully understand them.", "Day trading is high risk; most day traders lose money."], "tip": "Before you fund a new account, look for a new-account bonus. Many brokers offer cash or free shares for new deposits, but read the terms for how long the money must stay.", "fit": {"starter": "Choose a broker with no minimums and strong education.", "mom": "Consider a custodial account for your child.", "rebuilder": "Open an account in your own name.", "ent": "Consider a Solo 401(k) or SEP IRA for your business income.", "exec": "Coordinate with your workplace plan and any company stock.", "late": "Look for strong retirement planning tools.", "retiree": "Choose a broker that makes withdrawals simple.", "legacy": "Name beneficiaries on every account."}, "example": "Angela compares ify it on:", "o": ["FINRA BrokerCheck", "A random review site", "A text message"], "a": 0, "why": "BrokerCheck confirms registration."}, {"q": "Most day traders over time:", "o": ["Lose money", "Always profit", "Never trade"], "a": 0, "why": "Day trading is high risk."}, {"q": "After opening an account, turn on:", "o": ["Two-step verification", "Margin trading", "Every notification"], "a": 0, "why": "It protects your account."}, {"q": "A robo-adviser:", "o": ["Invests for you automatically based on your goals", "Is illegal", "Guarantees returns"], "a": 0, "why": "It is a form of guided investing."}, {"q": "Proverbs 16:3 teaches us to:", "o": ["Commit our works unto the Lord", "Act in haste", "Avoid planning"], "a": 0, "why": "Plans committed to God are established."}], "cta": {"label": "Compare brokers", "lib": "platforms"}}, "seed-8": {"deep": true, "mins": 11, "intro": "Your first investment is a milestone worth celebrating. With fractional shares, you can begin with as little as a few dollars, and with a limit order, you stay in control of the price you pay. This lesson walks you through your first buy, step by step.", "connect": "Your first buy turns your why into action and plants your first seed.", "sections": [["Fractional shares", ["A fractional share lets you buy part of one share. If a share costs $500, you can invest $25 and own one-twentieth of it. Many brokers offer fractional shares of stocks and ETFs, so you can invest any amount, even a small one.", "\"Who hath despised the day of small things?\" (Zechariah 4:10)."]], ["Market orders and limit orders", ["A market order buys right away at the current price, whatever it is. A limit order buys only at your price or better. If the price is higher than your limit, the order waits or expires.", "Limit orders protect you when prices move quickly, such as right after a company goes public."]], ["Placing your first order", ["Search for the investment by its ticker symbol, the short code that identifies it. Choose buy, enter the dollar amount or number of shares, choose market or limit, review the details carefully, and confirm.", "Check your confirmation and your account to make sure it filled as expected."]], ["Set it and grow it", ["Many brokers let you schedule automatic investments every week or month. Automatic investing removes the guesswork and builds the habit. This is called dollar-cost averaging, and you will learn more about it in the Sower tier."]], ["After you buy", ["Resist checking your account every hour. Prices will move up and down. Your goal is long-term growth, not daily excitement. Review your investments monthly with your money map."]]], "pros": ["You can start with very little money", "Limit orders give you price control", "Automatic investing builds the habit", "Your first buy builds confidence"], "cons": ["Prices move up and down daily", "Some brokers limit which investments allow fractions", "Limit orders may not fill", "It is easy to over-check your account"], "watch": ["Double-check the ticker symbol before you confirm.", "Use limit orders for fast-moving investments.", "Do not invest money you will need within five years in stocks.", "Fractional shares may not transfer between brokers."], "tip": "Before you buy, double-check the ticker symbol. Some companies have similar tickers, and a single wrong letter can buy a completely different investment.", "fit": {"starter": "Begin with a small amount in a broad index fund.", "mom": "Make your first buy together with your children as a teaching moment.", "rebuilder": "Even $10 is a powerful first step.", "ent": "Schedule an automatic investment from your profits.", "exec": "Set up automatic investing each payday.", "late": "Start now and increase your amount over time.", "retiree": "Consider income-focused funds for new investments.", "legacy": "Celebrate first buys for each new generation."}, "example": "Joy has $50 to invest. She opens her broker's app, searches for a broad S&P 500 ETF, chooses buy, enters $50, selects a limit order slightly above the current price, reviews, and confirms. She owns a fraction of a share and schedules $50 every month. (Hypothetical example.)", "terms": [["Fractional share", "Part of one share."], ["Ticker symbol", "The short code that identifies an investment."], ["Market order", "An order to buy or sell right away at the current price."], ["Limit order", "An order to buy or sell only at your price or better."], ["Fill", "When an order is completed."], ["Automatic investing", "Scheduled purchases on a set day."]], "verse": ["For who hath despised the day of small things?", "Zechariah 4:10"], "check": ["Choose your first investment and look up its ticker", "Decide your first amount", "Place a limit order and confirm it filled", "Schedule an automatic monthly investment"], "quiz": [{"q": "A fractional share lets you:", "o": ["Buy part of one share", "Avoid all fees", "Own a whole company"], "a": 0, "why": "You can invest any amount."}, {"q": "A market order:", "o": ["Buys right away at the current price", "Waits for your price", "Never fills"], "a": 0, "why": "It prioritizes speed over price."}, {"q": "A limit order:", "o": ["Buys only at your price or better", "Always fills immediately", "Is illegal"], "a": 0, "why": "It gives you price control."}, {"q": "A ticker symbol is:", "o": ["A fee", "The short code for an investment", "A type of account"], "a": 1, "why": "It identifies what you buy."}, {"q": "When prices move quickly, a safer choice is:", "o": ["A market order", "A limit order", "No order"], "a": 1, "why": "It caps what you pay."}, {"q": "Automatic investing:", "o": ["Builds the habit and removes guesswork", "Guarantees profits", "Requires large amounts"], "a": 0, "why": "Consistency is powerful."}, {"q": "After your first buy, you should:", "o": ["Check every hour", "Review monthly and stay patient", "Sell the next day"], "a": 1, "why": "Long-term growth needs patience."}, {"q": "Before confirming an order, check:", all be upon the earth\" (Ecclesiastes 11:2)."]], ["Target-date funds: an all-in-one option", ["A target-date fund holds a full mix of stocks and bonds and slowly becomes more conservative as its target year approaches. You choose the fund closest to the year you expect to retire, and it adjusts for you. Compare their fees, which vary widely."]], ["Know your comfort with risk", ["Ask yourself honestly: if my investments fell 30% in a year, would I stay the course or sell in fear? Your answer helps set your mix. A plan you can keep through a storm is better than a more aggressive plan you abandon."]]], "pros": ["Reduces the damage any single investment can do", "Matches your money to your timeline", "Helps you stay calm in downturns", "Simple options like target-date funds exist"], "cons": ["A diversified portfolio will never match the single best investment", "Safer mixes grow more slowly", "Requires occasional rebalancing", "Some all-in-one funds charge higher fees"], "watch": ["Do not hold a large share of your wealth in your employer's stock.", "Count all your accounts together when you check your mix.", "Do not take on more risk than you can sleep with.", "Review your mix after major life changes."], "tip": "Check your 401(k) default investment. Many plans place new employees in a target-date fund automatically. That can be a fine choice, but look at its fee and its target year to make sure it fits you.", "fit": {"starter": "Time is on your side; a higher stock share can make sense.", "mom": "Separate your children's education money from your retirement money.", "rebuilder": "Start with a simple, diversified all-in-one fund.", "ent": "Diversify outside your business, which is already a concentrated investment.", "exec": "Watch for too much company stock from your compensation.", "late": "Balance growth with steadiness as retirement nears.", "retiree": "Keep enough in steadier holdings to cover several years of withdrawals.", "legacy": "Different goals may deserve different mixes."}, "example": "Lisa is 40. She chooses about 70% in a total stock market index fund and an international index fund, 25% in a bond index fund, and 5% in cash. When the stock market drops 20% one year, her bonds hold steady, so her overall portfolio falls far less, and she stays the course. (Hypothetical example.)", "terms": [["Asset allocation", "How you divide money among stocks, bonds, and cash."], ["Diversification", "Spreading money across many investments."], ["Target-date fund", "An all-in-one fund that grows more conservative over time."], ["Risk tolerance", "How much loss you can endure without abandoning your plan."], ["Time horizon", "How long until you need the money."], ["International fund", "A fund that owns companies outside the United States."]], "verse": ["Give a portion to seven, and also to eight; for thou knowest not what evil shall be upon the earth.", "Ecclesiastes 11:2"], "check": ["List every account and what it holds", "Calculate your current stock, bond, and cash percentages", "Decide your target mix", "Look up the fee of your 401(k) default fund"], "quiz": [{"q": "Asset allocation is:", "o": ["How you divide money among stocks, bonds, and cash", "Picking one great stock", "Your budget"], "a": 0, "why": "It is the recipe for your portfolio."}, {"q": "Money needed within two years generally belongs in:", "o": ["Steadier places like cash or short-term bonds", "Individual stocks", "Cryptocurrency"], "a": 0, "why": "Short timelines cannot wait out downturns."}, {"q": "The \"110 minus your age\" idea estimates:", "o": ["Your stock percentage", "Your tax rate", "Your credit score"], "a": 0, "why": "It is a rough starting point only."}, {"q": "Owning one company's stock is:", "o": ["Diversified", "Concentrated", "Risk-free"], "a": 1, "why": "One company can fall sharply."}, {"q": "A target-date fund:", "o": ["Grows more conservative as its target year nears", "Never changes", "Guarantees returns"], "a": 0, "why": "It adjusts its mix for you."}, {"q": "Which matters more than any one stock for most investors?", "o": ["Their overall allocation", "Daily price checks", "Hot tips"], "a": 0, "why": "Allocation drives most long-term results."}, {"q": "Diversification across countries means:", "o": ["Owning companies outside the U.S. too", "Only owning U.S. companies", "Owning only cash"], "a": 0, "why": "It spreads risk further."}, {"q": "A plan you can keep through a downturn is:", "o": ["Better than an aggressive plan you abandon", "Always too cautious", "Unimportant"], "a": 0, "why": "Staying the course matters most."}, {"q": "When checking your mix, you should:", "o": ["Count all your accounts together", "Count only one account", "Ignore retirement accounts"], "a": 0, "why": "Your whole picture is what matters."}, {"q": "Ecclesiastes 11:2 counsels:", "o": ["Giving a portion to seven, and also to eight", "Putting everything in one place", "Avoiding all risk forever"], "a": 0, "why": "Spreading out is biblical wisdom."}]}, "sower-2": {"deep": true, "mins": 11, "intro": "Dollar-cost averaging means investing the same amount on a regular schedule, no matter what the market is doing. It turns investing into a faithful habit, removes the pressure of guessing the right moment, and helps you stay calm, and even grateful, when prices fall.", "connect": "Steady, faithful investing keeps you moving toward your why in every season.", "sections": [["How it works", ["You invest a set amount, perhaps $200 every month, into the same investment. When prices are high, your $200 buys fewer shares. When prices are low, your $200 buys more. Over time, your average cost per share is smoothed out.", "If you contribute to a 401(k) every payday, you are already dollar-cost averaging."]], ["Why timing the market rarely works", ["Even professionals struggle to predict when markets will rise or fall. Some of the market's best days have come right after its worst days, so investors who sell in fear often miss the recovery.", "\"He that observeth the wind shall not sow; and he that regardeth the clouds shall not reap\" (Ecclesiastes 11:4)."]], ["Downturns are sales", ["When prices fall, your regular investment buys more shares at lower prices. A woman who keeps investing through a downturn often owns more shares when the market recovers.", "This is why downturns can be seasons of opportunity for patient investors."]], ["Automate it", ["Set up automatic investments on payday. Automation removes emotion, keeps you consistent, and ensures you pay yourself before anything else."]], ["When a lump sum arrives", ["If you receive a large amount at once, such as an inheritance or bonus, historically investing it all at once has often done better than spreading it out, because markets have risen more often than they have fallen. But spreading it over several months may help you sleep in peace. Either approach can be wise; choose the one you will keep."]]], "pros": ["Removes the stress of timing the market", "Builds a steady, faithful habit", "Buys more shares when prices are low", "Easy to automate"], "cons": ["It does not guarantee a profit or protect against loss", "In a steadily rising market, a lump sum may do better", "It requires consistency during hard times", "Small fees per purchase can add up at some brokers"], "watch": ["Do not stop investing during a downturn out of fear.", "Keep your emergency fund in place so you never have to sell low.", "Use investments without per-purchase fees for frequent buys.", "Review your plan yearly, not daily."], "tip": "If your income varies, set your automatic investment to a small, sure amount, then add extra in strong months. A small amount you never miss beats a large amount you keep pausing.", "fit": {"starter": "Automate a small amount every payday and let it grow.", "mom": "Automate monthly investments for your children too.", "rebuilder": "Start with a small, steady amount you can keep.", "ent": "Invest a set share of profits each month.", "exec": "Max out your workplace plan through payroll.", "late": "Increase your automatic amount each year.", "retiree": "Reverse it: withdraw a steady amount rather than selling in a panic.", "legacy": "Steady giving and investing can be taught to every generation."}, "example": "Carmen invests $300 every month. In January the fund costs $50, so she buys 6 shares. In March, during a downturn, it costs $30, so she buys 10 shares. In June it costs $40, and she buys 7.5 shares. Her average cost is lower than the average of the prices, because she bought more shares when prices were low. (Hypothetical example.)", "terms": [["Dollar-cost averaging", "Investing a fixed amount on a regular schedule."], ["Market timing", "Trying to buy low and sell high by predicting the market."], ["Lump sum", "Investing a large amount all at once."], ["Downturn", "A period when prices fall."], ["Average cost", "The average price you paid per share."], ["Automatic investing", "Scheduled investments that happen without action each time."]], "verse": ["He that observeth the wind shall not sow; and he that regardeth the clouds shall not reap.", "Ecclesiastes 11:4"], "check": ["Set up or confirm an automatic investment", "Choose an amount you can keep for a full year", "Write what you will do in the next downturn", "Check whether your investments charge per-purchase fees"], "quiz": [{"q": "Dollar-cost averaging means:", "o": ["Investing a fixed amount on a regular schedule", "Buying only when prices are low", "Selling every month"], "a": 0, "why": "It is steady, scheduled investing."}, {"q": "When prices fall, your fixed amount buys:", "o": ["More shares", "Fewer shares", "No shares"], "a": 0, "why": "Lower prices mean more shares per dollar."}, {"q": "Investing through your 401(k) each payday is:", "o": ["Dollar-cost averaging", "Market timing", "Day trading"], "a": 0, "why": "Regular payroll contributions are a fixed schedule."}, {"q": "Does dollar-cost averaging guarantee a profit?", "o": ["Yes", "No", "Only in bull markets"], "a": 1, "why": "No strategy guarantees profit."}, {"q": "Selling in fear during a downturn often means:", "o": ["Missing the recovery", "Doubling your money", "Avoiding all losses forever"], "a": 0, "why": "Some of the best days follow the worst."}, {"q": "Ecclesiastes 11:4 warns that he who observes the wind:", "o": ["Shall not sow", "Shall reap twice", "Shall never lose"], "a": 0, "why": "Waiting for perfect conditions means never planting."}, {"q": "Historically, investing a lump sum at once has:", "o": ["Often done better, since markets rise more often than they fall", "Always lost money", "Been illegal"], "a": 0, "why": "But spreading it out can bring peace."}, {"q": "Automation helps by:", "o": ["Removing emotion and keeping you consistent", "Guaranteeing returns", "Timing the market"], "a": 0, "why": "Consistency is the goal."}, {"q": "What keeps you from selling low in an emergency?", "o": ["Your emergency fund", "A margin loan", "A credit card"], "a": 0, "why": "Cash protects your investments."}, {"q": "A downturn can be viewed as:", "o": ["A season of opportunity for patient investors", "A reason to stop forever", "Proof investing is wrong"], "a": 0, "why": "Your steady amount buys more shares."}]}, "sower-3": {"deep": true, "mins": 12, "intro": "Markets move in seasons, just as the earth does. A bull market is a season of rising prices and optimism. A bear market is a season of falling prices and fear. Understanding these seasons helps you stay steady, plant faithfully in every one, and never let a headline steal your peace.", "connect": "When you understand the market's seasons, you can hold to your why through every one.", "sections": [["Bull markets", ["A bull market is commonly described as a rise of 20% or more from a recent low, with prices climbing over months or years. The name comes from how a bull attacks, thrusting its horns upward.", "Bull markets bring confidence, but also temptation: chasing hot investments, borrowing to invest, and forgetting that seasons change."]], ["Bear markets", ["A bear market is commonly described as a decline of 20% or more from a recent high. The name comes from how a bear attacks, swiping its paws downward. A decline of 10% to 20% is usually called a correction.", "Bear markets feel frightening, but they are a normal part of investing. Historically, U.S. bear markets have tended to be shorter than bull markets, and the market has eventually recovered from every one so far, though recoveries can take years."]], ["To every thing there is a season", ["\"To every thing there is a season, and a time to every purpose under the heaven\" (Ecclesiastes 3:1). Joseph stored grain in the years of plenty so his family could stand in the years of famine (Genesis 41). Wise women prepare in the bull and stay faithful in the bear."]], ["What to do in each season", ["In a bull market: keep investing steadily, rebalance if stocks have grown beyond your target, build your emergency fund, and resist get-rich-quick temptations.", "In a bear market: keep investing if you can, avoid selling in panic, rebalance if your mix has drifted, and remember that lower prices mean your regular investment buys more shares."]], ["Headlines are not a plan", ["News is designed to capture attention, and fear captures it best. Your plan was made for every season. Check your investments monthly, not hourly, and talk with a trusted, licensed professional before making big changes in a storm."]]], "pros": ["Helps you stay calm when markets fall", "Turns downturns into opportunities", "Keeps you grounded during booms", "Gives you language to understand financial news"], "cons": ["No one can predict when seasons will change", "Bear markets can last longer than expected", "Recoveries can take years", "Emotions can still run high"], "watch": ["Never invest money you need soon in stocks.", "Avoid borrowing to invest, especially in a bull market.", "Do not sell in a panic during a bear market.", "Be skeptical of anyone who claims to know when the market will turn."], "tip": "Write a one-page \"storm plan\" now, while markets are calm: what you will keep doing, what you will not do, and who you will call. When fear rises, read your own words.", "fit": {"starter": "Bear markets early in life can be gifts; you buy more for less.", "mom": "Keep your family's near-term money out of stocks.", "rebuilder": "A steady plan protects you from fear-based decisions.", "ent": "Prepare your business and household for slower seasons.", "exec": "Do not let a strong bull market tempt you into too much company stock.", "late": "Keep steadier money in place as retirement nears.", "retiree": "Hold several years of withdrawals outside stocks so you never sell low.", "legacy": "Teach your family that markets have seasons."}, "example": "When a bear market drops Rachel's portfolio from $80,000 to $62,000, she rereads her storm plan. She keeps investing $400 a month, which now buys more shares. Two years later, when the market recovers, her portfolio is larger than before the decline, because she kept planting through the winter. (Hypothetical example; recoveries are not guaranteed and can take longer.)", "terms": [["Bull market", "A rise of 20% or more from a recent low."], ["Bear market", "A decline of 20% or more from a recent high."], ["Correction", "A decline of 10% to 20%."], ["Volatility", "How much and how quickly prices move."], ["Recession", "A broad decline in economic activity."], ["Recovery", "A return to previous highs after a decline."]], "verse": ["To every thing there is a season, and a time to every purpose under the heaven.", "Ecclesiastes 3:1"], "check": ["Write your one-page storm plan", "Check that near-term money is out of stocks", "Unfollow one fear-driven financial news source", "Decide how often you will check your investments"], "quiz": [{"q": "A bear market is commonly described as:", "o": ["A rise of 20%", "A decline of 20% or more from a recent high", "A 5% dip"], "a": 1, "why": "Bears swipe downward."}, {"q": "A bull market is commonly described as:", "o": ["A rise of 20% or more from a recent low", "A decline of 20%", "A flat market"], "a": 0, "why": "Bulls thrust upward."}, {"q": "A decline of 10% to 20% is usually called:", "o": ["A correction", "A bull market", "A recession"], "a": 0, "why": "Corrections are common."}, {"q": "In a bear market, a wise response is to:", "o": ["Sell everything in a panic", "Keep investing if you can and avoid panic selling", "Borrow to buy more"], "a": 1, "why": "Lower prices mean more shares for your regular amount."}, {"q": "Historically, U.S. bear markets have tended to be:", "o": ["Shorter than bull markets", "Permanent", "Longer than every bull market"], "a": 0, "why": "But recoveries can still take years."}, {"q": "Joseph's example teaches us to:", "o": ["Prepare in plenty for times of famine", "Spend in plenty", "Fear every season"], "a": 0, "why": "Genesis 41 shows wise preparation."}, {"q": "In a bull market, a common temptation is:", "o": ["Chasing hot investments and borrowing to invest", "Saving too much", "Rebalancing"], "a": 0, "why": "Optimism can lead to risky choices."}, {"q": "A storm plan is:", "o": ["A written plan for how you will act in a downturn", "Insurance", "A weather app"], "a": 0, "why": "Your own words calm fear."}, {"q": "Can anyone reliably predict when markets will turn?", "o": ["Yes, many experts", "No", "Only on social media"], "a": 1, "why": "Be skeptical of such claims."}, {"q": "Ecclesiastes 3:1 teaches that:", "o": ["To every thing there is a season", "Markets always rise", "Wealth never changes"], "a": 0, "why": "Seasons are part of life and investing."}]}, "sower-4": {"deep": true, "mins": 11, "intro": "Fees are quiet. They rarely show up as a bill, yet they come out of your investments year after year, and they compound against you. A difference of less than one percent can cost you tens of thousands, or even hundreds of thousands, of dollars over a lifetime.", "connect": "Every dollar saved in fees stays at work for your why.", "sections": [["The kinds of fees", ["Expense ratios are yearly fees charged by funds. Advisory fees are charged by advisers, often a percentage of what they manage. Sales loads are commissions charged when you buy or sell some mutual funds. Account fees, transfer fees, and trading commissions may also apply."]], ["Why small fees grow so large", ["Fees are charged on your whole balance every year, and the money paid in fees can no longer grow for you. Over 30 years, $100,000 earning 7% before fees grows to about $751,000 with a 0.05% fee, but to about $574,000 with a 1% fee. That one percent costs about $177,000.", "\"A prudent man foreseeth the evil, and hideth himself; but the simple pass on, and are punished\" (Proverbs 22:3)."]], ["Where to find them", ["A fund's expense ratio appears on its fact sheet and in its prospectus. Advisory fees appear in the adviser's Form ADV, which you can find on the SEC's adviser search. Your 401(k) plan provides a fee disclosure each year."]], ["Paying for advice wisely", ["Good advice can be worth paying for, especially for complex situations. Compare how advisers are paid: a flat fee, an hourly rate, a percentage of assets, or commissions. Ask whether the adviser is a fiduciary, legally required to act in your best interest."]], ["Lowering your costs", ["Choose low-cost index funds when they fit your plan. Avoid funds with sales loads. Ask about fee breakpoints and lower-cost share classes. Avoid frequent trading. Review your fees every year."]]], "pros": ["Lower fees leave more money growing for you", "Fees are one of the few things you can control", "Low-cost options are widely available", "Small changes create large long-term gains"], "cons": ["Some fees are hard to find", "The cheapest option is not always the best fit", "Changing investments can trigger taxes in taxable accounts", "Quality advice has real costs"], "watch": ["Read the expense ratio before buying any fund.", "Ask every adviser exactly how they are paid.", "Watch for sales loads and high-cost share classes.", "Check for taxes before switching investments in a taxable account."], "tip": "Ask any adviser: \"Will you put in writing that you act as a fiduciary at all times?\" A clear yes is a good sign. Hesitation is worth noticing.", "fit": {"starter": "Low-cost index funds let more of your small contributions grow.", "mom": "Choose low-cost funds for education savings plans.", "rebuilder": "Review fees on any account you inherited or received in a settlement.", "ent": "Compare fees on your business retirement plan.", "exec": "Review your 401(k) fee disclosure and fund choices.", "late": "Lower fees can help you catch up faster.", "retiree": "Fees matter even more when you are withdrawing.", "legacy": "Lower fees preserve more for the next generation."}, "example": "Patricia's 401(k) holds a fund with a 0.95% expense ratio. Her plan also offers an index fund with a 0.04% fee. On her $60,000 balance, switching saves about $546 a year, money that now stays invested and compounds for her. (Hypothetical example.)", "terms": [["Expense ratio", "A fund's yearly fee, as a percentage."], ["Advisory fee", "A fee paid to an adviser, often a percentage of assets."], ["Sales load", "A commission charged on some mutual funds."], ["Fiduciary", "A professional legally required to act in your best interest."], ["Form ADV", "An adviser's disclosure form, including fees."], ["Fee disclosure", "A yearly statement of the fees in your 401(k)."]], "verse": ["A prudent man foreseeth the evil, and hideth himself; but the simple pass on, and are punished.", "Proverbs 22:3"], "check": ["Find the expense ratio of every fund you own", "Read your 401(k) fee disclosure", "Ask any adviser how they are paid", "Identify one lower-cost alternative"], "quiz": [{"q": "An expense ratio is:", "o": ["A fund's yearly fee", "Your tax rate", "A trading limit"], "a": 0, "why": "It is charged every year on your balance."}, {"q": "Over 30 years, a 1% fee versus 0.05% on $100,000 can cost about:", "o": ["$100", "$177,000", "Nothing"], "a": 1, "why": "Fees compound against you."}, {"q": "A fiduciary:", "o": ["Must act in your best interest", "Earns only commissions", "Guarantees returns"], "a": 0, "why": "Ask advisers to confirm it in writing."}, {"q": "A sales load is:", "o": ["A commission on some mutual funds", "A free service", "A tax"], "a": 0, "why": "Many low-cost funds charge no load."}, {"q": "An adviser's fees appear in:", "o": ["Form ADV", "Your credit report", "A bank statement only"], "a": 0, "why": "Find it on the SEC's adviser search."}, {"q": "Your 401(k) fees appear in:", "o": ["A yearly fee disclosure", "Nowhere", "Your tax return"], "a": 0, "why": "Plans must provide it."}, {"q": "Why do small fees grow so large?", "o": ["They are charged on your whole balance every year", "They are one-time", "They are tax-free"], "a": 0, "why": "And the money paid cannot grow for you."}, {"q": "Before switching investments in a taxable account, check:", "o": ["Possible taxes", "Your horoscope", "Nothing"], "a": 0, "why": "Selling can trigger capital gains."}, {"q": "Proverbs 22:3 teaches that the prudent:", "o": ["Foresee the evil and hide themselves", "Ignore costs", "Rush ahead"], "a": 0, "why": "Wisdom looks ahead."}, {"q": "Which is something you can control?", "o": ["The fees you pay", "Market returns", "Interest rates"], "a": 0, "why": "Fees are within your control."}]}, "sower-5": {"deep": true, "mins": 14, "intro": "Taxes are one of the largest costs an investor faces, and understanding a few basics can save you thousands over your lifetime. This lesson explains how investments are taxed, which accounts offer tax advantages, and simple ways to keep more of what you earn, legally and wisely.", "connect": "Keeping more of what you earn lets you give, save, and build more for your why.", "sections": [["Render unto Caesar", ["\"Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's\" (Matthew 22:21). Paying what we owe is right. Paying more than we owe is not stewardship. The tax code itself offers legal ways to reduce your taxes."]], ["Capital gains", ["When you sell an investment for more than you paid, the profit is a capital gain. If you held it one year or less, it is a short-term gain, taxed at your ordinary income rate. If you held it more than one year, it is a long-term gain, taxed at lower rates.", "For 2026, long-term gains are taxed at 0% for single filers with taxable income up to $49,450 ($98,900 for married couples filing jointly), 15% above that, and 20% above $545,500 ($613,700 for joint filers)."]], ["Dividends and interest", ["Qualified dividends are generally taxed at the lower long-term capital gains rates. Interest from savings accounts, CDs, and most bonds is taxed as ordinary income. Interest from U.S. Treasury securities is exempt from state and local income tax, and interest from many municipal bonds is exempt from federal income tax."]], ["Tax-advantaged accounts", ["401(k)s, IRAs, Roth IRAs, health savings accounts, and 529 education plans each offer tax benefits. Traditional accounts can lower your taxes now; Roth accounts can make qualified withdrawals tax-free later. Using them is one of the simplest tax strategies available."]], ["Simple ways to reduce taxes", ["Hold investments more than a year before selling when it fits your plan. Place tax-inefficient investments, such as bonds, inside tax-advantaged accounts when possible. Use losses to offset gains, a strategy called tax-loss harvesting, but avoid the wash-sale rule, which disallows the loss if you buy the same or a substantially identical investment within 30 days before or after the sale.", "Keep good records and consult a qualified tax professional for your situation."]]], "pros": ["Long-term investing is taxed at lower rates", "Tax-advantaged accounts reward saving", "Losses can offset gains", "Good planning can save thousands"], "cons": ["Tax rules are complex and change", "Mistakes can be costly", "Some strategies have strict rules", "State taxes vary"], "watch": ["Tax rules change; verify the current figures each year.", "Watch the wash-sale rule when harvesting losses.", "Keep records of what you paid for every investment.", "Consult a qualified tax professional for your situation."], "tip": "If you sell investments in a taxable account, look at your broker's cost basis report before you file. Brokers report most sales to the IRS, and reviewing the report helps you catch errors before they cost you.", "fit": {"starter": "Roth accounts can be especially valuable while your tax rate is lower.", "mom": "A 529 plan can grow tax-free for qualified education costs.", "rebuilder": "Ask a tax professional about filing status and any changes after divorce or loss.", "ent": "Business retirement plans can reduce taxes on business income.", "exec": "Plan for taxes on stock compensation.", "late": "Catch-up contributions can lower taxes while you save more.", "retiree": "Plan the order of withdrawals to manage taxes.", "legacy": "Inherited assets and gifts have their own tax rules."}, "example": "Maria bought shares for $5,000 and they grew to $8,000. If she sells after 10 months, the $3,000 gain is taxed as ordinary income. If she waits until she has held them more than a year, and her total taxable income, including the gain, is $45,000 as a single filer in 2026, her long-term gain is taxed at 0%. (Hypothetical example; consult a tax professional.)", "terms": [["Capital gain", "Profit from selling an investment for more than you paid."], ["Short-term gain", "A gain on an investment held one year or less."], ["Long-term gain", "A gain on an investment held more than one year."], ["Cost basis", "What you paid for an investment, including some costs."], ["Tax-loss harvesting", "Selling at a loss to offset gains."], ["Wash-sale rule", "A rule disallowing a loss if you rebuy within 30 days."]], "verse": ["Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's.", "Matthew 22:21"], "check": ["Find your filing status and estimated taxable income", "Check how long you have held each investment", "List your tax-advantaged accounts", "Write questions for a tax professional"], "quiz": [{"q": "A long-term capital gain is on an investment held:", "o": ["More than one year", "One month", "One day"], "a": 0, "why": "Long-term gains get lower rates."}, {"q": "Short-term gains are taxed:", "o": ["At ordinary income rates", "At 0% always", "Never"], "a": 0, "why": "They are treated like wages."}, {"q": "In 2026, single filers pay 0% on long-term gains up to taxable income of:", "o": ["$49,450", "$10,000", "$1 million"], "a": 0, "why": "$98,900 for joint filers."}, {"q": "Interest from U.S. Treasury securities is exempt from:", "o": ["State and local income tax", "All taxes", "Nothing"], "a": 0, "why": "It is still subject to federal tax."}, {"q": "The wash-sale rule applies if you rebuy within:", "o": ["30 days before or after the sale", "One year", "Five days only"], "a": 0, "why": "The loss is then disallowed."}, {"q": "Cost basis is:", "o": ["What you paid for an investment", "Its current price", "Your tax bill"], "a": 0, "why": "Gains are measured from it."}, {"q": "A Roth IRA offers:", "o": ["Tax-free qualified withdrawals later", "A deduction now", "No limits"], "a": 0, "why": "You pay taxes up front."}, {"q": "Tax-loss harvesting means:", "o": ["Using investment losses to offset gains", "Avoiding all taxes illegally", "Selling only winners"], "a": 0, "why": "It is legal when rules are followed."}, {"q": "Matthew 22:21 teaches us to:", "o": ["Render unto Caesar what is Caesar's", "Avoid all taxes", "Hide income"], "a": 0, "why": "Pay what you owe, and no more than you owe."}, {"q": "For your own situation, you should:", "o": ["Consult a qualified tax professional", "Guess", "Ask social media"], "a": 0, "why": "Tax rules are complex and personal."}]}, "sower-6": {"deep": true, "mins": 11, "intro": "A stock quote is like a snapshot of a company's story in numbers. Once you know what each figure means, you can read any quote with confidence and ask better questions before you invest.", "connect": "Understanding the numbers helps you invest toward your why with wisdom, not guesswork.", "sections": [["Price, bid, and ask", ["The price is the most recent trade. The bid is the highest price buyers are offering right now; the ask is the lowest price sellers will accept. The difference is the spread. Busy, popular stocks usually have small spreads."]], ["Volume and the 52-week range", ["Volume is how many shares traded today. Higher volume usually means it is easier to buy and sell. The 52-week range shows the lowest and highest prices over the past year, giving context for today's price."]], ["Market capitalization", ["Market cap is the share price times the number of shares outstanding. It tells you the company's total value in the market. Large-cap companies are generally over $10 billion, mid-caps from about $2 billion to $10 billion, and small-caps below that. Definitions vary slightly by source."]], ["Earnings and the P/E ratio", ["Earnings per share (EPS) is the company's profit divided by its shares. The price-to-earnings (P/E) ratio is the price divided by EPS. A P/E of 20 means investors pay $20 for every $1 of yearly profit. A high P/E may reflect high expectations; a low P/E may reflect low expectations or a bargain. Compare it with similar companies."]], ["Dividend yield", ["The dividend yield is the yearly dividend divided by the share price. A $100 stock paying $3 a year yields 3%. A very high yield can be a warning sign that the price has fallen because the dividend may be cut.", "\"Through wisdom is an house builded; and by understanding it is established\" (Proverbs 24:3)."]]], "pros": ["Helps you u
