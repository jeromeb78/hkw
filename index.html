": 0, "why": "Humility helps."}, {"q": "FOMO means:", "o": ["Fear of missing out", "A fund type", "A tax"], "a": 0, "why": "It drives many bubbles."}, {"q": "Proverbs 13:11 says wealth gathered by labour:", "o": ["Shall increase", "Disappears", "Is unwise"], "a": 0, "why": "Steady growth endures."}]}, "kingdom-0": {"deep": true, "mins": 12, "intro": "Women who build lasting, generational wealth tend to think differently about money, time, and ownership. They focus on assets more than income, on decades more than days, and on systems more than willpower. This lesson explores those patterns, and anchors them in the conviction that wealth is entrusted for a purpose.", "connect": "Kingdom thinking turns wealth into a tool for your why and God's purposes.", "sections": [["Owners, not only earners", ["Income pays the bills; ownership builds wealth. Generational wealth builders tend to own assets that grow and produce income: businesses, investments, real estate, and intellectual property. They ask, \"What can I own?\" as naturally as \"What can I earn?\""]], ["Decades, not days", ["They plan in decades, letting compounding and patience work. They avoid decisions that win today but cost tomorrow, and they protect against the few mistakes that can undo a lifetime, such as excessive debt or concentration."]], ["Systems over willpower", ["They build systems: automatic investing, regular reviews, trusted advisers, and clear documents. Systems keep working in busy or difficult seasons."]], ["Counsel and continual learning", ["They surround themselves with wise counsel and keep learning. \"Where no counsel is, the people fall: but in the multitude of counsellors there is safety\" (Proverbs 11:14)."]], ["Wealth with purpose", ["Kingdom builders hold wealth with open hands. \"But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant\" (Deuteronomy 8:18). Wealth is entrusted to establish His purposes: provision, generosity, justice, and legacy."]]], "pros": ["Focuses energy on assets that grow", "Builds resilience through systems", "Aligns wealth with lasting purpose", "Prepares wealth to bless generations"], "cons": ["Ownership carries risk and responsibility", "Long-term thinking requires patience", "Good counsel has costs", "Wealth can tempt pride if purpose fades"], "watch": ["Guard your heart; wealth is a tool, not an identity.", "Avoid concentration and excessive debt, the great wealth destroyers.", "Keep learning; strategies that worked before may not work now.", "Choose advisers who share your values."], "tip": "Do a yearly \"ownership review\": list what you own that produces income or grows on its own. Ask what one new asset you could add in the year ahead.", "fit": {"starter": "Start owning early, even in small amounts.", "mom": "Model ownership thinking for your children.", "rebuilder": "Your first asset in your own name is a powerful beginning.", "ent": "Your business is an asset; build it to run without you.", "exec": "Turn compensation into ownership through investing.", "late": "Focus on protecting and growing the assets you own.", "retiree": "Shift toward assets that provide reliable income.", "legacy": "Teach ownership thinking as part of your legacy."}, "example": "Dominique, an executive, used to measure success by her salary. She begins a yearly ownership review: her investments, a rental property, and a small business she started on the side. Over a decade, her owned assets grow to produce more income than her salary once did, freeing her to give and serve more generously. (Hypothetical example.)", "terms": [["Asset", "Something you own that has value or produces income."], ["Ownership", "Holding assets rather than only earning income."], ["Generational wealth", "Wealth that blesses more than one generation."], ["Systems", "Repeatable habits and structures that run consistently."], ["Concentration", "Too much in one investment."], ["Stewardship", "Managing what God entrusts with faithfulness and purpose."]], "verse": ["But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth, that he may establish his covenant.", "Deuteronomy 8:18"], "check": ["Complete your first ownership review", "Identify one system to automate", "Name your circle of counsel", "Write your purpose for the wealth God entrusts to you"], "quiz": [{"q": "Generational wealth builders tend to focus on:", "o": ["Owning assets that grow", "Only increasing income", "Spending"], "a": 0, "why": "Ownership builds wealth."}, {"q": "They plan in:", "o": ["Decades", "Days", "Hours"], "a": 0, "why": "Time lets compounding work."}, {"q": "Systems help because they:", "o": ["Keep working in busy seasons", "Require constant willpower", "Guarantee returns"], "a": 0, "why": "Habits outlast motivation."}, {"q": "The great wealth destroyers include:", "o": ["Excessive debt and concentration", "Diversification", "Saving"], "a": 0, "why": "Avoid the few big mistakes."}, {"q": "Proverbs 11:14 teaches that safety comes from:", "o": ["A multitude of counsellors", "Acting alone", "Secrecy"], "a": 0, "why": "Wise counsel protects."}, {"q": "Deuteronomy 8:18 says God gives power to get wealth to:", "o": ["Establish His covenant", "Build pride", "Hoard"], "a": 0, "why": "Wealth serves His purposes."}, {"q": "An ownership review lists:", "o": ["What you own that grows or produces income", "Only your bills", "Your salary history"], "a": 0, "why": "It reveals your asset base."}, {"q": "Kingdom builders hold wealth:", "o": ["With open hands", "With clenched fists", "Secretly"], "a": 0, "why": "Wealth is entrusted, not owned forever."}, {"q": "Which is an income-producing asset?", "o": ["A rental property", "A new car", "A vacation"], "a": 0, "why": "It can produce ongoing income."}, {"q": "Wealth should be held as:", "o": ["A tool, not an identity", "Your identity", "A secret"], "a": 0, "why": "Guard your heart."}]}, "kingdom-1": {"deep": true, "mins": 15, "intro": "At the Kingdom Builder level, tax planning becomes one of the most powerful tools for preserving wealth. These strategies are legal, widely used, and built into the tax code. Used wisely, with a qualified professional, they can keep far more of your wealth working for your family and your mission.", "connect": "Every dollar kept from unnecessary tax can fund your why and your giving.", "sections": [["Asset location", ["Different accounts are taxed differently, so where you hold each investment matters. Many investors place tax-inefficient investments, such as bonds and REITs, in tax-deferred accounts, and tax-efficient index funds in taxable accounts. Roth accounts are often used for investments with the highest growth potential."]], ["Roth conversions", ["Converting money from a traditional IRA to a Roth IRA means paying tax now so future qualified withdrawals are tax-free. Conversions are often considered in years when income is lower, such as early retirement or a business transition."]], ["Giving appreciated investments", ["Donating stock or funds you have held more than a year, instead of cash, can let you deduct the full market value (subject to limits) and avoid capital gains tax on the growth. Donor-advised funds make this simple."]], ["Gifts and the estate", ["In 2026, you can give up to $19,000 per person each year without using any of your lifetime exemption, and the federal estate and gift tax exemption is $15 million per person. Assets inherited at death generally receive a step-up in cost basis, which can erase capital gains built up during life."]], ["Business and retirement strategies", ["Business owners may use retirement plans such as a Solo 401(k), SEP IRA, or defined benefit plan to save more before tax, and should choose an entity structure with a CPA. Health savings accounts, when eligible, offer tax benefits on contributions, growth, and qualified withdrawals.", "\"Render therefore unto Caesar the things which are Caesar's\" (Matthew 22:21): pay what is owed, and steward the rest."]]], "pros": ["Preserves more wealth for family and mission", "Uses legal strategies in the tax code", "Can increase charitable impact", "Coordinates investing, giving, and estate plans"], "cons": ["Rules are complex and change often", "Mistakes can be costly", "Requires qualified professional help", "Some strategies have strict deadlines and limits"], "watch": ["Tax laws change; verify current figures every year.", "Work with a qualified CPA or tax attorney.", "Be wary of promoters selling aggressive tax shelters.", "Document everything carefully."], "tip": "Ask your CPA for a \"tax projection\" in October, not just a tax return in April. Planning before year-end opens strategies, such as Roth conversions and charitable gifts, that disappear on December 31.", "fit": {"starter": "Roth contributions while your rate is lower can be valuable.", "mom": "Use 529 plans and annual gifts thoughtfully.", "rebuilder": "Review filing status and cost basis on assets you received.", "ent": "Coordinate entity choice and retirement plans with your CPA.", "exec": "Plan for taxes on equity compensation.", "late": "Consider catch-up contributions and Roth conversions.", "retiree": "Plan withdrawals, conversions, and required distributions.", "legacy": "Coordinate gifts, step-up in basis, and estate plans."}, "example": "Yolanda wants to give $20,000 to her church this year. Instead of writing a check, she donates shares she bought years ago for $8,000 that are now worth $20,000. If she itemizes, she may deduct the full $20,000 (subject to limits) and avoids capital gains tax on the $12,000 of growth, while her church receives the full value. (Hypothetical example; consult a tax professional.)", "terms": [["Asset location", "Placing investments in the accounts where they are taxed best."], ["Roth conversion", "Moving money from a traditional to a Roth account, paying tax now."], ["Donor-advised fund", "A charitable account that lets you give now and grant later."], ["Annual exclusion", "The amount you can give each person yearly without using your exemption."], ["Estate tax exemption", "The amount that can pass free of federal estate tax."], ["Step-up in basis", "Resetting an inherited asset's cost basis to its value at death."]], "verse": ["Render therefore unto Caesar the things which are Caesar's; and unto God the things that are God's.", "Matthew 22:21"], "check": ["Map which investments sit in which accounts", "Ask your CPA about a year-end tax projection", "List appreciated investments you could give", "Review your annual gifting plan"], "quiz": [{"q": "Asset location means:", "o": ["Placing investments in the accounts where they are taxed best", "Choosing a bank branch", "Buying property"], "a": 0, "why": "Where you hold investments matters."}, {"q": "A Roth conversion means:", "o": ["Paying tax now so future qualified withdrawals are tax-free", "Avoiding all tax", "Closing an IRA"], "a": 0, "why": "Often considered in lower-income years."}, {"q": "Giving appreciated stock held over a year can:", "o": ["Avoid capital gains tax on the growth", "Increase your taxes", "Be illegal"], "a": 0, "why": "And may allow a full deduction, subject to limits."}, {"q": "In 2026, the annual gift exclusion is:", "o": ["$19,000 per person", "$1,000", "Unlimited"], "a": 0, "why": "Gifts within it do not use your lifetime exemption."}, {"q": "In 2026, the federal estate and gift tax exemption is:", "o": ["$15 million per person", "$100,000", "$1 billion"], "a": 0, "why": "Verify current law each year."}, {"q": "A step-up in basis:", "o": ["Resets an inherited asset's basis to its value at death", "Raises taxes", "Applies only to cash"], "a": 0, "why": "It can erase built-up gains."}, {"q": "Tax-inefficient investments, like bonds, are often held in:", "o": ["Tax-deferred accounts", "Taxable accounts", "Cash only"], "a": 0, "why": "Their income is taxed as ordinary income."}, {"q": "A year-end tax projection helps because:", "o": ["Some strategies end December 31", "It is required by law", "It replaces your return"], "a": 0, "why": "Plan before the year closes."}, {"q": "Aggressive tax shelters sold by promoters are:", "o": ["A warning sign", "Always legal", "Required"], "a": 0, "why": "Use qualified professionals."}, {"q": "Matthew 22:21 teaches us to:", "o": ["Render unto Caesar what is Caesar's", "Avoid taxes illegally", "Ignore taxes"], "a": 0, "why": "Pay what you owe; steward the rest."}]}, "kingdom-2": {"deep": true, "mins": 14, "intro": "Trusts are among the most important tools for protecting and passing on wealth. A trust is a legal arrangement in which one person or institution, the trustee, holds and manages assets for the benefit of others, the beneficiaries. Understanding the difference between revocable and irrevocable trusts helps you choose wisely with your attorney.", "connect": "Trusts carry your values and your care into the next generation.", "sections": [["The parts of a trust", ["The grantor creates the trust and transfers assets into it. The trustee manages the assets according to the trust's terms. The beneficiaries receive the benefits. The trust document spells out the rules: who receives what, when, and under what conditions."]], ["Revocable living trusts", ["A revocable trust can be changed or ended by the grantor during life. The grantor usually serves as trustee, keeping full control. It can help avoid probate in many states, keep matters private, and provide for management if the grantor becomes incapacitated. It generally does not reduce estate taxes or protect assets from the grantor's creditors."]], ["Irrevocable trusts", ["An irrevocable trust generally cannot be changed easily once created. In exchange for giving up control, it can remove assets from the taxable estate, protect assets from certain creditors, and support specific goals. Examples include irrevocable life insurance trusts, charitable trusts, and trusts for a loved one with special needs."]], ["Funding the trust", ["A trust only governs assets placed in it. Retitling accounts and property into the trust's name, and coordinating beneficiary designations, is essential. An unfunded trust is one of the most common estate planning mistakes."]], ["Choosing trustees with care", ["Choose trustees who are trustworthy, capable, and willing. Many families name a successor trustee or a professional corporate trustee.", "\"Moreover it is required in stewards, that a man be found faithful\" (1 Corinthians 4:2)."]]], "pros": ["Can avoid probate and keep matters private", "Provides management if you become incapacitated", "Can protect beneficiaries and carry your values", "Irrevocable trusts can reduce estate taxes"], "cons": ["Trusts cost money to create and administer", "Irrevocable trusts limit your control", "Trusts must be funded to work", "Laws vary by state"], "watch": ["Work with a licensed estate planning attorney in your state.", "Fund your trust; retitle assets and coordinate beneficiaries.", "Be wary of \"trust mills\" selling one-size-fits-all documents.", "Review your trust after major life changes."], "tip": "After signing a trust, make a funding checklist: every bank account, brokerage account, and property, with a column for \"retitled\" and the date. Bring it to your attorney to confirm nothing was missed.", "fit": {"starter": "A will and beneficiary designations may be enough for now.", "mom": "A trust can provide for minor children with your guidance built in.", "rebuilder": "Update or create your trust after divorce or loss.", "ent": "Consider how your business interests will pass through a trust.", "exec": "Coordinate equity awards and accounts with your trust.", "late": "A revocable trust can simplify matters for your family.", "retiree": "Plan for incapacity and successor trustees.", "legacy": "Irrevocable and charitable trusts can carry your legacy further."}, "example": "Sharon creates a revocable living trust, retitles her home and brokerage account into it, and names her sister as successor trustee. When Sharon later has surgery and cannot manage her affairs for several months, her sister steps in smoothly, without court involvement. Her trust also directs that her nieces receive their inheritance in stages, with funds for education first. (Hypothetical example.)", "terms": [["Grantor", "The person who creates and funds a trust."], ["Trustee", "The person or institution managing the trust."], ["Beneficiary", "The person who receives benefits from the trust."], ["Revocable trust", "A trust the grantor can change during life."], ["Irrevocable trust", "A trust that generally cannot be easily changed."], ["Funding", "Transferring assets into the trust's name."]], "verse": ["Moreover it is required in stewards, that a man be found faithful.", "1 Corinthians 4:2"], "check": ["List assets you would place in a trust", "Identify a trustworthy successor trustee", "Write questions for an estate planning attorney", "Review all beneficiary designations"], "quiz": [{"q": "The trustee:", "o": ["Manages trust assets", "Only receives benefits", "Creates the trust"], "a": 0, "why": "The grantor creates; the trustee manages."}, {"q": "A revocable trust:", "o": ["Can be changed by the grantor during life", "Can never be changed", "Avoids all taxes"], "a": 0, "why": "The grantor keeps control."}, {"q": "A revocable trust generally does NOT:", "o": ["Reduce estate taxes", "Avoid probate in many states", "Plan for incapacity"], "a": 0, "why": "Irrevocable trusts serve that purpose."}, {"q": "An irrevocable trust can:", "o": ["Remove assets from the taxable estate", "Be changed at will", "Avoid all rules"], "a": 0, "why": "In exchange for giving up control."}, {"q": "A common estate planning mistake is:", "o": ["Failing to fund the trust", "Naming a trustee", "Using an attorney"], "a": 0, "why": "A trust governs only assets placed in it."}, {"q": "The grantor is:", "o": ["The person who creates and funds the trust", "The beneficiary", "The court"], "a": 0, "why": "She sets the terms."}, {"q": "Trusts can provide for:", "o": ["Management if you become incapacitated", "Only death", "Nothing"], "a": 0, "why": "They protect you during life too."}, {"q": "\"Trust mills\" selling one-size-fits-all documents are:", "o": ["A warning sign", "Best practice", "Required"], "a": 0, "why": "Work with a licensed attorney."}, {"q": "Trust laws:", "o": ["Vary by state", "Are identical nationwide", "Do not exist"], "a": 0, "why": "Local counsel matters."}, {"q": "1 Corinthians 4:2 says stewards must be:", "o": ["Found faithful", "Famous", "Wealthy"], "a": 0, "why": "Choose faithful trustees."}]}, "kingdom-3": {"deep": true, "mins": 14, "intro": "Owning a business can be one of the most powerful paths to generational wealth, and a family holding company can organize many assets under one roof. This lesson explores business ownership, entity choices, and how families use holding companies to manage, protect, and pass on what they build.", "connect": "Ownership of enterprise lets your why create jobs, wealth, and lasting impact.", "sections": [["Why business ownership builds wealth", ["Businesses can produce income, grow in value, and be sold or passed on. Many of the wealthiest families built their fortunes through ownership of operating businesses. Owning a business also creates opportunities to serve, employ, and bless your community."]], ["Choosing an entity", ["Common structures include sole proprietorships, limited liability companies (LLCs), S corporations, C corporations, and, in some states including Texas, series LLCs. Each differs in liability protection, taxes, and administration. Choose with an attorney and a CPA."]], ["Family holding companies", ["A family holding company is an entity, often an LLC or limited partnership, that owns other businesses, real estate, or investments for the family. It can centralize management, separate risks among different assets, and make it easier to transfer ownership gradually to the next generation."]], ["Building a business that can outlast you", ["A business that depends entirely on you is a job, not yet an asset. Document systems, develop leaders, keep clean financial records, and separate business and personal finances. These steps increase value and make succession possible."]], ["Faithful in enterprise", ["\"Seest thou a man diligent in his business? he shall stand before kings\" (Proverbs 22:29). Diligence, integrity, and service build businesses worth passing on."]]], "pros": ["Potential for significant income and value", "Creates jobs and community impact", "Holding companies can organize and protect family assets", "Businesses can be passed on or sold"], "cons": ["Businesses carry real risk", "Entities require ongoing administration", "Mixing personal and business money creates problems", "Succession takes years of planning"], "watch": ["Keep business and personal finances separate.", "Maintain your entity's required formalities and filings.", "Work with an attorney and CPA on structure.", "Avoid personally guaranteeing more debt than you can bear."], "tip": "Open a separate business bank account and credit card before your first sale. Clean separation protects your liability shield and saves hours at tax time.", "fit": {"starter": "Start small, with a simple, properly formed entity.", "mom": "Involve children in age-appropriate ways to learn enterprise.", "rebuilder": "A small business can rebuild income and independence.", "ent": "Build systems and leaders so your business can grow beyond you.", "exec": "Consider side ventures or investing in businesses you understand.", "late": "Consider buying an existing business with proven cash flow.", "retiree": "Plan your exit or succession thoughtfully.", "legacy": "A holding company can organize family assets for generations."}, "example": "Tamara owns a bakery and two rental properties. With her attorney and CPA, she forms a family holding LLC that owns separate LLCs for the bakery and each property, so a problem in one cannot reach the others. Each year she gifts a small percentage of the holding company to her daughters, within the annual exclusion, while keeping management control. (Hypothetical example; consult professionals.)", "terms": [["LLC", "Limited liability company, a flexible business entity."], ["S corporation", "A tax election that passes income through to owners."], ["C corporation", "A corporation taxed separately from its owners."], ["Series LLC", "An LLC with separate series that can hold separate assets."], ["Holding company", "An entity that owns other businesses or assets."], ["Succession plan", "A plan for transferring leadership and ownership."]], "verse": ["Seest thou a man diligent in his business? he shall stand before kings; he shall not stand before mean men.", "Proverbs 22:29"], "check": ["Review your current entity structure with a professional", "Separate business and personal accounts", "Document one key business system", "Sketch a simple family holding structure"], "quiz": [{"q": "Business ownership builds wealth because businesses can:", "o": ["Produce income, grow in value, and be passed on", "Never fail", "Avoid all taxes"], "a": 0, "why": "They are productive assets."}, {"q": "An LLC provides:", "o": ["Liability protection with flexibility", "Guaranteed profits", "No administration"], "a": 0, "why": "Choose with professionals."}, {"q": "A family holding company:", "o": ["Owns other businesses or assets for the family", "Is a bank", "Is a charity"], "a": 0, "why": "It centralizes and organizes."}, {"q": "A business that depends entirely on you is:", "o": ["A job, not yet a transferable asset", "Always worth more", "A holding company"], "a": 0, "why": "Systems and leaders build value."}, {"q": "Mixing business and personal money:", "o": ["Creates problems and can weaken liability protection", "Is best practice", "Is required"], "a": 0, "why": "Keep them separate."}, {"q": "A series LLC:", "o": ["Has separate series that can hold separate assets", "Is a type of bond", "Is illegal in Texas"], "a": 0, "why": "Texas permits series LLCs."}, {"q": "Gradual gifts of ownership can use:", "o": ["The annual gift exclusion", "No rules", "Only cash"], "a": 0, "why": "Plan with professionals."}, {"q": "Before your first sale, you should:", "o": ["Open separate business accounts", "Use your personal card", "Skip records"], "a": 0, "why": "Clean separation protects you."}, {"q": "Succession planning:", "o": ["Takes years", "Happens automatically", "Is unnecessary"], "a": 0, "why": "Start early."}, {"q": "Proverbs 22:29 says the diligent in business:", "o": ["Shall stand before kings", "Shall be forgotten", "Shall rest"], "a": 0, "why": "Diligence opens doors."}]}, "kingdom-4": {"deep": true, "mins": 13, "intro": "Private markets, including private companies, private equity, venture capital, and pre-IPO shares, have produced extraordinary wealth for some investors, and painful losses for others. This lesson explains how these investments work, who may participate, and the serious risks that come with them.", "connect": "Discernment in private markets protects your why from opportunities that look golden but are not.", "sections": [["What private markets are", ["Private companies are not listed on a stock exchange. Investors can own them through private equity funds, venture capital funds, direct investments, or secondary platforms that trade shares of late-stage private companies. Many of today's largest companies were private for many years before going public."]], ["Who may invest", ["Many private offerings are limited to accredited investors. Under SEC rules, individuals generally qualify with income over $200,000 ($300,000 with a spouse or spousal equivalent) in each of the last two years, or net worth over $1 million excluding a primary residence, or with certain professional licenses. These limits exist because the risks are high and disclosures are fewer."]], ["Pre-IPO shares", ["Some platforms sell interests in private companies before they go public, often through special-purpose vehicles that own the shares. Prices can be high, fees can be layered, information is limited, and selling before an IPO may be difficult or impossible."]], ["The risks", ["Private investments are illiquid: your money may be tied up for 7 to 10 years or more. Valuations are estimates, fees are often higher, and many startups fail. Fraud is more common where disclosure is limited."]], ["Sitting at the right tables", ["\"Be not thou one of them that strike hands, or of them that are sureties for debts\" (Proverbs 22:26). Commit only money you can lock away for years and afford to lose entirely, and only after careful diligence."]]], "pros": ["Access to companies before they go public", "Potential for high returns", "Diversification beyond public markets", "Opportunity to support entrepreneurs"], "cons": ["Money may be locked up for many years", "Higher fees and less information", "Many investments fail", "Higher risk of fraud"], "watch": ["Verify every offering and sponsor; check SEC filings such as Form D.", "Be wary of unsolicited pre-IPO offers by text, email, or social media.", "Keep private investments a small share of your wealth.", "Read every fee layer, including special-purpose vehicle fees."], "tip": "Search the SEC's EDGAR for the offering's Form D, which most private offerings must file. If a sponsor cannot point you to it, treat that as a serious warning sign.", "fit": {"starter": "Focus on public, diversified investments for now.", "mom": "Keep family security money out of illiquid investments.", "rebuilder": "Avoid private offerings while rebuilding.", "ent": "Investing in businesses you understand may fit, in small amounts.", "exec": "Employer equity may already be a large private position.", "late": "Prioritize liquidity as retirement nears.", "retiree": "Limit illiquid investments that could strain your income.", "legacy": "Private investments can fit a large, long-horizon portfolio in small portions."}, "example": "Kendra, an accredited investor, is offered pre-IPO shares of a well-known company through a special-purpose vehicle. She reads the documents and finds a 5% upfront fee, a 20% share of profits for the sponsor, and no guarantee she can sell before an IPO. She decides to invest only 2% of her portfolio, an amount she could afford to lose entirely. (Hypothetical example.)", "terms": [["Private equity", "Investing in private companies, often buying established businesses."], ["Venture capital", "Investing in young, high-growth companies."], ["Accredited investor", "An investor meeting SEC income, net worth, or professional tests."], ["Illiquid", "Hard to sell quickly."], ["Special-purpose vehicle", "An entity formed to hold a specific investment."], ["Form D", "A notice filed with the SEC for many private offerings."]], "verse": ["Be not thou one of them that strike hands, or of them that are sureties for debts.", "Proverbs 22:26"], "check": ["Determine whether you are an accredited investor", "Decide your maximum allocation to private investments", "Look up a Form D on EDGAR", "List every fee in any offering you are considering"], "quiz": [{"q": "Private companies are:", "o": ["Not listed on a stock exchange", "Always safer", "Government-owned"], "a": 0, "why": "They trade privately, if at all."}, {"q": "Illiquid means:", "o": ["Hard to sell quickly", "Easy to sell", "Tax-free"], "a": 0, "why": "Money may be tied up for years."}, {"q": "An individual may qualify as accredited with net worth over:", "o": ["$1 million, excluding a primary residence", "$10,000", "$100 million"], "a": 0, "why": "Or meeting income or professional tests."}, {"q": "The income test for accreditation is generally over:", "o": ["$200,000, or $300,000 with a spouse", "$20,000", "$2 million"], "a": 0, "why": "In each of the last two years."}, {"q": "Pre-IPO shares often come through:", "o": ["Special-purpose vehicles", "Savings accounts", "Treasury bonds"], "a": 0, "why": "Read every fee layer."}, {"q": "Unsolicited pre-IPO offers by text are:", "o": ["A common scam warning sign", "Official offers", "Guaranteed"], "a": 0, "why": "Verify independently."}, {"q": "Form D is:", "o": ["A notice filed with the SEC for many private offerings", "A tax return", "A bank form"], "a": 0, "why": "Ask the sponsor where to find it."}, {"q": "Private investments should be:", "o": ["A small share, money you can afford to lose", "Your emergency fund", "Bought with debt"], "a": 0, "why": "The risks are high."}, {"q": "Venture capital invests in:", "o": ["Young, high-growth companies", "Government bonds", "Savings accounts"], "a": 0, "why": "Many startups fail."}, {"q": "Proverbs 22:26 cautions against:", "o": ["Striking hands and becoming surety for debts", "Saving", "Giving"], "a": 0, "why": "Guard against risky commitments."}]}, "kingdom-5": {"deep": true, "mins": 13, "intro": "When a single investment grows to a large share of your wealth, through an IPO, an employer's stock, or a business sale, you face a wonderful problem with serious risk. This lesson explores how to protect a concentrated position, reduce risk gradually, and manage the tax consequences wisely.", "connect": "Protecting a windfall preserves your why for generations.", "sections": [["Why concentration is dangerous", ["A single company can fall sharply and never recover. Many families have watched life-changing wealth shrink because they held on too long out of loyalty, hope, or tax concerns. Concentration can create wealth; diversification protects it."]], ["Selling gradually and by plan", ["Many investors sell a set amount on a schedule. Company insiders often use Rule 10b5-1 trading plans, which set sales in advance so they can sell even when they have inside information later. A plan removes emotion and the pressure of timing."]], ["Managing taxes", ["Selling shares held more than a year qualifies for lower long-term capital gains rates. Spreading sales across tax years, pairing gains with losses, and giving appreciated shares to charity or a donor-advised fund can all reduce taxes. Do not let taxes alone keep you overly concentrated."]], ["Advanced strategies", ["With professional guidance, investors may use exchange funds, which pool concentrated stocks from many investors for diversification; options strategies such as collars, which limit downside in exchange for capping upside; or charitable remainder trusts, which can provide income while supporting causes you love. Each has costs, rules, and risks."]], ["Gratitude and wisdom", ["\"Honour the LORD with thy substance, and with the firstfruits of all thine increase\" (Proverbs 3:9). A windfall is a season to give thanks, give generously, and steward carefully."]]], "pros": ["Protects life-changing wealth", "Reduces emotional decision-making", "Creates opportunities for strategic giving", "Diversifies your family's future"], "cons": ["Selling can trigger taxes", "You may miss further gains", "Advanced strategies have costs and complexity", "Insider rules can limit timing"], "watch": ["Know your lock-up and company trading windows.", "Do not let taxes alone keep you concentrated.", "Work with a CPA and fiduciary adviser.", "Be cautious of complex products with high fees."], "tip": "Write a one-page \"diversification plan\" before your lock-up ends: how many shares you will sell, when, and what you will do with the proceeds. Decisions made in calm protect you from decisions made in excitement.", "fit": {"starter": "If you receive equity early in your career, learn these rules now.", "mom": "Secure your family's foundation first from any windfall.", "rebuilder": "A settlement or inheritance may be concentrated; diversify thoughtfully.", "ent": "A business sale creates concentration in cash and possibly stock; plan ahead.", "exec": "Use trading plans and diversify regularly.", "late": "Reduce concentration as retirement nears.", "retiree": "Protect income from a single company's fortunes.", "legacy": "Strategic gifts of appreciated shares can bless family and mission."}, "example": "After her company's IPO, Gabrielle owns shares worth $2 million, 70% of her net worth. When the lock-up ends, she follows her written plan: sell 25% each quarter over a year, give $100,000 of appreciated shares to her donor-advised fund, and invest the proceeds in a diversified portfolio. A year later, the stock falls 40%, but most of her wealth is already protected. (Hypothetical example.)", "terms": [["Concentrated position", "A single holding that makes up a large share of wealth."], ["Rule 10b5-1 plan", "A prearranged trading plan used by insiders."], ["Lock-up", "A period after an IPO when insiders cannot sell."], ["Exchange fund", "A fund pooling concentrated stocks for diversification."], ["Collar", "An options strategy limiting losses and gains."], ["Charitable remainder trust", "A trust providing income, with the remainder to charity."]], "verse": ["Honour the LORD with thy substance, and with the firstfruits of all thine increase.", "Proverbs 3:9"], "check": ["Calculate your largest holding as a share of net worth", "Write a diversification plan", "Note your lock-up and trading window dates", "Ask your CPA about tax-efficient selling"], "quiz": [{"q": "A concentrated position is:", "o": ["A single holding that is a large share of wealth", "A diversified fund", "A savings account"], "a": 0, "why": "It carries single-company risk."}, {"q": "Selling gradually by plan helps:", "o": ["Remove emotion and timing pressure", "Guarantee the highest price", "Avoid all taxes"], "a": 0, "why": "A plan provides discipline."}, {"q": "A Rule 10b5-1 plan is used by:", "o": ["Company insiders to prearrange sales", "Banks only", "Charities only"], "a": 0, "why": "It sets trades in advance."}, {"q": "Selling shares held more than a year qualifies for:", "o": ["Lower long-term capital gains rates", "Higher rates", "No taxes always"], "a": 0, "why": "Holding period matters."}, {"q": "An exchange fund:", "o": ["Pools concentrated stocks for diversification", "Is a currency exchange", "Guarantees returns"], "a": 0, "why": "It has rules and lock-ups."}, {"q": "A collar:", "o": ["Limits losses in exchange for capping gains", "Removes all risk for free", "Is a tax"], "a": 0, "why": "It is an options strategy."}, {"q": "A charitable remainder trust can:", "o": ["Provide income while supporting charity", "Avoid all rules", "Only benefit you"], "a": 0, "why": "The remainder goes to charity."}, {"q": "Taxes alone should:", "o": ["Not keep you overly concentrated", "Always decide", "Be ignored"], "a": 0, "why": "Risk matters too."}, {"q": "A diversification plan should be written:", "o": ["Before the lock-up ends", "After the stock falls", "Never"], "a": 0, "why": "Calm decisions protect you."}, {"q": "Proverbs 3:9 calls us to honour the Lord with:", "o": ["The firstfruits of all thine increase", "Leftovers", "Nothing"], "a": 0, "why": "A windfall is a season to give thanks."}]}, "kingdom-6": {"deep": true, "mins": 13, "intro": "Wealth that is not paired with wisdom rarely lasts beyond a generation or two. Family governance is how families make decisions together, prepare heirs, and keep their values alive. It turns a family's wealth into a shared mission rather than a source of conflict.", "connect": "Family governance passes on your why, not only your wealth.", "sections": [["Why families lose wealth", ["Wealth is often lost not through markets but through conflict, unpreparedness, and a lack of shared purpose. Heirs who receive money without wisdom, communication, or responsibility may struggle to keep it, or may be harmed by it."]], ["A family mission statement", ["A family mission statement names your shared values, your purpose for wealth, and how you will treat one another. Write it together, revisit it yearly, and let it guide decisions about giving, investing, and support for family members."]], ["Family meetings", ["Regular family meetings, with an agenda and age-appropriate participation, build communication and trust. Topics can include the family's values, philanthropy, education, and, as heirs mature, the family's assets and plans."]], ["Preparing heirs", ["Teach financial skills at every age: earning, saving, giving, and investing. Give responsibility gradually. Many families use staged distributions, mentoring, and family philanthropy to prepare the next generation."]], ["Teach them diligently", ["\"Train up a child in the way he should go: and when he is old, he will not depart from it\" (Proverbs 22:6). Your values, faith, and wisdom are the greatest inheritance."]]], "pros": ["Reduces conflict and confusion", "Prepares heirs to steward wealth", "Keeps family values alive", "Builds unity around a shared mission"], "cons": ["Requires time and commitment", "Hard conversations are part of it", "Family dynamics can be complex", "Structures need updating over time"], "watch": ["Include family members with care and age-appropriate information.", "Consider a neutral facilitator for difficult conversations.", "Keep documents and plans consistent with your governance.", "Protect privacy; not every detail must be shared."], "tip": "Start with a simple family meeting focused on giving, not money. Ask each family member to bring one cause they care about. Shared generosity is an easier, warmer doorway into deeper conversations.", "fit": {"starter": "Begin conversations about values with those closest to you.", "mom": "Teach children age-appropriate money skills now.", "rebuilder": "Define your family's values for this new season.", "ent": "Plan how family members may, or may not, work in the business.", "exec": "Share your values and plans with your spouse and children.", "late": "Begin family meetings while you can lead them.", "retiree": "Pass on wisdom and stories, not only assets.", "legacy": "Formal governance can guide generations."}, "example": "Valerie gathers her two adult children and their spouses for a first family meeting. Together they write a one-paragraph family mission: to provide security, to give generously, and to help each generation discover its calling. Each person chooses a cause, and the family agrees to give together each year. (Hypothetical example.)", "terms": [["Family governance", "How a family makes decisions together about wealth and values."], ["Family mission statement", "A written statement of shared values and purpose."], ["Family meeting", "A regular gathering to communicate and plan."], ["Heir", "A person who inherits."], ["Staged distribution", "Giving an inheritance in parts over time."], ["Family philanthropy", "Giving together as a family."]], "verse": ["Train up a child in the way he should go: and when he is old, he will not depart from it.", "Proverbs 22:6"], "check": ["Write a draft family mission statement", "Schedule a first family meeting", "Choose one money skill to teach this month", "Plan a shared act of giving"], "quiz": [{"q": "Family wealth is often lost through:", "o": ["Conflict, unpreparedness, and lack of shared purpose", "Only market crashes", "Saving too much"], "a": 0, "why": "Governance addresses these."}, {"q": "A family mission statement names:", "o": ["Shared values and purpose for wealth", "Account numbers", "Tax rates"], "a": 0, "why": "It guides decisions."}, {"q": "Family meetings build:", "o": ["Communication and trust", "Conflict", "Secrecy"], "a": 0, "why": "Regular gatherings strengthen unity."}, {"q": "Preparing heirs includes:", "o": ["Teaching skills and giving responsibility gradually", "Giving everything at once", "Avoiding money talks"], "a": 0, "why": "Wisdom must accompany wealth."}, {"q": "Staged distributions:", "o": ["Give an inheritance in parts over time", "Give it all at once", "Avoid inheritance"], "a": 0, "why": "They allow growth in wisdom."}, {"q": "A neutral facilitator can help with:", "o": ["Difficult conversations", "Picking stocks", "Taxes only"], "a": 0, "why": "Neutrality eases tension."}, {"q": "A warm first family meeting topic is:", "o": ["Shared giving", "Detailed balances", "Disputes"], "a": 0, "why": "Generosity opens doors."}, {"q": "The greatest inheritance is often:", "o": ["Values, faith, and wisdom", "Only money", "Property alone"], "a": 0, "why": "Character outlasts assets."}, {"q": "Information shared with family should be:", "o": ["Age-appropriate and thoughtful", "Everything immediately", "Nothing ever"], "a": 0, "why": "Share with care."}, {"q": "Proverbs 22:6 teaches us to:", "o": ["Train up a child in the way he should go", "Leave children to learn alone", "Avoid teaching"], "a": 0, "why": "Teaching endures."}]}, "kingdom-7": {"deep": true, "mins": 13, "intro": "A legacy plan carries forward everything you have built: your wealth, your work, and your wisdom. It answers three questions: who will lead after you, who will receive what you leave, and what lessons will you pass on. This lesson helps you bring those answers together into one living plan.", "connect": "Your legacy plan ensures your why continues to bless long after you.", "sections": [["Succession: who leads next", ["For a business, ministry, or family enterprise, succession planning identifies and prepares future leaders. Start years in advance. Develop leaders, document how things work, and decide whether ownership will pass to family, key employees, partners, or a buyer."]], ["Transfer: who receives what", ["Your will, trusts, beneficiary designations, and gifts together determine who receives your assets. Coordinate them so they work as one plan, and review them after every major life change. Consider your charitable legacy as well."]], ["Wisdom: what you pass on", ["An ethical will, sometimes called a legacy letter, shares your values, faith, stories, and hopes with those you love. It carries no legal force, but it may be the most treasured thing you leave. Recordings, journals, and family histories can carry your voice for generations."]], ["Keeping it current", ["A legacy plan is a living plan. Review it every few years and after births, deaths, marriages, divorces, moves, and business changes. Share the essentials with the people who will need them."]], ["The heritage of the righteous", ["\"One generation shall praise thy works to another, and shall declare thy mighty acts\" (Psalm 145:4). Your testimony is part of your legacy."]]], "pros": ["Prepares leaders to carry your work forward", "Reduces conflict and confusion for loved ones", "Passes on wisdom along with wealth", "Brings peace of mind"], "cons": ["Requires time and difficult decisions", "Professional help has costs", "Plans must be updated regularly", "Some conversations are emotional"], "watch": ["Coordinate documents so they do not conflict.", "Start succession planning years before you need it.", "Store documents safely and tell trusted people where they are.", "Work with licensed attorneys and advisers in your state."], "tip": "Record a short video or voice message reading your legacy letter. Hearing your voice speak your values and blessings can mean more to your loved ones than any document.", "fit": {"starter": "Write a simple letter of values; update it as life unfolds.", "mom": "Write a letter to each child and name guardians.", "rebuilder": "Update your plan to reflect your new season.", "ent": "Begin a business succession plan now.", "exec": "Mentor successors and document your knowledge.", "late": "Bring your documents and letters up to date.", "retiree": "Share your plan and your stories with loved ones.", "legacy": "Integrate succession, transfer, and wisdom into one plan."}, "example": "Harriet, a founder and grandmother, meets with her attorney to align her trust and beneficiary designations, names her operations director as successor CEO with a three-year transition plan, and writes a legacy letter for each grandchild about faith, generosity, and perseverance. She records herself reading the letters and stores them with her documents. (Hypothetical example.)", "terms": [["Succession plan", "A plan for transferring leadership and ownership."], ["Ethical will", "A letter sharing values and wisdom, also called a legacy letter."], ["Beneficiary designation", "Names who receives an account directly."], ["Estate plan", "Your coordinated documents for transferring assets."], ["Charitable legacy", "Gifts to causes you love through your estate."], ["Living plan", "A plan you review and update regularly."]], "verse": ["One generation shall praise thy works to another, and shall declare thy mighty acts.", "Psalm 145:4"], "check": ["Name potential successors for your work", "Review that your documents agree", "Begin a legacy letter", "Tell a trusted person where your documents are"], "quiz": [{"q": "A legacy plan answers:", "o": ["Who leads, who receives, and what wisdom passes on", "Only who receives money", "Only taxes"], "a": 0, "why": "It brings all three together."}, {"q": "Succession planning should start:", "o": ["Years in advance", "The day you leave", "Never"], "a": 0, "why": "Leaders take time to develop."}, {"q": "An ethical will:", "o": ["Shares values and wisdom", "Transfers property legally", "Replaces a will"], "a": 0, "why": "It carries no legal force but great meaning."}, {"q": "Your documents should be:", "o": ["Coordinated so they do not conflict", "Kept separate and unrelated", "Never reviewed"], "a": 0, "why": "They must work as one plan."}, {"q": "Review your legacy plan:", "o": ["After major life changes", "Never", "Only once"], "a": 0, "why": "It is a living plan."}, {"q": "A charitable legacy:", "o": ["Gives to causes you love through your estate", "Is only for the very wealthy", "Is not allowed"], "a": 0, "why": "Every woman can leave one."}, {"q": "Recording your legacy letter:", "o": ["Preserves your voice for loved ones", "Is required", "Has no value"], "a": 0, "why": "Your voice carries meaning."}, {"q": "Tell trusted people:", "o": ["Where your documents are", "Nothing", "Only your passwords by text"], "a": 0, "why": "They must be able to find them."}, {"q": "Legacy includes:", "o": ["Wealth, work, and wisdom", "Only money", "Only property"], "a": 0, "why": "It is broader than assets."}, {"q": "Psalm 145:4 says one generation shall:", "o": ["Praise thy works to another", "Forget the past", "Keep silent"], "a": 0, "why": "Testimony passes on."}]}, "kingdom-8": {"deep": true, "mins": 14, "intro": "Strategic giving multiplies your impact. It means giving with intention, structure, and wisdom, choosing the right causes, the right tools, and the right timing, so that your generosity transforms lives for years to come.", "connect": "Strategic giving is the fullest expression of your why.", "sections": [["From generous to strategic", ["Generous giving responds to needs as they arise. Strategic giving adds a plan: clear priorities, research into effective organizations, multiyear commitments, and measuring impact. Both matter; strategy makes generosity go further."]], ["Choosing where to give", ["Research organizations with tools such as Candid (formerly GuideStar), Charity Navigator, and the IRS Tax Exempt Organization Search. Look for clear missions, transparent finances, and evidence of impact. Relationships with leaders often reveal the most."]], ["Giving tools", ["Donor-advised funds let you give now, receive a deduction when eligible, and recommend grants over time. Private foundations offer more control but more administration and generally must distribute at least 5% of assets each year. Charitable remainder trusts provide income with a gift to charity at the end. Qualified charitable distributions let IRA owners 70½ or older give directly from their IRA, up to an annual limit."]], ["Giving that builds", ["Consider giving that builds lasting capacity: scholarships, matching gifts, multiyear grants, and support for leaders. Giving circles let women pool resources for greater impact."]], ["Cheerful and wise", ["\"Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver\" (2 Corinthians 9:7)."]]], "pros": ["Multiplies the impact of your generosity", "Can provide tax benefits", "Builds lasting change", "Involves family in shared purpose"], "cons": ["Requires research and planning", "Some tools have costs and rules", "Impact can be hard to measure", "Foundations require ongoing administration"], "watch": ["Verify every organization before giving.", "Keep receipts; gifts of $250 or more require written acknowledgment.", "Understand the rules of each giving tool.", "Give from abundance and peace, never from pressure."], "tip": "Give appreciated investments instead of cash when you can. You may avoid capital gains tax on the growth, and the charity receives the full value. Ask your CPA and the organization how to transfer shares.", "fit": {"starter": "Choose one cause and give consistently.", "mom": "Give together with your children.", "rebuilder": "Even small, regular gifts honor God and bless others.", "ent": "Consider giving through your business, and matching your team's gifts.", "exec": "Use employer matching gifts and stock gifts.", "late": "Consider giving tools that support retirement income too.", "retiree": "Qualified charitable distributions may fit your giving.", "legacy": "A family foundation or donor-advised fund can carry your legacy."}, "example": "Brianna opens a donor-advised fund, contributes appreciated shares, and recommends grants each year to three organizations she has researched: a scholarship fund for young women of color, her church's outreach, and a local literacy program. She invites her nieces to choose one grant each year with her. (Hypothetical example.)", "terms": [["Strategic giving", "Giving with intention, research, and structure."], ["Donor-advised fund", "An account for giving now and granting over time."], ["Private foundation", "A charitable entity with more control and administration."], ["Qualified charitable distribution", "A gift directly from an IRA for those 70½ or older."], ["Giving circle", "A group that pools gifts for shared impact."], ["Written acknowledgment", "A receipt required for gifts of $250 or more."]], "verse": ["Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.", "2 Corinthians 9:7"], "check": ["Name your top three giving priorities", "Research one organization on Candid or Charity Navigator", "Ask your CPA about giving appreciated investments", "Invite a loved one to give with you"], "quiz": [{"q": "Strategic giving adds:", "o": ["A plan, research, and structure", "Pressure", "Secrecy"], "a": 0, "why": "Strategy makes generosity go further."}, {"q": "Candid, Charity Navigator, and the IRS search help you:", "o": ["Research organizations", "Pick stocks", "File taxes"], "a": 0, "why": "Verify before giving."}, {"q": "A donor-advised fund lets you:", "o": ["Give now and recommend grants over time", "Avoid all rules", "Invest for yourself"], "a": 0, "why": "It simplifies giving."}, {"q": "Private foundations generally must distribute at least:", "o": ["5% of assets each year", "50%", "Nothing"], "a": 0, "why": "They also require administration."}, {"q": "A qualified charitable distribution is available to IRA owners:", "o": ["70½ or older", "Of any age", "Under 30 only"], "a": 0, "why": "Up to an annual limit."}, {"q": "Gifts of $250 or more require:", "o": ["Written acknowledgment", "Nothing", "A lawyer"], "a": 0, "why": "Keep receipts."}, {"q": "Giving appreciated investments can:", "o": ["Avoid capital gains tax on the growth", "Increase taxes", "Be illegal"], "a": 0, "why": "The charity receives full value."}, {"q": "A giving circle:", "o": ["Pools gifts for shared impact", "Is a bank", "Is a loan"], "a": 0, "why": "Women multiply impact together."}, {"q": "Giving that builds lasting capacity includes:", "o": ["Scholarships and multiyear grants", "Only one-time gifts", "Nothing"], "a": 0, "why": "It creates lasting change."}, {"q": "2 Corinthians 9:7 says God loveth:", "o": ["A cheerful giver", "A reluctant giver", "A secret hoarder"], "a": 0, "why": "Give from the heart."}]}, "kingdom-9": {"deep": true, "mins": 12, "intro": "This is your capstone, sister. You began as a Seed, faithful over few. You have sown with purpose, stewarded much, and built for generations. Now you are called to become a kingdom wealth distributor: a woman whose wealth flows through her hands to bless people, communities, and nations.", "connect": "Your why has grown into a calling to bless the world.", "sections": [["What a kingdom wealth distributor is", ["A kingdom wealth distributor understands that wealth is entrusted, not owned. She builds wisely so she can give generously, invests so she can bless, and leads so others can rise. Her wealth is a river, not a reservoir."]], ["Blessed to be a blessing", ["\"I will bless thee... and thou shalt be a blessing\" (Genesis 12:2). The blessing on your life was never meant to stop with you. It is meant to reach your family, your community, and those who have been overlooked, especially women of color and under-resourced and underserved women, children, and communities."]], ["Your personal giving plan", ["Bring together everything you have learned: your budget, your investments, your tax strategies, your estate plan, and your strategic giving. Set a giving goal as a percentage of income or wealth, choose your priorities, and select your tools."]], ["Lifting other women", ["Mentor a woman who is where you once were. Sponsor a sister's membership. Share what you have learned. Every woman you lift becomes another woman who can lift others."]], ["Graduation and the giving journey", ["Completing this lesson and your Kingdom Builder assessment earns your graduation certificate. Your next path, the giving journey, carries you from local giving to national giving and, if God leads, to serving as a Global Kingdom Ambassador through Cherie Banks Ministries™ and Birthing Billions™."]]], "pros": ["Your wealth gains eternal purpose", "Your impact reaches far beyond your lifetime", "You lift other women as you rise", "You join a community of givers"], "cons": ["It requires continued discipline", "Giving well takes research and wisdom", "Some needs will exceed your resources", "Generosity must be balanced with stewardship"], "watch": ["Keep your own foundation strong while you give.", "Give through verified organizations.", "Guard against pressure-based or emotional giving.", "Remember that you are a steward, not a savior."], "tip": "Write your giving goal on the same page as your financial goals. When giving sits beside saving and investing in your plan, it stops being an afterthought and becomes part of who you are.", "fit": {"starter": "Even early in your journey, you can begin distributing blessing.", "mom": "Raise your children to be kingdom wealth distributors too.", "rebuilder": "Your story of restoration will strengthen others.", "ent": "Use your business as a channel for blessing.", "exec": "Use your influence and resources to open doors for others.", "late": "It is never too late to give with purpose.", "retiree": "Your time and wisdom are gifts as valuable as money.", "legacy": "Your legacy becomes a river that flows for generations."}, "example": "Felicia began at the Seed tier with $500 in savings. Years later, with her emergency fund, investments, and estate plan in place, she gives 15% of her income, sponsors two women's memberships each year, mentors a young entrepreneur, and leads a local giving circle that has funded scholarships for 20 young women. (Hypothetical example.)", "terms": [["Kingdom wealth distributor", "A woman whose wealth flows to bless others."], ["Giving goal", "A planned amount or percentage to give."], ["Giving journey", "The path from local to national to global giving."], ["Global Kingdom Ambassador", "The highest level of the giving journey."], ["Sponsorship", "Paying for another woman's membership."], ["Mentoring", "Guiding another woman on her journey."]], "verse": ["And I will make of thee a great nation, and I will bless thee, and make thy name great; and thou shalt be a blessing.", "Genesis 12:2"], "check": ["Write your giving goal", "Choose one woman to mentor or sponsor", "Combine your financial and giving plans on one page", "Complete your Kingdom Builder assessment"], "quiz": [{"q": "A kingdom wealth distributor understands that wealth is:", "o": ["Entrusted, not owned", "Only for herself", "Shameful"], "a": 0, "why": "Her wealth is a river."}, {"q": "Genesis 12:2 says:", "o": ["Thou shalt be a blessing", "Keep all blessings", "Avoid wealth"], "a": 0, "why": "Blessing is meant to flow."}, {"q": "A personal giving plan brings together:", "o": ["Budget, investments, taxes, estate plan, and giving", "Only giving", "Only taxes"], "a": 0, "why": "Everything works together."}, {"q": "Lifting other women includes:", "o": ["Mentoring and sponsoring", "Competing", "Keeping knowledge private"], "a": 0, "why": "Every woman lifted lifts others."}, {"q": "Completing this lesson and the assessment earns:", "o": ["Your graduation certificate", "Nothing", "A loan"], "a": 0, "why": "Then the giving journey begins."}, {"q": "The giving journey moves from:", "o": ["Local to national to global giving", "Global to nothing", "Only local"], "a": 0, "why": "It grows step by step."}, {"q": "While giving, you should:", "o": ["Keep your own foundation strong", "Give away your emergency fund", "Borrow to give"], "a": 0, "why": "Stewardship and generosity go together."}, {"q": "You are:", "o": ["A steward, not a savior", "The only savior", "Responsible for every need"], "a": 0, "why": "There is only one Savior."}, {"q": "Your time and wisdom are:", "o": ["Gifts as valuable as money", "Worthless", "Only for yourself"], "a": 0, "why": "Giving is more than money."}, {"q": "A kingdom wealth distributor's wealth is:", "o": ["A river, not a reservoir", "A reservoir", "A secret"], "a": 0, "why": "It flows to bless."}]}});

const GUIDE=[
 ['money','Your Money Story','Reflect on your relationship with money, discover your money archetype, and break free from every stronghold. Every woman carries a money story written before she earned her first dollar. Here, with God, you will write a new one, for yourself and your loved ones, for the children in your life, and for every generation after you. Behold, all things are become new (2 Corinthians 5:17).',{go:'money'}],
 ['story','My Story · Rev. Dr. Cherie Banks','From homeless at 13 on Chicago\'s South Side to the halls of the University of Oxford in the United Kingdom, studying international law, and on to helping generate billions for Fortune 500 companies. I share it so you can see what God can do with a life surrendered unto Him (Romans 12:1). My prayer is that you go further than I ever have, and that every ceiling I broke becomes your floor.',{go:'story'}],
 ['paths','Build Your Wealth Portfolio','Wealth is so much more than stocks and bonds. Give a portion to seven, and also to eight (Ecclesiastes 11:2). Discover savings and Treasury bonds, retirement and life insurance, 529 education plans for you and the ones you love, homeownership and VA loans, a real estate portfolio of residential and commercial property, and business. You only have to take the next step.',{go:'paths'}],
 ['learn','Your Path from Seed to Kingdom','Four tiers, from Seed to Kingdom Builder, each one rooted in Scripture and built for real life. Wherever you begin, you are not behind, so do not despise the day of small beginnings (Zechariah 4:10). A seed in God\'s hands holds an entire harvest, and every lesson draws you closer to the woman He created you to be.',{jump:'learn'}],
 ['tools','Tools to Write the Vision','Compound Growth, Goal Planner, CD Earnings, Fee Impact, and IPO & Shares. Write the vision and make it plain (Habakkuk 2:2). Here you will see your future in numbers, watch your faithfulness multiply over time, and pursue every goal God has placed on your heart with faith, with wisdom, and with expectation.',{jump:'tools'}],
 ['library','Pearls of Wisdom','The Knowledge Base, savings and money market accounts, trusted investment brokers, ways to grow your wealth, the wise who walked before you, and Biblical Scripture. Wisdom is more precious than rubies (Proverbs 3:15). Come here often, sister, and let knowledge build confidence where fear once lived.',{jump:'library'}],
 ['home','Her Wealth Journey','Your private record of God\'s faithfulness. Once a month, you mark your progress and watch your story unfold. In the good months, we celebrate together. In the hard months, we remember that you are still standing, still believing God, and that your latter will be greater than your former (Haggai 2:9).',{jump:'home'}],
 ['credit','Your Credit Comeback','Your credit score is a number, not your identity. Build your credit, restore your credit, and know your rights, with a guide to the law and free government sample letters. Isaac sowed in a season of famine and reaped a hundredfold (Genesis 26:12). Restoration is God\'s specialty, and I believe your harvest is coming a hundredfold.',{go:'credit'}],
 ['giving','Kingdom Giving','This is where it all leads. You are blessed to be a blessing (Genesis 12:2). Learn to give with joy, with wisdom, and with purpose, and build a giving plan that funds the Kingdom and changes lives for generations, giving all glory to God. Every gift you sow becomes a living testimony of His goodness.',{go:'giving'}],
 ['case','Live Case Study','Walk with me through the Anthropic IPO as it unfolds, one chapter at a time. You will learn to look past the headlines, weigh the risks, and decide with discernment, as a wise woman who counts the cost before she builds (Luke 14:28). Excitement fades, but wisdom endures, and wisdom will carry you far.',{go:'case'}],
 ['actions','Your Action Steps','Faith without works is dead (James 2:17). Twelve steps, from your first $1,000 to your giving plan, turn what you learn into a firm foundation your family can stand on for generations. Take one step at a time, at your own pace, and know this, sister: I will celebrate every single step of faith you take.',{go:'actions'}],
 ['share','Pay It Forward','Freely you have received, so freely give (Matthew 10:8). Share the blessing. Invite your mother and your sister, your daughter and your aunt, your niece and your dearest friend, to join you here at Her Kingdom Wealth™. When one woman rises, she reaches back for another, and a whole family line begins to change, one sister, one story, one seed at a time.',{go:'share'}],
 ['help','Help for Every Season','Whatever you are facing, you are not alone. Free, confidential help for abuse and crisis, sexual assault and pregnancy, debt and job loss, housing and addiction, for you or for a sister you love. I am standing in the gap for you, and God is a very present help in trouble (Psalm 46:1). Please reach out today; help is waiting.',{go:'help'}],
 ['me','All About You','Everything here is about you: your why, your lived experience, and your action steps, your membership and Member Care, your privacy and your safety. This is your space to grow and to heal, to dream and to be celebrated, and to walk in the financial freedom that is your birthright as a daughter of the King and a joint-heir with Christ (Romans 8:17). You are seen by the God who sees (Genesis 16:13), you are loved, and you will never walk this journey alone.',{jump:'me'}]

const RATES=[['Conservative',.04,'#D9B877'],['Moderate',.07,'#A8793A'],['Aggressive',.10,'#B4566C']];
function fv(p,m,r,y){const i=r/12,n=y*12;return i===0?p+m*n:p*Math.pow(1+i,n)+m*(Math.pow(1+i,n)-1)/i}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function lineChart(series,years,label){
 const W=320,H=190,L=46,R=10,T=10,B=26,max=niceMax(Math.max(...series.flatMap(s=>s.v)));
 const x=i=>L+(W-L-R)*i/years,y=v=>T+(H-T-B)*(1-v/max);
 let g='';for(let k=0;k<=4;k++){const v=max*k/4;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${short(v)}</text>`}
 const step=years<=10?2:years<=20?5:10;for(let t=0;t<=years;t+=step)g+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle">${t}y</text>`;
 const lines=series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="${s.w||2.2}" ${s.dash?'stroke-dasharray="4 4"':''} points="${s.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(years)}" cy="${y(s.v[years])}" r="3.5" fill="${s.c}"/>`).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">${g}${lines}</svg><div class="legend">${series.map(s=>`<span style="--c:${s.c}">${s.n}</span>`).join('')}</div>`;
}

/* ---------- Supabase sync (production only) ----------
   Sends the sign-up form and Contact Us messages to the HKW Supabase project.
   Runs only on hosts listed in config.js, so the preview and tests send nothing.
   Never sends the safety answer, Safety Exit, Wealth Journey, or calculator inputs. */
const hkwSync=(()=>{const c=window.HKW_CONFIG||{};
 const on=!!(c.supabaseUrl&&c.supabaseKey&&Array.isArray(c.hosts)&&c.hosts.includes(location.hostname));
 return {on,source:c.source||'app',post(table,row){if(!on)return Promise.resolve(false);
  return fetch(c.supabaseUrl.replace(/\/$/,'')+'/rest/v1/'+table,{method:'POST',keepalive:true,
   headers:{apikey:c.supabaseKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)})
   .then(r=>r.ok).catch(()=>false)}}})();

  case 'landing':h=vLanding();break; case 'signup':h=vSignup();break; case 'quiz':h=vQuiz();break;
  case 'tierresult':h=vTierResult();break; case 'archetype':h=vArchetype();break; case 'lesson':h=vLesson();break;
  case 'case':h=vCase();break; case 'plans':h=vPlans();break; case 'care':h=vCare();break; case 'admin':h=vAdmin();break;
  case 'security':h=vSecurity();break; case 'why':h=vWhy();break; case 'welcome':h=vWelcome();break; case 'guide':h=vGuide();break; case 'money':h=vMoney();break; case 'paths':h=vPaths();break; case 'story':h=vStory();break; case 'help':h=vHelp();break; case 'actions':h=vActions();break; case 'share':h=vShare();break; case 'bless':h=vBless();break; case 'search':h=vSearch();break; case 'involve':h=vInvolve();break; case 'credit':h=vCredit();break; case 'giving':h=vGiving();break; case 'exit':h=vExit();break;
  default:h=shell({home:vHome,learn:vLearn,grow:vGrow,restore:vRestore,tools:vTools,library:vLibrary,me:vMe}[S.tab](),{nav:true});
 }
 const vk=S.view+'|'+S.tab+'|'+S.lesson+'|'+S.lib+'|'+S.careTab;const r=$('#root');r.classList.toggle('enter',vk!==render.k);render.k=vk;
 r.innerHTML=h+celebrate()+cheerView()+safetyModal()+infoSheet();

/* Page addresses: /signup opens sign-up and /login opens sign-in; every other screen shows "/". */
const PAGE_PATHS=['/','/signup','/login','/signin'];
function syncPath(){
 if(!/^https?:$/.test(location.protocol)||!PAGE_PATHS.includes(location.pathname))return;
 const a=window.hkwAuth&&hkwAuth.on&&hkwAuth.st;
 const want=S.view==='signup'?'/signup':S.view==='auth'&&a&&['signin','forgot','reset'].includes(a.step)?'/login':'/';
 if(location.pathname!==want)try{history.replaceState(history.state,'',want+location.search+location.hash)}catch(e){}
}
