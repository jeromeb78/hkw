nderstand what you own", "Lets you compare companies", "Reveals expectations built into a price", "Builds confidence in financial conversations"], "cons": ["Numbers show only part of the story", "Ratios can mislead without context", "Prices change constantly", "Very high yields can be traps"], "watch": ["Never buy based on one number alone.", "Compare ratios with similar companies, not across industries.", "Be cautious of unusually high dividend yields.", "Use limit orders when spreads are wide."], "tip": "Look at the bid and ask before you place an order. If the spread is wide, a limit order between the two can save you money compared with a market order.", "fit": {"starter": "Learn to read quotes before buying individual stocks.", "mom": "Read quotes together with older children as a lesson.", "rebuilder": "Take your time; there is no rush to buy individual stocks.", "ent": "Use these measures to think about your own company's value.", "exec": "Understand your own company's quote and valuation.", "late": "Focus on broad funds; use quotes to stay informed.", "retiree": "Watch dividend yields and their sustainability.", "legacy": "Teach the next generation to read beyond the price."}, "example": "Simone looks up a company: price $80, EPS $4, so the P/E is 20. Its yearly dividend is $2, so the yield is 2.5%. Its 52-week range is $60 to $95, and its market cap is $40 billion, a large-cap company. She compares its P/E with two similar companies before deciding anything. (Hypothetical example.)", "terms": [["Bid", "The highest price buyers are offering."], ["Ask", "The lowest price sellers will accept."], ["Spread", "The difference between the bid and the ask."], ["Market cap", "Share price times shares outstanding."], ["EPS", "Earnings per share."], ["P/E ratio", "Price divided by earnings per share."]], "verse": ["Through wisdom is an house builded; and by understanding it is established.", "Proverbs 24:3"], "check": ["Look up one company's quote", "Calculate its P/E from price and EPS", "Find its dividend yield", "Compare its P/E with a similar company"], "quiz": [{"q": "The bid is:", "o": ["The highest price buyers are offering", "The lowest price sellers accept", "Yesterday's price"], "a": 0, "why": "Buyers bid; sellers ask."}, {"q": "The spread is:", "o": ["The difference between the bid and ask", "A dividend", "A tax"], "a": 0, "why": "Smaller spreads are cheaper to trade."}, {"q": "Market cap equals:", "o": ["Share price times shares outstanding", "Profit times ten", "Revenue"], "a": 0, "why": "It is the company's market value."}, {"q": "A P/E of 20 means investors pay:", "o": ["$20 for every $1 of yearly profit", "$1 for every $20 of profit", "Nothing"], "a": 0, "why": "Price divided by earnings."}, {"q": "A $100 stock paying $3 a year yields:", "o": ["3%", "30%", "0.3%"], "a": 0, "why": "$3 divided by $100."}, {"q": "A very high dividend yield can signal:", "o": ["A dividend cut may be coming", "Guaranteed income", "A perfect investment"], "a": 0, "why": "The price may have fallen for a reason."}, {"q": "The 52-week range shows:", "o": ["The lowest and highest prices over the past year", "This week only", "Future prices"], "a": 0, "why": "It gives context."}, {"q": "P/E ratios are best compared:", "o": ["With similar companies", "Across unrelated industries", "Never"], "a": 0, "why": "Different industries have different norms."}, {"q": "Volume measures:", "o": ["Shares traded", "Company profit", "Dividends"], "a": 0, "why": "High volume usually means easier trading."}, {"q": "Proverbs 24:3 teaches that a house is built by:", "o": ["Wisdom", "Luck", "Haste"], "a": 0, "why": "Understanding establishes it."}]}, "sower-7": {"deep": true, "mins": 13, "intro": "Every public company tells its story through three financial statements. The income statement shows whether it made money. The balance sheet shows what it owns and owes. The cash flow statement shows where its cash really went. Together, they help you see past the headlines.", "connect": "Reading the statements helps you place your money only where it can truly grow.", "sections": [["The income statement", ["It starts with revenue, the money the company brought in. Then it subtracts costs to show gross profit, operating income, and finally net income, the bottom line. Look for revenue growing over several years and profits that are steady or rising."]], ["The balance sheet", ["It lists assets (what the company owns), liabilities (what it owes), and shareholders' equity (what is left for owners). Assets always equal liabilities plus equity. Watch for heavy debt compared with equity, and for cash on hand to handle hard times."]], ["The cash flow statement", ["Profits on paper are not the same as cash in the bank. This statement shows cash from operations, from investing (such as buying equipment), and from financing (such as borrowing or paying dividends). Healthy companies usually generate positive cash from operations year after year."]], ["Free cash flow", ["Free cash flow is cash from operations minus capital expenditures, the money spent on long-term assets. It is the cash a company can use to grow, pay dividends, repay debt, or buy back shares. Many investors consider it one of the clearest signs of a company's health."]], ["Read the story, not just the numbers", ["Compare several years, not one. Read the explanations in the company's annual report. Ask whether the story makes sense.", "\"The heart of him that hath understanding seeketh knowledge\" (Proverbs 15:14)."]]], "pros": ["Reveals a company's true health", "Helps you avoid companies with hidden problems", "Lets you compare companies fairly", "Builds lasting investing wisdom"], "cons": ["Statements take time to learn", "Accounting can be complex", "Past results do not guarantee the future", "Numbers can be presented favorably"], "watch": ["Look at several years, not one.", "Be cautious when profits rise but cash flow falls.", "Watch rising debt.", "Read the notes and management's explanations."], "tip": "Start with the cash flow statement. When a company reports rising profits but its cash from operations keeps falling, it is worth asking why before you invest.", "fit": {"starter": "Learn one statement at a time.", "mom": "Teach older children how a business makes money.", "rebuilder": "These skills protect you from investments you do not understand.", "ent": "Read your own business statements every month.", "exec": "Understand your employer's statements and what drives them.", "late": "Focus on understanding the companies in any individual holdings.", "retiree": "Look for steady cash flow behind any dividend you rely on.", "legacy": "Teach the next generation to read the story behind the numbers."}, "example": "Andrea compares two companies with similar revenue. Company A's net income is rising and its cash from operations is rising too. Company B's net income is rising, but its cash from operations has fallen three years in a row while its debt has doubled. She studies Company B's notes before considering it any further. (Hypothetical example.)", "terms": [["Revenue", "Money a company brings in from sales."], ["Net income", "Profit after all expenses; the bottom line."], ["Assets", "What a company owns."], ["Liabilities", "What a company owes."], ["Shareholders' equity", "Assets minus liabilities."], ["Free cash flow", "Cash from operations minus capital expenditures."]], "verse": ["The heart of him that hath understanding seeketh knowledge.", "Proverbs 15:14"], "check": ["Find one company's income statement", "Compare three years of revenue", "Check its debt on the balance sheet", "Calculate its free cash flow"], "quiz": [{"q": "The income statement shows:", "o": ["Revenue, costs, and profit", "Only debt", "Only cash"], "a": 0, "why": "It answers whether the company made money."}, {"q": "The balance sheet shows:", "o": ["Assets, liabilities, and equity", "Only revenue", "Stock prices"], "a": 0, "why": "It shows what is owned and owed."}, {"q": "Assets equal:", "o": ["Liabilities plus equity", "Revenue minus costs", "Cash only"], "a": 0, "why": "The balance sheet always balances."}, {"q": "The cash flow statement shows:", "o": ["Where cash came from and went", "Only profit", "Share price"], "a": 0, "why": "Cash is not the same as profit."}, {"q": "Free cash flow equals:", "o": ["Cash from operations minus capital expenditures", "Revenue", "Net income plus debt"], "a": 0, "why": "It shows cash available to use."}, {"q": "Net income is:", "o": ["The bottom line, profit after all expenses", "Total sales", "Cash on hand"], "a": 0, "why": "It is at the bottom of the income statement."}, {"q": "Rising profits with falling operating cash flow is:", "o": ["A reason to investigate", "Always good", "Impossible"], "a": 0, "why": "Paper profits may not be real cash."}, {"q": "When reading statements, compare:", "o": ["Several years", "One quarter only", "Nothing"], "a": 0, "why": "Trends reveal the story."}, {"q": "Shareholders' equity is:", "o": ["Assets minus liabilities", "Total debt", "Revenue"], "a": 0, "why": "It is what belongs to owners."}, {"q": "Proverbs 15:14 says the heart of understanding:", "o": ["Seeketh knowledge", "Rests", "Fears"], "a": 0, "why": "Wise investors keep learning."}]}, "sower-8": {"deep": true, "mins": 11, "intro": "Public companies must file reports with the Securities and Exchange Commission, and every one is free to read on SEC EDGAR. Knowing which filings matter and how to find them lets you go straight to the source, instead of relying on headlines or social media.", "connect": "Going to the source protects your money and honors your why.", "sections": [["Finding EDGAR", ["Go to sec.gov and search for a company by name or ticker in EDGAR, the SEC's free database of filings. You will see a list of every report the company has filed, newest first."]], ["The 10-K: the annual report", ["The 10-K is the company's detailed yearly report. It describes the business, its risks, management's discussion of results, and audited financial statements. It is the most complete picture of a company you will find."]], ["The 10-Q and 8-K", ["The 10-Q is the quarterly report, with unaudited financial statements and updates. The 8-K reports major events between regular reports, such as a new chief executive, an acquisition, or a significant problem."]], ["The S-1 and the proxy statement", ["The S-1 is the registration statement a company files before going public; it is the main source of information about an IPO. The proxy statement, filed as a DEF 14A, explains shareholder votes and executive pay."]], ["How to skim a 10-K wisely", ["Start with the business description, then the risk factors, then management's discussion and analysis, and finally the financial statements. Note anything you do not understand and look it up.", "\"It is the glory of God to conceal a thing: but the honour of kings is to search out a matter\" (Proverbs 25:2)."]]], "pros": ["Free, official information", "Straight from the company, not headlines", "Reveals risks companies must disclose", "Builds confidence and discernment"], "cons": ["Filings are long and technical", "They take time to read", "Some language is legal and dense", "Filings describe the past, not the future"], "watch": ["Use the official sec.gov site, not look-alike sites.", "Read the risk factors carefully.", "Compare several filings over time.", "Be wary of anyone who quotes a filing out of context."], "tip": "Use your browser's find feature (Ctrl+F or Command+F) inside a long filing. Search words like \"risk,\" \"debt,\" or \"customer\" to jump straight to what matters.", "fit": {"starter": "Practice by reading the business section of a company you know.", "mom": "Read about companies your family uses every day.", "rebuilder": "Filings help you verify anything you are told.", "ent": "Learn how public companies describe their markets and risks.", "exec": "Read your own employer's filings.", "late": "Focus on the companies behind any individual holdings.", "retiree": "Read 8-Ks for companies you rely on for income.", "legacy": "Teach the next generation to go to the source."}, "example": "Brittany hears a rumor online about a company she owns. Instead of reacting, she visits sec.gov, opens EDGAR, and checks for any recent 8-K. She finds none, reads the latest 10-Q, and sees nothing that matches the rumor. She stays the course. (Hypothetical example.)", "terms": [["SEC EDGAR", "The SEC's free online database of company filings."], ["10-K", "A company's detailed annual report."], ["10-Q", "A company's quarterly report."], ["8-K", "A report of major events."], ["S-1", "A registration statement filed before an IPO."], ["Proxy statement", "A filing about shareholder votes and executive pay."]], "verse": ["It is the glory of God to conceal a thing: but the honour of kings is to search out a matter.", "Proverbs 25:2"], "check": ["Visit sec.gov and open EDGAR", "Find one company's latest 10-K", "Read its risk factors", "Look for any recent 8-K"], "quiz": [{"q": "EDGAR is:", "o": ["The SEC's free database of filings", "A brokerage", "A stock"], "a": 0, "why": "It is at sec.gov."}, {"q": "The 10-K is:", "o": ["The annual report", "A quarterly report", "A tax form"], "a": 0, "why": "It is the most complete yearly picture."}, {"q": "The 10-Q is:", "o": ["The quarterly report", "The annual report", "An IPO filing"], "a": 0, "why": "It updates investors each quarter."}, {"q": "The 8-K reports:", "o": ["Major events between regular reports", "Only dividends", "Nothing"], "a": 0, "why": "Such as a new CEO or an acquisition."}, {"q": "The S-1 is filed:", "o": ["Before a company goes public", "Every year", "By individual investors"], "a": 0, "why": "It is the main IPO disclosure."}, {"q": "Executive pay is explained in:", "o": ["The proxy statement", "The 8-K only", "A bank statement"], "a": 0, "why": "It is filed as a DEF 14A."}, {"q": "A wise way to start a 10-K is with:", "o": ["The business description and risk factors", "The last page only", "Social media comments"], "a": 0, "why": "Understand the business first."}, {"q": "Are SEC filings free to read?", "o": ["Yes", "No", "Only for professionals"], "a": 0, "why": "They are public."}, {"q": "When you hear a rumor about a company, you can:", "o": ["Check EDGAR for official filings", "Sell immediately", "Buy more immediately"], "a": 0, "why": "Go to the source."}, {"q": "Proverbs 25:2 says the honour of kings is to:", "o": ["Search out a matter", "Ignore details", "Follow rumors"], "a": 0, "why": "Wise women search things out."}]}, "sower-9": {"deep": true, "mins": 13, "intro": "When a well-known company goes public, excitement runs high and prices can swing wildly. The IPO playbook helps you understand what happens in the first days and months, so you can make a calm, informed decision instead of an emotional one.", "connect": "A wise plan for exciting moments protects your why from impulse.", "sections": [["How shares reach the market", ["Investment banks underwrite the IPO and set an offering price. Most shares at that price go to large institutions. Everyday investors usually buy once the stock begins trading on the exchange, often at a different price."]], ["The first-day pop", ["Shares sometimes open far above the offering price, which is called a pop. Buying in that excitement can mean paying a premium. Many IPOs later trade below their first-day highs, though some grow strongly over time."]], ["The quiet period and analyst coverage", ["For a period after the IPO, underwriting banks wait before publishing research. When analysts begin covering the stock, their reports can move the price."]], ["The lock-up period", ["Insiders such as founders, employees, and early investors usually agree not to sell their shares for a set time, commonly 90 to 180 days. When the lock-up ends, a wave of selling can push the price down. The S-1 states the lock-up terms."]], ["A calm IPO plan", ["Read the S-1. Decide in advance how much, if anything, you will invest, and keep it a small part of your portfolio. Use limit orders. Consider waiting until after the first earnings report or the end of the lock-up. Remember that a broad index fund may eventually own the company for you.", "\"He that hasteth with his feet sinneth\" (Proverbs 19:2)."]]], "pros": ["A chance to own a company early in its public life", "Clear disclosures in the S-1", "Some IPOs grow strongly over time", "Excitement can be an opportunity to learn"], "cons": ["First-day prices can be inflated", "Lock-up expirations can push prices down", "Limited public track record", "High volatility"], "watch": ["Never use a market order on IPO day.", "Keep any IPO position small.", "Be wary of texts or social media offering early IPO access.", "Read the lock-up date in the S-1."], "tip": "Put the lock-up expiration date on your calendar the day a company you own goes public. It is often a moment of extra price movement, and knowing the date in advance keeps you calm.", "fit": {"starter": "Learn from IPOs; invest only small amounts, if any.", "mom": "Keep family money in diversified funds.", "rebuilder": "An IPO is not the place to rebuild; diversify first.", "ent": "Study the S-1s of companies in your industry.", "exec": "If your own company goes public, plan for taxes and diversification.", "late": "Keep any IPO position small relative to your goals.", "retiree": "Protect income; avoid large speculative positions.", "legacy": "Discuss IPO wealth and concentration with your advisers."}, "example": "When a popular company goes public, Nicole reads its S-1, notes the 180-day lock-up, and decides to invest no more than 2% of her portfolio. She places a limit order instead of chasing the opening price, and sets a reminder for the lock-up date. (Hypothetical example.)", "terms": [["Underwriter", "The investment bank that manages an IPO."], ["Offering price", "The price set for initial IPO shares."], ["Pop", "A sharp first-day price rise."], ["Lock-up period", "A time insiders cannot sell their shares."], ["Quiet period", "A time after the IPO before underwriter research is published."], ["Volatility", "How much and how quickly prices move."]], "verse": ["Also, that the soul be without knowledge, it is not good; and he that hasteth with his feet sinneth.", "Proverbs 19:2"], "check": ["Find a recent IPO's S-1 on EDGAR", "Locate its lock-up terms", "Decide your personal IPO limit", "Practice placing a limit order"], "quiz": [{"q": "Most shares at the IPO offering price go to:", "o": ["Large institutions", "Every individual equally", "No one"], "a": 0, "why": "Everyday investors usually buy once trading begins."}, {"q": "A first-day pop means:", "o": ["Shares open well above the offering price", "Shares are free", "Trading is halted"], "a": 0, "why": "Buying then can mean paying a premium."}, {"q": "A lock-up period commonly lasts:", "o": ["90 to 180 days", "One hour", "Ten years"], "a": 0, "why": "Check the S-1 for exact terms."}, {"q": "When a lock-up ends:", "o": ["Insider selling can push the price down", "The stock is delisted", "Dividends begin"], "a": 0, "why": "More shares may be sold."}, {"q": "On IPO day, a safer order type is:", "o": ["A limit order", "A market order", "No order is possible"], "a": 0, "why": "It caps the price you pay."}, {"q": "The underwriter is:", "o": ["The investment bank managing the IPO", "The SEC", "An individual investor"], "a": 0, "why": "It sets the offering price with the company."}, {"q": "An IPO position should generally be:", "o": ["A small part of your portfolio", "All of your savings", "Borrowed money"], "a": 0, "why": "New stocks are volatile."}, {"q": "Texts offering early IPO access are:", "o": ["A common scam", "Official offers", "Required by law"], "a": 0, "why": "Real allocations do not come by text."}, {"q": "Where are lock-up terms found?", "o": ["In the S-1", "On social media", "In your bank statement"], "a": 0, "why": "The S-1 is the official disclosure."}, {"q": "Proverbs 19:2 warns that he who hastes with his feet:", "o": ["Sinneth", "Wins", "Rests"], "a": 0, "why": "Haste without knowledge leads astray."}]}, "steward-0": {"deep": true, "mins": 12, "intro": "As your wealth grows, protecting it becomes as important as growing it. Position sizing keeps any single investment from putting your future at risk. Rebalancing keeps your portfolio aligned with the plan you made in a calm season, not the emotions of a stormy one.", "connect": "Guarding what you have built keeps your why secure for the years ahead.", "sections": [["Position sizing", ["Position sizing means deciding how much of your portfolio any single investment may hold. Many investors keep any one stock under 5% to 10% of their total portfolio, so that even a serious loss cannot derail their goals. Broad index funds can safely be larger, because each one already holds many companies."]], ["Concentration risk", ["When one holding grows to a large share of your wealth, through a great run or an employer's stock, your future depends on one company's fortunes. Many families have lost much of their wealth this way. Concentration can build wealth, but diversification is what keeps it."]], ["Rebalancing", ["Over time, your mix drifts. If stocks rise, they become a larger share of your portfolio than you intended. Rebalancing means selling some of what has grown and buying what has lagged, returning to your target mix.", "Two common approaches: rebalance on a calendar, such as once a year, or rebalance whenever any part drifts more than about 5 percentage points from its target."]], ["Rebalancing wisely", ["Rebalance inside tax-advantaged accounts first, where selling does not trigger taxes. Use new contributions and dividends to buy what is underweight. In taxable accounts, consider the tax cost before selling."]], ["Discipline over emotion", ["Rebalancing asks you to sell what feels exciting and buy what feels disappointing. That is exactly why it works.", "\"A wise man is strong; yea, a man of knowledge increaseth strength\" (Proverbs 24:5)."]]], "pros": ["Limits the damage any single investment can do", "Keeps your risk aligned with your plan", "Builds a habit of buying low and selling high", "Reduces emotional decision-making"], "cons": ["You may sell a winner before it peaks", "Rebalancing in taxable accounts can trigger taxes", "It requires discipline when emotions run high", "Small accounts may have trading costs"], "watch": ["Know your largest holdings as a share of your total wealth.", "Count company stock from your employer in your concentration.", "Check tax consequences before selling in a taxable account.", "Do not let a great run change your plan without reflection."], "tip": "Set a yearly \"rebalancing day,\" perhaps your birthday or the first week of January. Linking it to a date you never forget makes the discipline automatic.", "fit": {"starter": "Learn the habit now with simple funds.", "mom": "Keep education money and retirement money balanced separately.", "rebuilder": "Review any accounts you received; one holding may dominate.", "ent": "Your business is a large position; balance it with diversified investments.", "exec": "Plan regular sales of company stock to reduce concentration.", "late": "Rebalance toward steadiness as retirement nears.", "retiree": "Rebalancing can provide the cash for your withdrawals.", "legacy": "Diversification preserves wealth across generations."}, "example": "Olivia's target is 70% stocks and 30% bonds. After a strong year, her mix is 80% stocks and 20% bonds. On her rebalancing day, she sells some stock funds inside her IRA, where there is no tax, and buys bond funds to return to 70/30. When stocks fall the next year, she loses less than she would have. (Hypothetical example.)", "terms": [["Position sizing", "Deciding how much of your portfolio one investment may hold."], ["Concentration risk", "The risk of having too much in one investment."], ["Rebalancing", "Returning your portfolio to its target mix."], ["Drift", "When your mix moves away from its target."], ["Target allocation", "Your planned mix of investments."], ["Tax-advantaged account", "An account, such as an IRA, with special tax benefits."]], "verse": ["A wise man is strong; yea, a man of knowledge increaseth strength.", "Proverbs 24:5"], "check": ["List your five largest holdings as a percentage of your wealth", "Compare your current mix with your target", "Choose your rebalancing day or drift limit", "Plan which accounts to rebalance first"], "quiz": [{"q": "Position sizing means:", "o": ["Deciding how much one investment may hold", "Buying as much as possible", "Ignoring risk"], "a": 0, "why": "It limits any single loss."}, {"q": "Many investors keep any one stock under:", "o": ["5% to 10% of their portfolio", "50%", "100%"], "a": 0, "why": "So a loss cannot derail their goals."}, {"q": "Rebalancing means:", "o": ["Returning your portfolio to its target mix", "Selling everything", "Buying only winners"], "a": 0, "why": "It corrects drift."}, {"q": "A common drift trigger is about:", "o": ["5 percentage points from target", "50 points", "Any 1% move"], "a": 0, "why": "It keeps rebalancing reasonable."}, {"q": "It is usually best to rebalance first:", "o": ["Inside tax-advantaged accounts", "In taxable accounts", "Never"], "a": 0, "why": "Selling there does not trigger taxes."}, {"q": "Rebalancing asks you to:", "o": ["Sell some of what has grown and buy what has lagged", "Buy more of what has grown", "Stop investing"], "a": 0, "why": "That is buying low and selling high."}, {"q": "Employer stock in your portfolio:", "o": ["Counts toward your concentration", "Does not count", "Is always safe"], "a": 0, "why": "Your income and investments may depend on one company."}, {"q": "Which can be a larger part of your portfolio?", "o": ["A broad index fund", "A single new stock", "A friend's startup"], "a": 0, "why": "It already holds many companies."}, {"q": "New contributions can be used to:", "o": ["Buy what is underweight", "Increase concentration", "Avoid investing"], "a": 0, "why": "It rebalances without selling."}, {"q": "Proverbs 24:5 says a man of knowledge:", "o": ["Increaseth strength", "Loses strength", "Needs no plan"], "a": 0, "why": "Knowledge strengthens the wise."}]}, "steward-1": {"deep": true, "mins": 14, "intro": "Building wealth is only half of stewardship. Protecting it, for yourself and for those you love, is the other half. Insurance shields your family from life's storms, and a few essential legal documents make sure your wishes are honored and your loved ones are cared for.", "connect": "Protecting what you have built ensures your why outlives every storm.", "sections": [["Insurance that protects your family", ["Term life insurance replaces your income for a set number of years if you die, at a relatively low cost. Disability insurance replaces part of your income if illness or injury keeps you from working. Many experts consider disability coverage just as important as life insurance during your working years.", "Health, home or renter's, and auto insurance protect against large costs. An umbrella liability policy adds extra protection above your home and auto coverage."]], ["A will", ["A will names who receives your property and, for parents of minor children, who will care for them. Without one, state law decides, which may not match your wishes."]], ["Powers of attorney and health care directives", ["A durable financial power of attorney names someone you trust to manage your finances if you cannot. A medical power of attorney and an advance directive name who can make health care decisions for you and explain your wishes. These protect you during life, not only after it."]], ["Trusts and beneficiaries", ["A revocable living trust can hold your assets, help your family avoid probate in many states, and keep details private. Beneficiary designations on retirement accounts, life insurance, and many bank accounts pass directly to the people you name, often overriding your will, so keep them current.", "You will explore trusts in depth in the Kingdom Builder tier."]], ["Put it in writing", ["\"Set thine house in order\" (Isaiah 38:1). Keep a simple letter listing your accounts, policies, documents, and trusted advisers, stored safely where a loved one can find it. Review everything after marriage, divorce, a birth, a death, or a move."]]], "pros": ["Protects your family from financial hardship", "Ensures your wishes are honored", "Can save time, cost, and conflict for loved ones", "Brings peace of mind"], "cons": ["Insurance and legal documents have costs", "Documents must be kept current", "Laws vary by state", "These conversations can feel difficult"], "watch": ["Laws differ by state; work with a licensed estate planning attorney in your state.", "Check every beneficiary designation; they can override your will.", "Compare insurance quotes and check agents' licenses with your state's department of insurance.", "Be cautious of anyone selling complex insurance as an investment without clear explanation."], "tip": "Pull up the beneficiary designations on every retirement account and life insurance policy today. Many women discover an ex-spouse or a parent who has since passed is still listed.", "fit": {"starter": "Disability insurance and a basic will protect your earning power.", "mom": "Name a guardian for your children in your will.", "rebuilder": "Update every beneficiary and document after divorce or loss.", "ent": "Consider business succession and key-person coverage.", "exec": "Review the life and disability coverage your employer provides, and what you would lose if you left.", "late": "Make sure your documents reflect your current family and wishes.", "retiree": "Review long-term care options and your health care directive.", "legacy": "Coordinate trusts, beneficiaries, and your giving plans."}, "example": "After her divorce, Lauren reviews her documents. Her ex-husband is still the beneficiary on her 401(k) and life insurance. She updates both, buys a 20-year term life policy to protect her children, signs a will naming a guardian, and completes powers of attorney with a licensed attorney. She writes a simple letter listing every account and stores it with a trusted friend. (Hypothetical example.)", "terms": [["Term life insurance", "Coverage for a set number of years."], ["Disability insurance", "Replaces part of your income if you cannot work."], ["Will", "A legal document directing your property and naming guardians."], ["Power of attorney", "A document naming someone to act for you."], ["Revocable living trust", "A trust you control during life that can avoid probate."], ["Beneficiary designation", "Names who receives an account directly."]], "verse": ["Set thine house in order.", "Isaiah 38:1"], "check": ["Review every beneficiary designation", "Check whether you have disability coverage", "List the legal documents you have and need", "Write a letter of instructions for your loved ones"], "quiz": [{"q": "Term life insurance:", "o": ["Covers a set number of years at a relatively low cost", "Lasts forever and is always cheapest", "Is an investment"], "a": 0, "why": "It replaces income during key years."}, {"q": "Disability insurance:", "o": ["Replaces part of your income if you cannot work", "Covers car repairs", "Is only for retirees"], "a": 0, "why": "Your earning power is a major asset."}, {"q": "Without a will:", "o": ["State law decides who receives your property", "Your wishes are automatically followed", "Nothing happens"], "a": 0, "why": "A will makes your wishes clear."}, {"q": "A durable financial power of attorney:", "o": ["Names someone to manage your finances if you cannot", "Ends at retirement", "Is a type of insurance"], "a": 0, "why": "It protects you during life."}, {"q": "Beneficiary designations:", "o": ["Can override your will", "Never matter", "Expire yearly"], "a": 0, "why": "Keep them current."}, {"q": "A revocable living trust can help:", "o": ["Avoid probate in many states", "Avoid all taxes", "Guarantee returns"], "a": 0, "why": "It can also keep details private."}, {"q": "Parents of minor children should name:", "o": ["A guardian in their will", "No one", "Their employer"], "a": 0, "why": "Otherwise a court decides."}, {"q": "Estate laws:", "o": ["Vary by state", "Are identical everywhere", "Do not exist"], "a": 0, "why": "Work with an attorney in your state."}, {"q": "When should you review your documents?", "o": ["After major life events", "Never", "Only once"], "a": 0, "why": "Marriage, divorce, births, deaths, and moves change things."}, {"q": "Isaiah 38:1 counsels:", "o": ["Set thine house in order", "Ignore the future", "Spend everything"], "a": 0, "why": "Preparation is loving stewardship."}]}, "steward-2": {"deep": true, "mins": 12, "intro": "As your wealth grows, wise counsel becomes more valuable. Financial advisers, tax professionals, and estate attorneys can help you see what you might miss. The key is knowing who does what, how they are paid, and how to choose people you can trust.", "connect": "Wise counsel helps you protect and multiply what God has entrusted to you.", "sections": [["Who does what", ["A financial adviser helps with investing and overall planning. A Certified Financial Planner (CFP) professional has met education, exam, experience, and ethics requirements. A CPA is a licensed accountant who can prepare taxes and plan for them. An estate planning attorney prepares wills, trusts, and related documents. A licensed insurance agent helps with coverage."]], ["Fiduciary or not", ["A fiduciary must act in your best interest. Registered investment advisers owe a fiduciary duty when giving investment advice. Brokers must follow a best-interest standard when recommending investments, but the details differ. Ask every professional, in writing, whether they act as a fiduciary at all times."]], ["How they are paid", ["Advisers may charge a flat fee, an hourly rate, a percentage of assets managed (often around 1% per year), or commissions on products sold. Fee-only advisers are paid only by you. Understanding pay helps you spot conflicts of interest."]], ["Checking credentials", ["Look up brokers on FINRA BrokerCheck and advisers on the SEC's Investment Adviser Public Disclosure site. Verify CFP status at cfp.net. Verify CPAs with your state board of accountancy, attorneys with your state bar, and insurance agents with your state department of insurance."]], ["Building your circle of counsel", ["\"Without counsel purposes are disappointed: but in the multitude of counsellors they are established\" (Proverbs 15:22). Choose people who explain clearly, listen to your values, respect your faith, and never pressure you. You remain the steward; they are your counsel."]]], "pros": ["Expertise for complex decisions", "Can save taxes and costly mistakes", "Brings accountability and perspective", "Frees your time and energy"], "cons": ["Advice has real costs", "Conflicts of interest exist", "Quality varies widely", "You must still stay informed"], "watch": ["Never give an adviser control of your money without understanding exactly what they will do.", "Ask how they are paid and get it in writing.", "Check every credential and disciplinary record.", "Be wary of anyone who discourages questions or rushes you."], "tip": "Before your first meeting, write your three most important money goals and your values. A good adviser will ask about them. If an adviser talks only about products, keep looking.", "fit": {"starter": "A one-time, hourly planning session may be all you need now.", "mom": "An estate attorney can help with guardianship and documents.", "rebuilder": "A fee-only adviser can help you understand settlements and new accounts.", "ent": "A CPA who knows small business can save you more than they cost.", "exec": "Look for experience with stock compensation and executive benefits.", "late": "A planner can help you build a catch-up plan.", "retiree": "Coordinate withdrawals, taxes, and benefits with a team.", "legacy": "Your adviser, CPA, and attorney should work together."}, "example": "Vanessa interviews three advisers. The first earns commissions and pushes a complex annuity. The second charges 1% of assets and confirms in writing she is a fiduciary. The third is fee-only and charges a flat yearly fee. Vanessa checks all three on the SEC's adviser search, then chooses the advisor who listened most to her goals and her faith. (Hypothetical example.)", "terms": [["Fiduciary", "A professional required to act in your best interest."], ["CFP", "Certified Financial Planner, a planning credential with ethics requirements."], ["CPA", "Certified Public Accountant, a licensed accountant."], ["Fee-only", "An adviser paid only by clients, not commissions."], ["Assets under management", "The money an adviser manages for you."], ["Conflict of interest", "When an adviser's pay could influence their advice."]], "verse": ["Without counsel purposes are disappointed: but in the multitude of counsellors they are established.", "Proverbs 15:22"], "check": ["Write your three most important money goals", "Prepare questions about fees and fiduciary duty", "Look up one adviser on the SEC's adviser search", "List the professionals you need now"], "quiz": [{"q": "A fiduciary must:", "o": ["Act in your best interest", "Sell products", "Guarantee returns"], "a": 0, "why": "Ask for it in writing."}, {"q": "A CPA is:", "o": ["A licensed accountant", "A stockbroker", "An insurance policy"], "a": 0, "why": "CPAs prepare and plan taxes."}, {"q": "A fee-only adviser is paid:", "o": ["Only by clients", "By commissions", "By the government"], "a": 0, "why": "It reduces conflicts of interest."}, {"q": "Where can you verify an adviser?", "o": ["The SEC's Investment Adviser Public Disclosure site", "Their brochure only", "A social media page"], "a": 0, "why": "It is free and independent."}, {"q": "CFP status can be verified at:", "o": ["cfp.net", "Any search engine ad", "Nowhere"], "a": 0, "why": "The CFP Board maintains the record."}, {"q": "An estate planning attorney prepares:", "o": ["Wills and trusts", "Tax returns only", "Insurance quotes"], "a": 0, "why": "Estate law varies by state."}, {"q": "A common percentage-of-assets fee is around:", "o": ["1% per year", "25% per year", "0% always"], "a": 0, "why": "Compare it with other fee models."}, {"q": "A warning sign in an adviser is:", "o": ["Pressuring you or discouraging questions", "Explaining clearly", "Asking about your goals"], "a": 0, "why": "Good counsel welcomes questions."}, {"q": "Who remains the steward of your money?", "o": ["You", "Your adviser", "The bank"], "a": 0, "why": "Advisers counsel; you decide."}, {"q": "Proverbs 15:22 teaches that plans are established through:", "o": ["A multitude of counsellors", "Acting alone", "Haste"], "a": 0, "why": "Wise counsel strengthens plans."}]}, "steward-3": {"deep": true, "mins": 12, "intro": "Faith-based investing means aligning where your money is invested with what you believe. Many Christian women want their investments to honor God, avoiding companies whose products conflict with their values and supporting those that serve people well. There are several thoughtful ways to do this.", "connect": "When your investments reflect your values, your wealth and your witness work together.", "sections": [["Why it matters", ["Owning a share means owning part of a company. Many believers want that ownership to reflect their faith. \"Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God\" (1 Corinthians 10:31)."]], ["Screening out", ["Negative screening excludes companies involved in areas you object to. Biblically responsible investing (BRI) funds commonly screen out companies tied to abortion, pornography, gambling, alcohol, tobacco, and certain other activities, though each fund defines its screens differently."]], ["Screening in", ["Positive screening favors companies that treat employees well, serve communities, and operate with integrity. Some investors also use ESG (environmental, social, and governance) funds, which use different criteria that may or may not match biblical values; read each fund's approach carefully."]], ["Community and impact investing", ["Community development financial institutions (CDFIs) and some credit unions and banks invest in under-resourced communities. Certificates of deposit and notes from CDFIs can let your savings support small businesses, affordable housing, and families, often including women of color."]], ["Weighing values and wisdom", ["Values-based funds may have higher fees, less diversification, or different returns than broad index funds. Compare them carefully. Your giving, your spending, and your business choices are also powerful expressions of your values."]]], "pros": ["Aligns your investments with your faith", "Can support communities you care about", "Brings peace of conscience", "Offers a testimony through your stewardship"], "cons": ["Some values-based funds charge higher fees", "Screens differ between funds", "Less diversification in some funds", "Returns may differ from the broad market"], "watch": ["Read exactly what each fund screens out and in.", "Compare expense ratios with broad index funds.", "Labels like \"faith-based\" or \"ESG\" are not standardized.", "Make sure your overall portfolio stays diversified."], "tip": "Use a fund's holdings list to check your values. Most fund websites publish their top holdings. Five minutes of reading can tell you more than any label.", "fit": {"starter": "Start with one values-aligned fund and learn as you grow.", "mom": "Teach your children how investing can reflect faith.", "rebuilder": "Choose investments that bring you peace as you rebuild.", "ent": "Your business practices are your most visible values statement.", "exec": "Check whether your workplace plan offers values-aligned options.", "late": "Balance values with low costs as you catch up.", "retiree": "Values-aligned income funds and CDFI deposits can support your mission.", "legacy": "Pass on your values along with your wealth."}, "example": "Danielle compares a biblically responsible index fund with a broad S&P 500 index fund. The BRI fund screens out several industries she objects to and charges 0.20% a year; the broad fund charges 0.03%. She decides the alignment is worth the difference for most of her stock investments, and places her emergency savings in a CD at a CDFI that lends to small businesses in her city. (Hypothetical example.)", "terms": [["Biblically responsible investing", "Investing screened by biblical values."], ["Negative screening", "Excluding certain companies or industries."], ["Positive screening", "Favoring companies with certain practices."], ["ESG", "Environmental, social, and governance criteria."], ["CDFI", "Community development financial institution."], ["Impact investing", "Investing to create measurable social good alongside returns."]], "verse": ["Whether therefore ye eat, or drink, or whatsoever ye do, do all to the glory of God.", "1 Corinthians 10:31"], "check": ["List the values you want your investments to reflect", "Review the top holdings of one fund you own", "Compare one values-based fund with a broad index fund", "Look up a CDFI in your area"], "quiz": [{"q": "Negative screening means:", "o": ["Excluding certain companies", "Favoring certain companies", "Buying everything"], "a": 0, "why": "It removes companies you object to."}, {"q": "Positive screening means:", "o": ["Favoring companies with certain practices", "Excluding everything", "Ignoring values"], "a": 0, "why": "It seeks out companies that align."}, {"q": "ESG criteria:", "o": ["May or may not match biblical values", "Always match biblical values", "Are the same as BRI"], "a": 0, "why": "Read each fund's approach."}, {"q": "A CDFI:", "o": ["Invests in under-resourced communities", "Is a stock exchange", "Is a type of insurance"], "a": 0, "why": "Your savings can support your community."}, {"q": "Values-based funds may:", "o": ["Have higher fees than broad index funds", "Always be cheapest", "Have no holdings"], "a": 0, "why": "Compare costs carefully."}, {"q": "Labels like \"faith-based\" are:", "o": ["Not standardized", "Regulated identically", "Guarantees"], "a": 0, "why": "Read the screens."}, {"q": "To check a fund's alignment, read:", "o": ["Its holdings list", "Only its name", "Social media"], "a": 0, "why": "Holdings show what you own."}, {"q": "Owning a share means:", "o": ["Owning part of a company", "Lending money", "Nothing"], "a": 0, "why": "That is why alignment matters to many believers."}, {"q": "Your values can also be expressed through:", "o": ["Your giving, spending, and business choices", "Investing only", "Nothing else"], "a": 0, "why": "Stewardship is whole-life."}, {"q": "1 Corinthians 10:31 calls us to:", "o": ["Do all to the glory of God", "Separate faith from money", "Avoid investing"], "a": 0, "why": "Everything can honor Him."}]}, "steward-4": {"deep": true, "mins": 13, "intro": "Real estate has built wealth for generations of families. You can own property directly, as a home or rental, or invest in real estate through REITs, which let you own a share of many properties without being a landlord. Each path has its own rewards and responsibilities.", "connect": "Property can provide shelter, income, and legacy for your why.", "sections": [["Owning residential property", ["A rental property can provide monthly income and grow in value over time. It also brings responsibilities: tenants, repairs, insurance, property taxes, vacancies, and local landlord laws. Many investors aim for rent that covers all costs with room to spare."]], ["Commercial property", ["Office, retail, industrial, and multifamily buildings can offer larger income and longer leases, but they usually require more capital, expertise, and risk tolerance. Many investors reach commercial property through partnerships or REITs."]], ["REITs", ["A real estate investment trust (REIT) owns or finances income-producing property. REITs must generally distribute at least 90% of their taxable income to shareholders, so they often pay higher dividends. Publicly traded REITs can be bought like stocks, and REIT index funds hold many at once."]], ["Leverage cuts both ways", ["Most property is bought with a mortgage. Leverage magnifies gains when values rise and magnifies losses when they fall. Never borrow more than you can repay if rents fall or a property sits empty."]], ["A field and a vineyard", ["\"She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard\" (Proverbs 31:16). The virtuous woman considered before she bought. Study the neighborhood, the numbers, and the laws before you invest."]]], "pros": ["Potential for monthly income", "Property can grow in value over time", "REITs offer property exposure without being a landlord", "Real estate can diversify a stock portfolio"], "cons": ["Direct ownership takes time and money to manage", "Property is harder to sell quickly than stocks", "Leverage increases risk", "REIT dividends are often taxed as ordinary income"], "watch": ["Keep reserves for repairs and vacancies.", "Learn your state and city landlord laws.", "Be cautious of high-pressure real estate seminars and \"get rich\" courses.", "Non-traded REITs can be hard to sell and may carry high fees."], "tip": "Before buying a rental, ask for the actual utility bills, tax bills, and insurance quotes, not estimates. Real numbers reveal whether the rent truly covers the costs.", "fit": {"starter": "A REIT index fund can be a simple first step into real estate.", "mom": "Think carefully about time; direct rentals require attention.", "rebuilder": "Rebuild your foundation before taking on property debt.", "ent": "Owning your business property can be a long-term asset.", "exec": "Consider REITs or partnerships if time is limited.", "late": "Weigh the work of being a landlord against your timeline.", "retiree": "REITs can provide income; direct property can be demanding.", "legacy": "Property can pass to heirs; plan how it will be managed."}, "example": "Jasmine buys a duplex for $300,000 with a mortgage. Rent from both units totals $3,200 a month. Her mortgage, taxes, insurance, and a repair reserve total $2,700, leaving $500 a month. She also holds a REIT index fund in her IRA to own a slice of office, retail, and apartment properties nationwide. (Hypothetical example.)", "terms": [["REIT", "Real estate investment trust, a company that owns or finances property."], ["Leverage", "Using borrowed money to invest."], ["Cash flow", "Rent left after all property costs."], ["Vacancy", "When a unit is empty and earning no rent."], ["Non-traded REIT", "A REIT not listed on an exchange, often harder to sell."], ["Commercial property", "Office, retail, industrial, or large multifamily buildings."]], "verse": ["She considereth a field, and buyeth it: with the fruit of her hands she planteth a vineyard.", "Proverbs 31:16"], "check": ["Decide whether direct property or REITs fit your season", "Look up a REIT index fund's expense ratio", "Research your local landlord laws", "Estimate real costs for one property you are considering"], "quiz": [{"q": "A REIT:", "o": ["Owns or finances income-producing property", "Is a type of bond only", "Is a bank account"], "a": 0, "why": "It lets you invest in property without being a landlord."}, {"q": "REITs must generally distribute at least:", "o": ["90% of taxable income", "10%", "Nothing"], "a": 0, "why": "That is why dividends are often high."}, {"q": "Leverage:", "o": ["Magnifies both gains and losses", "Only increases gains", "Removes risk"], "a": 0, "why": "Borrowing increases risk."}, {"q": "Direct rental ownership requires:", "o": ["Managing tenants, repairs, and laws", "No time at all", "No insurance"], "a": 0, "why": "It is a business."}, {"q": "Non-traded REITs can be:", "o": ["Hard to sell and costly", "Always easy to sell", "Guaranteed"], "a": 0, "why": "Read the terms carefully."}, {"q": "REIT dividends are often taxed:", "o": ["As ordinary income", "At 0% always", "Never"], "a": 0, "why": "Holding REITs in an IRA can help."}, {"q": "Before buying a rental, you should review:", "o": ["Actual bills and costs", "Only the asking price", "Nothing"], "a": 0, "why": "Real numbers reveal the truth."}, {"q": "Real estate can:", "o": ["Diversify a stock portfolio", "Eliminate all risk", "Never lose value"], "a": 0, "why": "It behaves differently from stocks."}, {"q": "A warning sign is:", "o": ["A high-pressure \"get rich\" seminar", "A licensed agent", "A written inspection"], "a": 0, "why": "Pressure is a red flag."}, {"q": "Proverbs 31:16 shows the virtuous woman:", "o": ["Considered a field before buying it", "Bought in haste", "Avoided property"], "a": 0, "why": "Consider first, then buy."}]}, "steward-5": {"deep": true, "mins": 14, "intro": "Valuation asks a simple question with a complex answer: what is this company truly worth, and is its price reasonable? Learning a few valuation tools helps you avoid overpaying in seasons of excitement and recognize opportunity in seasons of fear.", "connect": "Paying a wise price protects your wealth and your why.", "sections": [["Price is what you pay; value is what you get", ["A wonderful company can be a poor investment if you pay too much for it. Valuation tools compare a company's price with what it earns, sells, and produces in cash."]], ["Price-to-earnings and price-to-sales", ["The P/E ratio compares price with earnings. The price-to-sales (P/S) ratio compares a company's market value with its revenue, which is useful for fast-growing companies that are not yet profitable. Compare ratios with similar companies and with the company's own history."]], ["Free cash flow and its yield", ["Free cash flow is cash from operations minus capital spending. Free cash flow yield divides free cash flow by market value. A higher yield can suggest a more reasonable price, all else equal."]], ["Intrinsic value", ["Intrinsic value is an estimate of what a company is worth based on the cash it will produce in the future, brought back to today's dollars. Analysts use discounted cash flow models, but small changes in assumptions can produce very different answers. Treat any estimate as a range, not a certainty."]], ["Margin of safety", ["A margin of safety means buying only when the price is meaningfully below your estimate of value, leaving room for error. \"For which of you, intending to build a tower, sitteth not down first, and counteth the cost?\" (Luke 14:28)."]]], "pros": ["Helps you avoid overpaying", "Brings discipline to excitement", "Lets you compare companies fairly", "Builds deep investing wisdom"], "cons": ["Valuation involves assumptions and uncertainty", "Cheap stocks can stay cheap or fall further", "Fast-growing companies are hard to value", "It takes time to learn"], "watch": ["Never rely on a single ratio.", "Compare companies within the same industry.", "Treat intrinsic value as a range.", "Be wary of stories that justify any price."], "tip": "When everyone says \"this time is different\" to justify a price, pause. That phrase has preceded many painful market declines.", "fit": {"starter": "Learn the concepts; broad funds remain your foundation.", "mom": "Teach children that value and price are different.", "rebuilder": "Focus on diversified funds while you learn these tools.", "ent": "Apply these ideas to valuing your own business.", "exec": "Understand how the market values your employer.", "late": "Keep individual stock purchases modest and well researched.", "retiree": "Favor steady, reasonably priced holdings for income.", "legacy": "Teach the next generation patience in valuation."}, "example": "Two companies each have $1 billion in revenue. Company A is valued at $5 billion (P/S of 5) and produces $200 million of free cash flow, a 4% free cash flow yield. Company B is valued at $30 billion (P/S of 30) and produces no free cash flow yet. Company B may grow faster, but its price assumes a great deal of future success. (Hypothetical example.)", "terms": [["Valuation", "Estimating what a company is worth."], ["P/S ratio", "Market value divided by revenue."], ["Free cash flow yield", "Free cash flow divided by market value."], ["Intrinsic value", "An estimate of worth based on future cash."], ["Discounted cash flow", "A model valuing future cash in today's dollars."], ["Margin of safety", "Buying meaningfully below estimated value."]], "verse": ["For which of you, intending to build a tower, sitteth not down first, and counteth the cost, whether he have sufficient to finish it?", "Luke 14:28"], "check": ["Find the P/E and P/S of one company", "Calculate its free cash flow yield", "Compare it with a similar company", "Write the price at which you would consider buying"], "quiz": [{"q": "Valuation asks:", "o": ["What a company is worth and whether its price is reasonable", "How fast the price changes", "Who owns the company"], "a": 0, "why": "Price and value differ."}, {"q": "The P/S ratio compares:", "o": ["Market value with revenue", "Price with dividends", "Debt with cash"], "a": 0, "why": "Useful when earnings are small."}, {"q": "Free cash flow yield equals:", "o": ["Free cash flow divided by market value", "Revenue divided by price", "Dividends divided by debt"], "a": 0, "why": "Higher can suggest a more reasonable price."}, {"q": "Intrinsic value should be treated as:", "o": ["A range, not a certainty", "An exact number", "Irrelevant"], "a": 0, "why": "Assumptions change the answer."}, {"q": "A margin of safety means:", "o": ["Buying meaningfully below estimated value", "Buying at any price", "Never selling"], "a": 0, "why": "It leaves room for error."}, {"q": "A wonderful company can be a poor investment if:", "o": ["You pay too much for it", "It is profitable", "It is large"], "a": 0, "why": "Price matters."}, {"q": "Ratios are best compared:", "o": ["Within the same industry", "Across unrelated industries", "Never"], "a": 0, "why": "Industries differ."}, {"q": "\"This time is different\" is often:", "o": ["A warning sign", "A guarantee", "A ratio"], "a": 0, "why": "It has preceded many declines."}, {"q": "Discounted cash flow models:", "o": ["Value future cash in today's dollars", "Predict prices exactly", "Ignore cash"], "a": 0, "why": "They are sensitive to assumptions."}, {"q": "Luke 14:28 teaches us to:", "o": ["Count the cost before building", "Build in haste", "Ignore costs"], "a": 0, "why": "Wise investors count the cost."}]}, "steward-6": {"deep": true, "mins": 12, "intro": "Phil Town's Rule #1 investing approach teaches four simple questions, the four Ms, to evaluate a company before you invest: Meaning, Moat, Management, and Margin of safety. Together, they help you invest in businesses you understand, that can defend their profits, led by people you trust, at a sensible price.", "connect": "The four Ms keep your investing aligned with wisdom and your why.", "sections": [["Meaning", ["Do you understand the business, and does it align with your values? Invest in what you understand: how the company makes money, who its customers are, and why they choose it. If you cannot explain it simply, keep studying."]], ["Moat", ["A moat is a lasting advantage that protects a company's profits from competitors, like a moat protects a castle. Moats include strong brands, network effects (a service becomes more valuable as more people use it), high switching costs, cost advantages, patents, and licenses.", "Signs of a moat include consistently high returns on capital and steady growth over many years."]], ["Management", ["Are the leaders honest, capable, and focused on long-term value? Read their letters to shareholders, look at how they are paid, check whether they own meaningful shares, and see whether they admit mistakes."]], ["Margin of safety", ["Buy only when the price is meaningfully below your estimate of the company's value, to protect yourself if you are wrong. You learned this in the valuation lesson; here it completes the four Ms."]], ["Character counts", ["\"A good name is rather to be chosen than great riches\" (Proverbs 22:1). The integrity of a company's leaders is part of its value. Wise women invest in character as well as numbers."]]], "pros": ["A simple, memorable framework", "Focuses on durable businesses", "Encourages patience and discipline", "Includes values through Meaning"], "cons": ["Identifying moats takes judgment", "Great companies are often priced highly", "Moats can erode as technology changes", "Requires research time"], "watch": ["Moats can shrink; review them yearly.", "Do not confuse a popular product with a lasting moat.", "Read what leaders say and compare it with what they do.", "Keep individual stocks a modest part of your portfolio."], "tip": "Read the last three years of a company's shareholder letters back to back. Notice whether the leaders kept their promises. Consistency over time reveals management better than any single interview.", "fit": {"starter": "Practice the four Ms on companies you use every day.", "mom": "Teach your children to ask: do I understand this business?", "rebuilder": "Use the four Ms to evaluate any investment you are offered.", "ent": "Ask what moat your own business is building.", "exec": "Apply the four Ms to your employer honestly.", "late": "Use the four Ms to keep individual picks high quality.", "retiree": "Favor companies with wide moats and steady management.", "legacy": "The four Ms are a lasting framework to pass on."}, "example": "Brenda applies the four Ms to a payment company. Meaning: she uses it and understands its fees. Moat: millions of merchants and users create a network effect. Management: the founders own large stakes and their letters match their actions. Margin of safety: the stock trades near her estimate of value, not below it, so she adds it to her watch list instead of buying today. (Hypothetical example.)", "terms": [["Meaning", "Understanding a business and its alignment with your values."], ["Moat", "A lasting competitive advantage."], ["Network effect", "When a product becomes more valuable as more people use it."], ["Switching costs", "The difficulty for customers to change providers."], ["Management", "The leaders running the company."], ["Margin of safety", "Buying meaningfully below estimated value."]], "verse": ["A good name is rather to be chosen than great riches, and loving favour rather than silver and gold.", "Proverbs 22:1"], "check": ["Choose one company and apply each of the four Ms", "Identify its moat in one sentence", "Read its latest shareholder letter", "Start a watch list with target prices"], "quiz": [{"q": "The four Ms are:", "o": ["Meaning, Moat, Management, Margin of safety", "Money, Market, Momentum, Media", "Mindset, Mortgage, Match, Maturity"], "a": 0, "why": "Phil Town's Rule #1 framework."}, {"q": "Meaning asks whether you:", "o": ["Understand the business and it aligns with your values", "Like the stock price", "Know the CEO personally"], "a": 0, "why": "Invest in what you understand."}, {"q": "A moat is:", "o": ["A lasting competitive advantage", "A type of bond", "A dividend"], "a": 0, "why": "It protects profits."}, {"q": "A network effect means:", "o": ["A product becomes more valuable as more people use it", "Many employees", "High debt"], "a": 0, "why": "It is one kind of moat."}, {"q": "High switching costs mean:", "o": ["Customers find it hard to change providers", "Prices are low", "No competition"], "a": 0, "why": "That can protect profits."}, {"q": "To judge management, you can:", "o": ["Compare leaders' words with their actions", "Read only advertisements", "Ignore pay"], "a": 0, "why": "Consistency reveals character."}, {"q": "Margin of safety means buying:", "o": ["Meaningfully below estimated value", "At any price", "After the price doubles"], "a": 0, "why": "It protects you if you are wrong."}, {"q": "Moats can:", "o": ["Erode as technology changes", "Never change", "Guarantee returns"], "a": 0, "why": "Review them yearly."}, {"q": "A popular product alone is:", "o": ["Not necessarily a lasting moat", "Always a moat", "A margin of safety"], "a": 0, "why": "Popularity can fade."}, {"q": "Proverbs 22:1 says a good name is:", "o": ["Rather to be chosen than great riches", "Unimportant", "For sale"], "a": 0, "why": "Integrity matters in leaders."}]}, "steward-7": {"deep": true, "mins": 14, "intro": "At the Steward level, you go beyond skimming a 10-K or S-1 to reading it like an owner. You will learn where the most revealing information hides: in the risk factors, management's discussion, the share structure, and the notes to the financial statements.", "connect": "Reading like an owner protects your wealth and sharpens your discernment.", "sections": [["Risk factors, read carefully", ["Companies must disclose their material risks. Many are standard, but look for risks specific to this company: dependence on a few customers or suppliers, heavy spending commitments, legal disputes, or regulatory threats. Compare the risk factors from year to year; new ones deserve attention."]], ["Management's discussion and analysis", ["In this section, often called MD&A, leaders explain results, trends, and uncertainties in their own words. Look for clear explanations of why revenue and margins changed, and for honest discussion of challenges."]], ["Share structure and control", ["Some companies issue multiple classes of shares with different voting rights. Founders or a trust may control most votes while public investors own most of the economic value. Read the description of capital stock and any \"controlled company\" disclosures to understand who decides."]], ["Notes to the financial statements", ["The notes explain accounting choices, debt terms, leases, stock-based compensation, and commitments. Large, long-term commitments, such as multiyear spending contracts, can matter as much as debt."]], ["Dilution and stock-based compensation", ["When companies issue new shares, each existing share owns a smaller piece. Stock-based compensation, convertible notes, and option grants can all dilute owners. Track the share count over several years.", "\"Every prudent man dealeth with knowledge\" (Proverbs 13:16)."]]], "pros": ["Reveals what headlines miss", "Helps you understand who really controls a company", "Uncovers hidden obligations", "Builds owner-level discernment"], "cons": ["Filings are long and technical", "It takes significant time", "Some disclosures are legally worded", "Insights still require judgment"], "watch": ["Compare filings year to year.", "Read the notes, not just the statements.", "Understand voting control before you buy.", "Track the share count for dilution."], "tip": "In an S-1, search for \"use of proceeds\" and \"dilution.\" These two sections tell you where the new money is going and how much your share of the company shrinks compared with earlier investors.", "fit": {"starter": "Return to this lesson once the Sower filings lesson feels comfortable.", "mom": "Practice on companies your family knows well.", "rebuilder": "Use this skill to verify anything you are told about an investment.", "ent": "Learn how disclosures describe risks you may face too.", "exec": "Read your employer's risk factors and share structure.", "late": "Use these skills for any individual stocks you hold.", "retiree": "Watch commitments and debt behind income investments.", "legacy": "Teach the next generation to read like owners."}, "example": "Reading an S-1, Courtney finds that public Class A shares carry limited votes, a single special share held by the founders controls a majority of the vote on most matters, and the company has hundreds of billions of dollars in long-term spending commitments disclosed in the notes. She notes these facts in her research before deciding anything. (Hypothetical example based on common disclosures.)", "terms": [["Risk factors", "Required disclosures of material risks."], ["MD&A", "Management's discussion and analysis of results."], ["Share classes", "Different types of shares with different rights."], ["Controlled company", "A company where one holder or group controls most votes."], ["Dilution", "When new shares reduce each owner's percentage."], ["Stock-based compensation", "Paying employees with shares or options."]], "verse": ["Every prudent man dealeth with knowledge: but a fool layeth open his folly.", "Proverbs 13:16"], "check": ["Compare one company's risk factors across two years", "Read its MD&A summary", "Find its share classes and voting rights", "Track its share count over three years"], "quiz": [{"q": "Risk factors disclose:", "o": ["Material risks to the company", "Only good news", "Stock price forecasts"], "a": 0, "why": "Look for company-specific risks."}, {"q": "MD&A is:", "o": ["Management's discussion and analysis", "A tax form", "A trading strategy"], "a": 0, "why": "Leaders explain results in their words."}, {"q": "Multiple share classes can mean:", "o": ["Some holders have more voting power", "Everyone votes equally", "No one votes"], "a": 0, "why": "Read the capital stock description."}, {"q": "A controlled company is one where:", "o": ["One holder or group controls most votes", "The government controls it", "No one controls it"], "a": 0, "why": "Public holders may have limited influence."}, {"q": "Dilution means:", "o": ["New shares reduce each owner's percentage", "Prices always rise", "Dividends double"], "a": 0, "why": "Track the share count."}, {"q": "Long-term spending commitments are found in:", "o": ["The notes to the financial statements", "Advertisements", "Nowhere"], "a": 0, "why": "They can matter as much as debt."}, {"q": "New risk factors from year to year:", "o": ["Deserve attention", "Should be ignored", "Are always standard"], "a": 0, "why": "They signal new concerns."}, {"q": "In an S-1, \"use of proceeds\" explains:", "o": ["Where the new money will go", "Executive pay", "Past dividends"], "a": 0, "why": "It reveals priorities."}, {"q": "Stock-based compensation can:", "o": ["Dilute existing owners", "Never affect owners", "Lower taxes for you"], "a": 0, "why": "It adds shares over time."}, {"q": "Proverbs 13:16 says every prudent man:", "o": ["Dealeth with knowledge", "Acts on rumors", "Avoids reading"], "a": 0, "why": "Knowledge guides the prudent."}]}, "steward-8": {"deep": true, "mins": 14, "intro": "Competitive analysis compares companies in the same industry to understand who is winning, why, and at what cost. Using the leading artificial intelligence companies as a living example, this lesson teaches a framework you can apply to any industry.", "connect": "Seeing the whole field helps you invest with discernment, not hype.", "sections": [["Define the field", ["Start by naming the companies that compete for the same customers. In frontier AI, that includes Anthropic, OpenAI, Google, and Meta, among others. Some are focused businesses; others are divisions within much larger companies, which changes how you can invest in them and how much of their value comes from AI."]], ["Compare the business models", ["Ask how each company makes money: selling to businesses, selling subscriptions to consumers, advertising, or using AI to strengthen other products. Different models carry different risks and margins."]], ["Compare the numbers", ["Where public data exists, compare revenue growth, margins, cash flow, and spending commitments. For example, Anthropic's IPO filing reports $33.2 billion of revenue for the first nine months of 2026, alongside an operating loss and very large long-term spending commitments for computing power. Look for comparable data for each competitor and note its date and source."]], ["Compare the moats", ["Consider each company's advantages: technology, data, distribution to existing customers, talent, partnerships, cost of computing, and trust. In fast-moving industries, today's leader can be challenged quickly, so moats deserve extra scrutiny."]], ["Hold your conclusions humbly", ["\"The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge\" (Proverbs 18:15). Industries change quickly. Revisit your analysis as new facts arrive, and keep any single company a modest part of your portfolio."]]], "pros": ["Reveals strengths and weaknesses side by side", "Reduces the pull of hype", "Applies to any industry", "Builds disciplined judgment"], "cons": ["Data is often incomplete for private companies or divisions", "Fast-moving industries change quickly", "Comparisons involve judgment", "Headlines can distort the picture"], "watch": ["Note the date and source of every number.", "Compare like with like.", "Remember that some competitors are parts of larger companies.", "Avoid concentrating in one hot industry."], "tip": "Build a simple one-page table: company, how it makes money, revenue growth, profitability, main advantage, main risk. Update it each quarter. Patterns appear that no headline will show you.", "fit": {"starter": "Start with the framework, not the stocks.", "mom": "Discuss with older children how companies compete.", "rebuilder": "Use comparisons to resist investment pressure.", "ent": "Apply this framework to your own competitors.", "exec": "Analyze your company's position honestly.", "late": "Keep any industry bet small within a diversified plan.", "retiree": "Favor diversified funds over single-industry bets.", "legacy": "Teach the next generation to see the whole field."}, "example": "Erin builds a one-page table comparing four AI companies. She notes which are standalone businesses and which are divisions of larger companies, records each figure with its date and source, and lists one key advantage and one key risk for each. She concludes she understands the field better, and keeps her AI exposure to a broad index fund plus one small individual position. (Hypothetical example.)", "terms": [["Competitive analysis", "Comparing companies in the same industry."], ["Business model", "How a company makes money."], ["Operating margin", "Operating income as a percentage of revenue."], ["Pure play", "A company focused on one business."], ["Division", "A business unit inside a larger company."], ["Market share", "A company's portion of total industry sales."]], "verse": ["The heart of the prudent getteth knowledge; and the ear of the wise seeketh knowledge.", "Proverbs 18:15"], "check": ["List the main competitors in one industry", "Note how each makes money", "Build a one-page comparison table with sources", "Revisit it next quarter"], "quiz": [{"q": "Competitive analysis compares:", "o": ["Companies in the same industry", "Unrelated companies", "Only stock prices"], "a": 0, "why": "Like with like."}, {"q": "A business model describes:", "o": ["How a company makes money", "Its logo", "Its stock price"], "a": 0, "why": "Models carry different risks."}, {"q": "A pure play is:", "o": ["A company focused on one business", "A diversified conglomerate", "A bond"], "a": 0, "why": "Some AI leaders are divisions of larger companies."}, {"q": "When comparing numbers, always note:", "o": ["The date and source", "Only the largest figure", "Nothing"], "a": 0, "why": "Facts change quickly."}, {"q": "In fast-moving industries, moats:", "o": ["Deserve extra scrutiny", "Never change", "Are guaranteed"], "a": 0, "why": "Leaders can be challenged quickly."}, {"q": "Anthropic's filing reports nine-month 2026 revenue of:", "o": ["$33.2 billion", "$3.3 million", "$330 billion"], "a": 0, "why": "Alongside an operating loss and large commitments."}, {"q": "Investing in a division of a large company means:", "o": ["Much of your investment depends on other businesses too", "You own only the division", "There is no risk"], "a": 0, "why": "AI may be one part of its value."}, {"q": "A wise approach to a hot industry is:", "o": ["Keeping exposure modest within a diversified plan", "Investing everything", "Ignoring risk"], "a": 0, "why": "Concentration is risky."}, {"q": "Operating margin is:", "o": ["Operating income as a percentage of revenue", "Total debt", "Share count"], "a": 0, "why": "It shows profitability."}, {"q": "Proverbs 18:15 says the ear of the wise:", "o": ["Seeketh knowledge", "Ignores counsel", "Follows hype"], "a": 0, "why": "Keep learning as facts change."}]}, "steward-9": {"deep": true, "mins": 13, "intro": "Every generation meets a new technology that promises to change the world, and often it does. But the path from promise to profit is rarely smooth. Sectors move in cycles, and bubbles form when excitement outruns reality. Understanding them helps you stay steady when others are swept away.", "connect": "Discernment in every cycle protects your why from both fear and greed.", "sections": [["Sector cycles", ["Different parts of the economy, such as technology, energy, health care, and consumer goods, lead and lag at different times. Interest rates, the economy, and innovation all shift which sectors are rewarded. A diversified portfolio owns them all, so you do not have to guess which will lead next."]], ["How bubbles form", ["A bubble forms when prices rise far above what the underlying businesses can justify, driven by excitement, easy money, and the fear of missing out. Common signs include stories that justify any price, borrowing to invest, newcomers promising quick riches, and the belief that \"this time is different.\""]], ["The dot-com lesson", ["In the late 1990s, investors poured money into internet companies. The internet did transform the world, but the Nasdaq Composite fell roughly 78% from its March 2000 peak to its October 2002 low, and many companies disappeared. Some survivors, like Amazon, eventually thrived, but it took many years to recover."]], ["Applying it to today's AI boom", ["Artificial intelligence may prove as transformative as the internet. Even so, some valuations may run ahead of reality, and some companies will not succeed. A transformative technology and a wise price are two different questions. Ask both."]], ["Staying steady", ["Keep your allocation, rebalance, avoid borrowing to invest, and keep any single theme a modest part of your portfolio. \"Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase\" (Proverbs 13:11)."]]], "pros": ["Helps you recognize excitement outrunning reality", "Protects you from buying at peaks", "Keeps you diversified across cycles", "Draws wisdom from history"], "cons": ["Bubbles are only certain in hindsight", "Prices can stay high longer than expected", "Avoiding a bubble may mean missing some gains", "Cycles are unpredictable"], "watch": ["Never borrow to invest in a hot theme.", "Keep any single sector or theme modest.", "Be skeptical of promises of quick riches.", "Rebalance when one sector dominates your portfolio."], "tip": "When friends who have never invested start recommending a hot stock or theme, take it as a gentle signal to review your allocation, not as a reason to buy more.", "fit": {"starter": "Broad funds protect you from betting on one sector.", "mom": "Teach children that excitement is not a strategy.", "rebuilder": "Avoid chasing booms while you rebuild.", "ent": "Watch for cycles in your own industry and prepare reserves.", "exec": "If you work in a hot sector, diversify outside it.", "late": "Avoid concentrating in a boom as you near retirement.", "retiree": "Protect income from bubble-driven swings.", "legacy": "Pass on the lessons of history."}, "example": "In a year when AI stocks soar, Monica's technology holdings grow from 25% to 40% of her portfolio. Remembering the dot-com lesson, she rebalances back to her target, keeps investing monthly, and avoids borrowing. When the sector later falls sharply, her portfolio declines far less than it would have. (Hypothetical example.)", "terms": [["Sector", "A part of the economy, such as technology or energy."], ["Cycle", "A recurring pattern of rising and falling."], ["Bubble", "Prices far above what fundamentals justify."], ["FOMO", "Fear of missing out."], ["Nasdaq Composite", "An index of stocks listed on the Nasdaq exchange."], ["Theme investing", "Investing around a trend, such as AI."]], "verse": ["Wealth gotten by vanity shall be diminished: but he that gathereth by labour shall increase.", "Proverbs 13:11"], "check": ["Calculate your largest sector as a share of your portfolio", "List the signs of a bubble you will watch for", "Read one account of the dot-com era", "Set a maximum for any single theme"], "quiz": [{"q": "A bubble forms when:", "o": ["Prices rise far above what businesses can justify", "Prices are fair", "Markets close"], "a": 0, "why": "Excitement outruns reality."}, {"q": "A common bubble sign is:", "o": ["Believing \"this time is different\"", "Careful research", "Low trading"], "a": 0, "why": "It often precedes declines."}, {"q": "From its March 2000 peak to its October 2002 low, the Nasdaq Composite fell roughly:", "o": ["78%", "5%", "200%"], "a": 0, "why": "Many companies disappeared."}, {"q": "A transformative technology and a wise price are:", "o": ["Two different questions", "The same thing", "Unrelated to investing"], "a": 0, "why": "Ask both."}, {"q": "Diversification across sectors means:", "o": ["You do not have to guess which will lead", "You own only one sector", "You avoid all losses"], "a": 0, "why": "Sectors lead at different times."}, {"q": "Borrowing to invest in a hot theme is:", "o": ["Especially risky", "Always wise", "Required"], "a": 0, "why": "Losses are magnified."}, {"q": "When one sector dominates your portfolio, you can:", "o": ["Rebalance", "Buy more of it", "Ignore it"], "a": 0, "why": "Rebalancing restores your plan."}, {"q": "Bubbles are certain:", "o": ["Only in hindsight", "Always in advance", "Never"], "a
