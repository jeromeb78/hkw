 if(L.type==='furnisher')return head+`[Creditor name]\n[Dispute address listed on your credit report]\n\nRe: Dispute of information you report to the credit bureaus\nAccount: ${ac}, ${no}\n\nTo whom it may concern:\n\nYou are reporting information about this account to the credit reporting companies that is inaccurate because ${is}.\n\nI request that you investigate and ask the credit reporting companies to have this item ${L.fix}. Enclosed are copies of documents that support my request.\n\nPlease send me the results of your investigation in writing.`+sig+`\n\nEnclosures: copy of the credit report section with the item highlighted; supporting documents`;
 if(L.type==='goodwill')return head+`[Creditor name]\n[Customer service address]\n\nRe: Goodwill request for account ${ac}, ${no}\n\nDear customer care team:\n\nThank you for serving me as a customer. I am writing about a late payment reported on my account. It happened because ${is}. Since then, I have paid on time and worked hard to rebuild my financial health.\n\nI take responsibility for the late payment. As a gesture of goodwill, I respectfully ask that you consider removing it from my credit reports. Thank you for your time and consideration.`+sig;
 if(L.type==='followup')return head+`${b.addr}\n\nRe: Failure to complete reinvestigation within the time required by law\n\nTo whom it may concern:\n\nOn [date your dispute was received, from your certified mail receipt], you received my dispute of the following item on my credit report:\n\nAccount name: ${ac}\nAccount number: ${no}\nReason for dispute: ${is}\n\nUnder the Fair Credit Reporting Act, 15 U.S.C. § 1681i(a)(1), you were required to complete your reinvestigation within 30 days of receiving my dispute. As of today, I have not received the results of a completed reinvestigation.\n\nBecause this information has not been verified within the time required, I request that you promptly delete it from my credit file and send me written confirmation and an updated copy of my credit report.\n\nEnclosed is a copy of my original dispute letter and my certified mail receipt.`+sig+`\n\nEnclosures: copy of original dispute; certified mail receipt; copy of my government-issued ID; proof of address`;
 if(L.type==='cease')return head+`[Debt collector name]\n[Address from their notice]\n\nRe: Request to stop all communication\nReference: ${ac}, ${no}\n\nTo whom it may concern:\n\nUnder the Fair Debt Collection Practices Act, 15 U.S.C. section 1692c(c), I am requesting that you stop all communication with me regarding the account referenced above. Do not contact me by telephone, text, email, at my home, or at my workplace.\n\nThis letter is not an acknowledgment that I owe this debt, and it is not a promise to pay.${L.issue?`\n\n${is}`:''}\n\nAny further communication must be in writing, sent to the address above, and only as the law allows.`+sig;
 return head+`[Debt collector name]\n[Address from their notice]\n\nRe: Request for validation of debt\nReference: ${ac}, ${no}\n\nTo whom it may concern:\n\nI am responding to your notice dated [date of their first notice]. I dispute this debt and request validation, including the amount you claim I owe, the name of the original creditor, and documentation showing that I owe this debt and that you are authorized to collect it.\n\nPlease do not continue collection activity until you have provided this validation. ${L.issue?'Additional information: '+L.issue+'.':''}`+sig;
}
function vCredit(){
 const F=[['Payment history',35],['Amounts owed',30],['Length of credit history',15],['New credit',10],['Credit mix',10]],L=S.lt;
 return shell(`<div class="stack">
  ${jumpChips([['c-score','Score basics'],['c-lower','What lowers it'],['c-reports','Your reports'],['rights','Disputes'],['c-long','How long items stay'],['c-situations','Situations'],['c-clocks','Old debts'],['c-collectors','Collectors'],['legal-help','Legal help'],['c-letters','Sample letters'],['c-bk','Bankruptcy']])}
  <div class="stack-s"><p class="eyebrow">Your Credit Comeback</p><h1>Build and Restore Your Credit</h1><p class="just">Good credit lowers what you pay for a car, a home, insurance, and sometimes even an apartment or a job. Whether you are starting from zero or rebuilding, here is how to take control.</p></div>
  <div class="band stack-s"><p class="eyebrow">Education, not credit repair</p><p class="small just">Her Kingdom Wealth™ provides financial education only. We do not provide credit repair or credit services, and we never contact credit bureaus or creditors for you. Everything here serves as an educational guide, directing you to the relevant sources of law and to official resources, so you can take appropriate action yourself, in your own name. Your Credit Comeback is free for every member.</p></div>
  ${intl()?`<div class="band small">Your Credit Comeback covers the three U.S. credit bureaus. Credit reporting works differently in other countries, so check your own country's credit agencies.</div>`:''}
  ${wordCard('credit')}
  ${factCard(5)}
  <section class="card stack-s" id="c-score"><span class="eyebrow">Step 1</span><h3>How your credit score is built</h3>${F.map(([n,v])=>`<div class="bar" style="grid-template-columns:150px 1fr 44px"><span>${n}</span><div class="track"><span style="width:${v/35*100}%"></span></div><span class="num">${v}%</span></div>`).join('')}<p class="fine">Weights published by FICO for its scores.</p><p class="small just">Paying every bill on time and keeping balances low compared with your limits (many experts suggest under 30%, and lower is better) matter most.</p></section>
  <section class="gcard stack-s" id="c-lower"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>What can lower your score</p><h3>Know what moves the number</h3>
   <ul class="ul">
    <li><b>A late or missed payment.</b> Payment history is the biggest factor. One payment 30 or more days late can drop a strong score sharply, so set up automatic minimum payments as a safety net.</li>
    <li><b>High balances compared with your limits.</b> This is called your credit utilization. A card near its limit hurts, even if you pay on time. Keep each card, and your total, under 30% of the limit, and under 10% for the best scores.</li>
    <li><b>Too many hard inquiries.</b> Each application for new credit can lower your score a few points. Several in a short time can add up.</li>
    <li><b>Opening several new accounts at once.</b> New accounts lower the average age of your credit.</li>
    <li><b>Closing your oldest cards.</b> Closing a card removes its limit (which raises your utilization) and, over time, shortens your credit history. Keep old, no-fee cards open and use them lightly.</li>
    <li><b>Collections, charge-offs, repossessions, foreclosures, and bankruptcies.</b> These are the heaviest negatives, and most can stay for up to 7 years (some bankruptcies up to 10).</li>
    <li><b>A thin credit file.</b> Having only one type of credit, or very little history, can hold your score back.</li>
   </ul></section>
  <section class="gcard stack-s"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Hard pull or soft pull</p><h3>Not every credit check counts</h3>
   <p class="small just"><b>A soft pull</b> does not affect your score at all. It happens when you check your own credit, when you are prequalified or preapproved for an offer, and often for employment, rental, insurance, or utility checks.</p>
   <p class="small just"><b>A hard pull</b> happens when you apply for new credit, such as a credit card, car loan, or mortgage. It usually lowers a score by fewer than five points, stays on your report for two years, and counts toward your FICO score for about one year.</p>
   <ul class="ul"><li>Before you apply, ask: "Will this be a hard pull or a soft pull?"</li><li>Use prequalification tools, which use soft pulls, to compare offers first.</li><li>Shopping for a mortgage, car loan, or student loan? Do it within about two weeks. FICO counts several of these inquiries as one when they fall within 14 to 45 days, depending on the scoring model.</li><li>Do not apply for several cards just to see if you qualify.</li></ul></section>
  <section class="gcard stack-s"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Three bureaus, three reports</p><h3>Why your scores are different</h3>
   <p class="small just">There are three national credit bureaus: <b>Equifax, Experian, and TransUnion</b>. It is normal for your score to be higher with one than another, because:</p>
   <ul class="ul"><li>Not every lender reports to all three, so each report can hold different accounts.</li><li>Lenders report on different days of the month, so balances can differ.</li><li>There are many scoring models (FICO 8, FICO 10, VantageScore, and others), and each weighs things a little differently.</li><li>An error may appear on one report and not the others.</li></ul>
   <p class="small just">That is why you check all three and <b>dispute with each bureau that shows the error</b>. Fixing it with one does not fix it with the others.</p></section>
  <section class="card stack-s"><span class="eyebrow">Step 2</span><h3>Build credit from scratch</h3><ul class="ul"><li><b>Secured credit card:</b> you place a deposit that becomes your limit. Use it for one small bill and pay it in full every month.</li><li><b>Credit-builder loan:</b> offered by many credit unions; your payments are reported as you build savings.</li><li><b>Authorized user:</b> a trusted person with strong credit adds you to their card.</li><li><b>Rent and utility reporting:</b> some services report on-time rent to the bureaus.</li></ul></section>
  <section class="card stack-s" id="c-reports"><span class="eyebrow">Step 3</span><h3>Check your reports for free</h3><p class="small just">Get free reports from all three bureaus, Equifax, Experian, and TransUnion, <b>every week</b> at <b>AnnualCreditReport.com</b>, the official free site. Review every account, balance, late payment, and your personal information.</p></section>
  <section class="card stack-s"><span class="eyebrow">Step 4</span><h3>Dispute errors the right way</h3><ol class="ul"><li>Write to the credit bureau and to the company that reported the item, explaining what is wrong and why.</li><li>Include copies (never originals) of supporting documents and your highlighted report.</li><li>Send by certified mail with a return receipt, and keep copies of everything.</li><li>Companies generally must investigate within 30 days and report the results to you.</li></ol></section>
  <section class="gcard stack" id="rights"><div class="stack-s"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Know your rights · Credit report disputes</p><h3>What the law says about disputes</h3><p class="small just">The federal Fair Credit Reporting Act sets deadlines for credit bureaus when you dispute an item on your report. Here is the law in its own words, so you can read it for yourself.</p></div>
   ${law('15 U.S.C. § 1681i(a)(1)(A)','...the agency shall, free of charge, conduct a reasonable reinvestigation to determine whether the disputed information is inaccurate and record the current status of the disputed information, or delete the item from the file in accordance with paragraph (5), before the end of the 30-day period beginning on the date on which the agency receives the notice of the dispute from the consumer or reseller.','f1681i')}
   ${lawBox('Read more of what this law says',
    law('15 U.S.C. § 1681i(a)(1)(B)','Except as provided in subparagraph (C), the 30-day period described in subparagraph (A) may be extended for not more than 15 additional days if the consumer reporting agency receives information from the consumer during that 30-day period that is relevant to the reinvestigation.','f1681i')+
    law('15 U.S.C. § 1681i(a)(2)(A)','Before the expiration of the 5-business-day period beginning on the date on which a consumer reporting agency receives notice of a dispute from any consumer or a reseller in accordance with paragraph (1), the agency shall provide notification of the dispute to any person who provided any item of information in dispute, at the address and in the manner established with the person.','f1681i')+
    law('15 U.S.C. § 1681i(a)(5)(A)','If, after any reinvestigation under paragraph (1) of any information disputed by a consumer, an item of the information is found to be inaccurate or incomplete or cannot be verified, the consumer reporting agency shall— (i) promptly delete that item of information from the file of the consumer, or modify that item of information, as appropriate, based on the results of the reinvestigation...','f1681i')+
    '<p class="small just">The full law also addresses when a deleted item may be put back on your report (§ 1681i(a)(5)(B)) and when a bureau may decline a dispute it considers frivolous or irrelevant (§ 1681i(a)(3)). Read those sections, or ask an attorney how they apply to you.</p>')}
   <div class="band stack-s"><p class="eyebrow">Ways women raise their voice</p><ul class="ul"><li>Keep your certified mail receipt, so you have a record of the date the bureau received your dispute.</li><li>The Federal Trade Commission publishes free sample dispute letters, linked below.</li><li>You can file a free complaint with the <a class="link" href="https://www.consumerfinance.gov/complaint/" target="_blank" rel="noopener noreferrer">Consumer Financial Protection Bureau</a> or your state attorney general.</li><li>For questions about your rights or possible claims, speak with a consumer protection attorney.</li></ul></div>
  </section>
  <section class="gcard stack-s" id="c-long"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>How long items can stay</p><h3>What the law says about older information</h3>
   <p class="small just">Federal law limits how long most negative information can appear on a credit report. Generally:</p>
   ${law('15 U.S.C. § 1681c(a)(4)','Accounts placed for collection or charged to profit and loss which antedate the report by more than seven years.','f1681c')}
   ${lawBox('Read more of what this law says',
    law('15 U.S.C. § 1681c(a)(1)','Cases under title 11 or under the Bankruptcy Act that, from the date of entry of the order for relief or the date of adjudication, as the case may be, antedate the report by more than 10 years.','f1681c')+
    law('15 U.S.C. § 1681c(a)(5)','Any other adverse item of information, other than records of convictions of crimes which antedates the report by more than seven years.','f1681c')+
    law('15 U.S.C. § 1681c(c)(1)','The 7-year period referred to in paragraphs (4) and (6) of subsection (a) shall begin, with respect to any delinquent account that is placed for collection (internally or by referral to a third party, whichever is earlier), charged to profit and loss, or subjected to any similar action, upon the expiration of the 180-day period beginning on the date of the commencement of the delinquency which immediately preceded the collection activity, charge to profit and loss, or similar action.','f1681c')+
    '<p class="small just">These limits have exceptions, including for certain large credit, insurance, and employment decisions (§ 1681c(b)). Read the full law for details.</p>')}
   <p class="small just">Accurate information may lawfully remain for the full period the law allows. Be cautious of anyone who promises to "erase" accurate information for a fee.</p></section>
  <section class="gcard stack-s" id="c-situations"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Situations worth looking into</p><h3>Real situations women face</h3>
   <p class="small just">These are common situations that may be worth reviewing on your credit report. Whether any of them applies to you depends on your facts and on the law where you live, so treat this as a starting point for your own research and for a conversation with an attorney.</p>
   <ul class="ul">
    <li><b>A spouse's debt from before the marriage.</b> Whether one spouse can be held responsible for the other's debts depends on state law, and there are exceptions to the general rules. Community property states such as Texas and California have their own rules for personal liability and for shared property. Texas law, for example, is quoted below.</li>
    <li><b>An account you do not recognize,</b> which may be identity theft or a "mixed file" with someone who has a similar name. <a class="link" href="https://www.identitytheft.gov/" target="_blank" rel="noopener noreferrer">IdentityTheft.gov</a> (from the Federal Trade Commission) explains the federal recovery process.</li>
    <li><b>An item that may be older than the law allows.</b> See "How long items can stay" above.</li>
    <li><b>A delinquency date that looks different</b> from what you remember. The reporting period is measured from the date described in § 1681c(c)(1).</li>
    <li><b>The same debt listed twice,</b> a paid or settled account still showing a balance, or a debt discharged in bankruptcy still showing as owed. The dispute process covers information that is inaccurate or incomplete.</li>
    <li><b>Medical collections.</b> The three national credit bureaus have announced that they no longer report paid medical collections or medical collections under $500, and that unpaid medical collections wait a year before appearing. Some states have their own medical debt laws.</li>
    <li><b>An account you were only an authorized user on.</b> You can ask the card company to remove you as an authorized user.</li>
    <li><b>A late payment you believe was reported in error,</b> or an account shown as "closed by creditor" that you closed yourself.</li>
    <li><b>A true late payment with a hardship behind it.</b> Some creditors will consider a goodwill request. They are not required to agree.</li>
   </ul>
   ${lawBox('Texas example: what the law says about spouses and debts',
    law('Texas Family Code § 3.201(a)','A person is personally liable for the acts of the person\'s spouse only if: (1) the spouse acts as an agent for the person; or (2) the spouse incurs a debt for necessaries as provided by Subchapter F, Chapter 2.','txfam3')+
    law('Texas Family Code § 3.201(c)','A spouse does not act as an agent for the other spouse solely because of the marriage relationship.','txfam3')+
    law('Texas Family Code § 3.202(a)','A spouse\'s separate property is not subject to liabilities of the other spouse unless both spouses are liable by other rules of law.','txfam3')+
    law('Texas Family Code § 3.202(b)','Unless both spouses are personally liable as provided by this subchapter, the community property subject to a spouse\'s sole management, control, and disposition is not subject to: (1) any liabilities that the other spouse incurred before marriage; or (2) any nontortious liabilities that the other spouse incurs during marriage.','txfam3')+
    law('Texas Family Code § 3.202(c)','The community property subject to a spouse\'s sole or joint management, control, and disposition is subject to the liabilities incurred by the spouse before or during marriage.','txfam3')+
    '<p class="small just">These sections work together, and other sections and court decisions may apply. Other states have different laws. A family law or consumer attorney can explain how they apply to you.</p>')}
  </section>
  <section class="gcard stack-s" id="c-clocks"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Two different clocks</p><h3>Credit reporting and the statute of limitations</h3>
   <p class="small just"><b>The credit reporting clock</b> is set by federal law, as quoted in "How long items can stay" above.</p>
   <p class="small just"><b>The statute of limitations</b> is the time limit for filing a lawsuit to collect a debt. Each state sets its own. Federal debt collection rules describe a debt past that limit this way:</p>
   ${law('12 C.F.R. § 1006.26(a)(2)','Time-barred debt means a debt for which the applicable statute of limitations has expired.','regf26')}
   ${law('12 C.F.R. § 1006.26(b)','A debt collector must not bring or threaten to bring a legal action against a consumer to collect a time-barred debt.','regf26')}
   <div class="warnbox stack-s"><p class="warn-title">WARNING: BEFORE YOU PAY A DEBT IN COLLECTIONS, CHECK YOUR STATE'S STATUTE OF LIMITATIONS</p>
    <p class="small just">In some states, a payment, a promise to pay, or a signed acknowledgment of an old debt can affect whether the time limit has passed, and can bring an old balance back into play. The rules differ from state to state, and they can depend on who holds the debt.</p>
    <p class="small just">I have seen women pay $30 just to make the calls stop, and wake up responsible again for a $20,000 debt. Please, sister, do not let pressure push you into paying before you know your rights.</p>
    <p class="small just">Texas law is one example of how the rules can differ:</p>
    ${law('Texas Finance Code § 392.307(c)','A debt buyer may not, directly or indirectly, commence an action against or initiate arbitration with a consumer to collect a consumer debt after the expiration of the applicable limitations period provided by Section 16.004, Civil Practice and Remedies Code, or Section 3.118, Business & Commerce Code.','tx392')}
    ${law('Texas Finance Code § 392.307(d)','If an action to collect a consumer debt is barred under Subsection (c), the cause of action is not revived by a payment of the consumer debt, an oral or written reaffirmation of the consumer debt, or any other activity on the consumer debt.','tx392')}
    <p class="small just">Section 392.307 applies to debt buyers. When a debt has not been sold to a debt buyer, other Texas law may apply, including this section:</p>
    ${law('Texas Civil Practice and Remedies Code § 16.065','An acknowledgment of the justness of a claim that appears to be barred by limitations is not admissible in evidence to defeat the law of limitations if made after the time that the claim is due unless the acknowledgment is in writing and is signed by the party to be charged.','tx16')}
    <p class="small just"><b>Before you pay, promise, or sign anything on an old debt, we encourage you to read your state's law and speak with a licensed attorney.</b> The CFPB publishes a free sample letter, "I need more information about this debt," linked below.</p></div></section>
  <section class="gcard stack-s" id="c-collectors"><p class="eyebrow su-step"><span class="step-gem" aria-hidden="true"></span>Stop the harassment</p><h3>What the law says about debt collectors</h3>
   <p class="small just">No one has the right to stalk, threaten, or torment you over a debt. The federal Fair Debt Collection Practices Act applies to debt collectors, and many states add their own protections. Here is what the federal law says, in its own words.</p>
   ${law('15 U.S.C. § 1692d','A debt collector may not engage in any conduct the natural consequence of which is to harass, oppress, or abuse any person in connection with the collection of a debt.','f1692d')}
   ${lawBox('Read more of what federal law says',
    '<p class="small"><b>Among the conduct § 1692d lists as violations:</b></p>'+
    law('15 U.S.C. § 1692d(1)','The use or threat of use of violence or other criminal means to harm the physical person, reputation, or property of any person.','f1692d')+
    law('15 U.S.C. § 1692d(2)','The use of obscene or profane language or language the natural consequence of which is to abuse the hearer or reader.','f1692d')+
    law('15 U.S.C. § 1692d(5)','Causing a telephone to ring or engaging any person in telephone conversation repeatedly or continuously with intent to annoy, abuse, or harass any person at the called number.','f1692d')+
    '<p class="small"><b>When and where a collector may contact you.</b> Without your consent or a court\'s permission, a debt collector may not communicate with you:</p>'+
    law('15 U.S.C. § 1692c(a)(1)','at any unusual time or place or a time or place known or which should be known to be inconvenient to the consumer. In the absence of knowledge of circumstances to the contrary, a debt collector shall assume that the convenient time for communicating with a consumer is after 8 o\'clock antemeridian and before 9 o\'clock postmeridian, local time at the consumer\'s location;','f1692c')+
    law('15 U.S.C. § 1692c(a)(3)','at the consumer\'s place of employment if the debt collector knows or has reason to know that the consumer\'s employer prohibits the consumer from receiving such communication.','f1692c')+
    '<p class="small"><b>Telling others about your debt.</b> The law generally limits who a collector may contact about your debt:</p>'+
    law('15 U.S.C. § 1692c(b)','...a debt collector may not communicate, in connection with the collection of any debt, with any person other than the consumer, his attorney, a consumer reporting agency if otherwise permitted by law, the creditor, the attorney of the creditor, or the attorney of the debt collector.','f1692c')+
    '<p class="small"><b>Asking a collector to stop.</b></p>'+
    law('15 U.S.C. § 1692c(c)','If a consumer notifies a debt collector in writing that the consumer refuses to pay a debt or that the consumer wishes the debt collector to cease further communication with the consumer, the debt collector shall not communicate further with the consumer with respect to such debt, except— (1) to advise the consumer that the debt collector\'s further efforts are being terminated; (2) to notify the consumer that the debt collector or creditor may invoke specified remedies which are ordinarily invoked by such debt collector or creditor; or (3) where applicable, to notify the consumer that the debt collector or creditor intends to invoke a specified remedy.','f1692c')+
    '<p class="small"><b>How often a collector may call.</b> The federal rule sets a presumption for phone calls about a particular debt:</p>'+
    law('12 C.F.R. § 1006.14(b)(2)(ii)','Subject to the exclusions in paragraph (b)(3) of this section, a debt collector is presumed to violate paragraph (b)(1) of this section and FDCPA section 806(5) if the debt collector places a telephone call to a particular person in connection with the collection of a particular debt in excess of either of the telephone call frequencies described in paragraph (b)(2)(i) of this section.','regf14')+
    '<p class="small just">The frequencies in § 1006.14(b)(2)(i) are more than seven calls within seven consecutive days, or a call within seven consecutive days after having had a telephone conversation with the person about the debt. Read the full rule for its exclusions.</p>')}
   ${lawBox('Texas example: what the Texas Debt Collection Act says',
    '<p class="small just">Many states have their own debt collection laws. Texas is shown here as an example. The Texas Debt Collection Act is in Chapter 392 of the Texas Finance Code.</p>'+
    law('Texas Finance Code § 392.301(a)','In debt collection, a debt collector may not use threats, coercion, or attempts to coerce that employ any of the following practices: (1) using or threatening to use violence or other criminal means to cause harm to a person or property of a person; (2) accusing falsely or threatening to accuse falsely a person of fraud or any other crime; ... (5) threatening that the debtor will be arrested for nonpayment of a consumer debt without proper court proceedings; (6) threatening to file a charge, complaint, or criminal action against a debtor when the debtor has not violated a criminal law; (7) threatening that nonpayment of a consumer debt will result in the seizure, repossession, or sale of the person\'s property without proper court proceedings; or (8) threatening to take an action prohibited by law.','tx392')+
    law('Texas Finance Code § 392.302','In debt collection, a debt collector may not oppress, harass, or abuse a person by: (1) using profane or obscene language or language intended to abuse unreasonably the hearer or reader; (2) placing telephone calls without disclosing the name of the individual making the call and with the intent to annoy, harass, or threaten a person at the called number; (3) causing a person to incur a long distance telephone toll, telegram fee, or other charge by a medium of communication without first disclosing the name of the person making the communication; or (4) causing a telephone to ring repeatedly or continuously, or making repeated or continuous telephone calls, with the intent to harass a person at the called number.','tx392')+
    '<p class="small"><b>Remedies the Texas law describes:</b></p>'+
    law('Texas Finance Code § 392.403(a)','A person may sue for: (1) injunctive relief to prevent or restrain a violation of this chapter; and (2) actual damages sustained as a result of a violation of this chapter.','tx392')+
    law('Texas Finance Code § 392.403(b)','A person who successfully maintains an action under Subsection (a) is entitled to attorney\'s fees reasonably related to the amount of work performed and costs.','tx392')+
    law('Texas Finance Code § 392.403(e)','A person who successfully maintains an action under this section for violation of Section 392.101, 392.202, or 392.301(a)(3) is entitled to not less than $100 for each violation of this chapter.','tx392')+
    law('Texas Finance Code § 392.404(a)','A violation of this chapter is a deceptive trade practice under Subchapter E, Chapter 17, Business & Commerce Code, and is actionable under that subchapter.','tx392')+
    law('Texas Finance Code § 392.402(a)','Except as provided by Subsection (d), a person commits an offense if the person violates this chapter.','tx392')+
    '<p class="small just">Chapter 392 also includes definitions, other prohibited practices, defenses, and time limits that are not shown here. Read the full chapter, and speak with an attorney about your situation.</p>')}
   <p class="eyebrow" style="margin-top:6px">Where to report harassment</p>

   <p class="fine">Many women find it helpful to keep a log of every call: the date, the time, the caller, and what was said, along with voicemails and letters.</p></section>

  <section class="card stack-s"><span class="eyebrow">Step 5</span><h3>Protect yourself from identity theft</h3><p class="small just">Placing a credit freeze at each bureau is free and stops new accounts from being opened in your name. If someone used your identity, report it at <b>IdentityTheft.gov</b> for a recovery plan.</p></section>
  <section class="stack"><p class="eyebrow">The three credit bureaus</p><p class="small muted">Each bureau accepts disputes online, by phone, or by mail. Email and fax are not standard options.</p>

   <p class="small just">The federal agencies that enforce these laws publish their own free sample letters. They are self-help educational templates, linked here as a guide to the source. Please read each agency's instructions, and we encourage you to speak with a licensed attorney before you sign or send any letter.</p>

   <p class="small just">The CFPB offers five sample letters: "I do not owe this debt," "I need more information about this debt," "I want the debt collector to stop contacting me," "I want the debt collector to only contact me through my lawyer," and "I want to specify how the debt collector can contact me."</p>

 ['Why we give',['Giving reflects the heart of God, who gave His Son. Generosity loosens money\'s grip on us and turns wealth into a tool for His kingdom.','"It is more blessed to give than to receive" (Acts 20:35). Givers are promised refreshing: "The liberal soul shall be made fat: and he that watereth shall be watered also himself" (Proverbs 11:25).'],['2 Corinthians 9:7','Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.']],
 ['Give from overflow, not from lack',['Generosity and security go together. Scripture also says to provide for your own household (1 Timothy 5:8). Build your emergency fund and protect your family, then give joyfully from a stable foundation.','Giving beyond your means can leave you without options in an emergency. A sustainable plan lets you give more, for longer.'],['Proverbs 3:9','Honour the LORD with thy substance, and with the firstfruits of all thine increase.']],
 ['Tithes and offerings',['Many believers give a tithe, a tenth of their income, to their local church, and offerings beyond it. Decide prayerfully what you will give first, before other spending, and automate it.'],['Malachi 3:10','Bring ye all the tithes into the storehouse, that there may be meat in mine house.']],
 ['Choosing causes and vetting charities',['Choose a few causes you care about deeply (your church, education, women and children, missions, your community) rather than many small gifts.','Before giving, look up a charity on Candid (GuideStar), Charity Navigator, or the IRS Tax Exempt Organization Search to confirm its status and see how it uses donations.'],['Luke 16:10','He that is faithful in that which is least is faithful also in much.']],
 ['Ways to give as your wealth grows',['Direct gifts: cash or check to a church or charity. Appreciated stock: giving shares you have held for more than a year can avoid capital gains tax. Donor-advised fund: give now, receive a possible deduction, and grant to charities over time. Charitable remainder trust: income for you, the remainder to charity. Family foundation: for substantial, multigenerational giving. Qualified charitable distribution: from age 70½, give directly from an IRA.','Tax rules for charitable giving change. Plan larger gifts with a certified tax professional and an estate planning attorney.'],['Matthew 6:21','For where your treasure is, there will your heart be also.']],

 ['Building a legacy of generosity',['Teach your children to give by giving together. Write a one-page giving plan: your tithe, the causes you fund, a yearly goal to grow your giving, and how you will give. Revisit it each year.'],['Proverbs 13:22','A good man leaveth an inheritance to his children\'s children.']]

function givingOut(){const g=S.gv,t=g.inc*g.tithe/100,x=g.inc*g.extra/100;
 return `<div class="scen"><div><div class="lab">Tithe / month</div><div class="val num">${usd(t)}</div></div><div><div class="lab">Extra / month</div><div class="val num">${usd(x)}</div></div><div><div class="lab">Total / year</div><div class="val num">${usd((t+x)*12)}</div></div></div>
  <p class="small just" style="margin-top:10px"><b>What this means:</b> giving ${usd(t+x)} a month adds up to ${usd((t+x)*12)} a year to bless your church and the causes you love. Build your emergency fund alongside it, so your giving rests on a secure foundation.</p>`}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.gv){const n=parseFloat(el.value);S.gv[el.dataset.gv]=isNaN(n)?0:n;const o=document.getElementById('gv-out');if(o)o.innerHTML=givingOut()}});
function copyText(t,el){const done=()=>toast('Copied.');try{navigator.clipboard.writeText(t).then(done).catch(()=>{if(el){el.select();toast('Select all and copy using your keyboard or menu.')}})}catch(e){if(el)el.select()}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.sc!=null){const i=+d.sc;S.sc[i]=!S.sc[i];const y=scrollY;render();scrollTo(0,y);return}
 if(d.mq){const [qi,t]=d.mq.split('|');S.ms.a[+qi]=t;render();return}
 if(d.ltype){S.lt.type=d.ltype;render();const el=document.getElementById('letters');if(el)el.scrollIntoView({block:'start'});return}
 if(d.copyaddr){copyText(BUREAUS[d.copyaddr].addr);return}
 if(d.act==='copy-letter'){copyText(letterText(),document.getElementById('letter-out'));return}
});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.mp){S.ms.p[el.dataset.mp]=el.value;return}
 if(el.dataset.lf&&el.tagName!=='SELECT'){S.lt[el.dataset.lf]=el.value;const o=document.getElementById('letter-out');if(o)o.value=letterText()}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.lf&&el.tagName==='SELECT'){S.lt[el.dataset.lf]=el.value;const o=document.getElementById('letter-out');if(o)o.value=letterText()}});
